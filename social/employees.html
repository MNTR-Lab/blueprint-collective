<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blueprint Social Studio — Employees</title><style>body{font:15px system-ui;background:#f5f7fb;color:#19283e;margin:0}.wrap{max-width:850px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #dde3ee;border-radius:16px;padding:25px;margin:18px 0}label{display:block;margin:12px 0;font-weight:600}input,select{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#dc2845;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.small{padding:7px 10px;margin:4px}.row{padding:16px 0;border-bottom:1px solid #ddd}.muted{color:#64748b}.error{color:#b42339}a{color:#2859df}</style><div class="wrap"><a href="index.html">← Publishing desk</a><h1>Employee access</h1><p id="msg"></p><section class="card" id="login"><h2>Super admin sign-in</h2><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form></section><main id="work" hidden><section class="card"><h2>Invite employee</h2><p class="muted">Invite a Social Studio employee and assign their first client.</p><form id="invite"><label>Name<input name="full_name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>First client<select name="organization_slug" id="inviteOrg" required></select></label><button>Send invitation</button></form></section><section class="card"><h2>Employees</h2><div id="people"></div></section><section class="card"><h2>Add another client to an employee</h2><form id="grant"><label>Employee<select name="email" id="grantEmail" required></select></label><label>Client<select name="organization_slug" id="grantOrg" required></select></label><button>Grant access</button></form></section><button id="logout">Sign out</button></main></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const base='https://lbheezjanvalalinqxcd.supabase.co',key='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',sb=createClient(base,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orgs=[],people=[],grants=[];function msg(s,bad=false){$('msg').textContent=s;$('msg').className=bad?'error':'muted'}
async function call(action,body={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in first');const r=await fetch(base+'/functions/v1/blueprint-social',{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...body})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function refresh(){const b=await call('bootstrap');if(!b.master)throw Error('Super admin access required');orgs=b.organizations;const [e,g]=await Promise.all([call('employee_list'),call('access_list')]);people=e.employees;grants=g.grants;const opts=orgs.map(o=>`<option value="${esc(o.slug)}">${esc(o.name)}</option>`).join('');$('inviteOrg').innerHTML=opts;$('grantOrg').innerHTML=opts;$('grantEmail').innerHTML=people.filter(p=>p.active).map(p=>`<option value="${esc(p.email)}">${esc(p.full_name)} (${esc(p.email)})</option>`).join('');$('people').innerHTML=people.map(p=>`<div class="row"><strong>${esc(p.full_name)}</strong> · ${esc(p.email)} · ${p.active?'Active':'Disabled'} <button class="small" data-status="${esc(p.email)}" data-active="${!p.active}">${p.active?'Deactivate':'Reactivate'}</button><div>${grants.filter(g=>g.email===p.email).map(g=>`<span style="display:inline-block;margin:5px;padding:7px;background:#f1f5fb;border-radius:8px">${esc(orgs.find(o=>o.slug===g.organization_slug)?.name||g.organization_slug)} <button class="small" data-revoke="${esc(p.email)}" data-org="${esc(g.organization_slug)}">Remove</button></span>`).join('')||'<span class="muted">No clients assigned</span>'}</div></div>`).join('')||'<p class="muted">No employees invited yet.</p>';$('login').hidden=true;$('work').hidden=false}
$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await refresh();msg('Signed in')}catch(x){msg(x.message,true)}};
$('invite').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await call('employee_invite',Object.fromEntries(new FormData(e.target)));e.target.reset();await refresh();msg('Invitation sent. Employee can set a password using the email link.')}catch(x){msg(x.message,true)}finally{b.disabled=false}};
$('grant').onsubmit=async e=>{e.preventDefault();try{await call('access_grant',Object.fromEntries(new FormData(e.target)));await refresh();msg('Client assigned')}catch(x){msg(x.message,true)}};
$('people').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.status){if(!confirm('Change employee access?'))return;await call('employee_status',{email:b.dataset.status,active:b.dataset.active==='true'})}else if(b.dataset.revoke){await call('access_revoke',{email:b.dataset.revoke,organization_slug:b.dataset.org})}await refresh();msg('Access updated')}catch(x){msg(x.message,true)}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};try{const {data:{session}}=await sb.auth.getSession();if(session)await refresh()}catch(x){msg(x.message,true)}
</script></html>
