<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rolling Social Calendar | Blueprint Collective</title><meta name="description" content="Upcoming seven days of approved social content"><link rel="stylesheet" href="calendar.css"><style>
main{max-width:1450px}.rolling-top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.rolling-top h2{font-size:21px;margin:0}.rolling-top p{color:var(--muted);margin:4px 0 0;font-size:12px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.controls select{border:1px solid var(--line);border-radius:8px;padding:9px;background:white}.count{font-size:12px;font-weight:700;background:#e9f0ff;padding:9px 13px;border-radius:9px;color:#244eaa}.rolling-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.rolling-day{background:white;border:1px solid var(--line);border-radius:13px;min-height:260px;overflow:hidden}.rolling-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.day-head{padding:14px 12px;background:#f1f5fb;border-bottom:1px solid var(--line)}.today .day-head{background:#e7efff}.day-head strong{display:block;font-size:14px}.day-head small{color:var(--muted);font-size:11px}.day-posts{padding:9px}.post{background:#f5f7fc;border-left:3px solid var(--accent);border-radius:7px;padding:9px;margin-bottom:9px}.post time{font-size:11px;font-weight:800}.post h3{font-size:12px;line-height:1.35;margin:5px 0;overflow-wrap:anywhere}.post p{font-size:10px;color:#64748b;margin:4px 0}.post details{margin-top:8px}.post summary{cursor:pointer;font-size:10px;color:var(--accent)}.post .caption{white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere}.post a{display:inline-block;font-size:10px;margin:6px 8px 0 0;color:var(--accent);overflow-wrap:anywhere}.no-posts{font-size:11px;color:var(--muted);padding:12px 5px}.status-line{font-size:12px;color:var(--muted);margin:12px 0 18px}.status-line.error{color:#ba3232}@media(max-width:1100px){.rolling-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.rolling-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rolling-day{min-height:150px}main{padding:20px 13px}}@media(max-width:420px){.rolling-grid{grid-template-columns:1fr}}
</style></head><body><main><header><div><p class="eyebrow">SOCIAL CONTENT CALENDAR</p><h1 id="organizationName">Your content plan.</h1><p class="subhead">Your next seven days of scheduled social content.</p></div><div class="read-only">View only <span>•</span> Eastern Time</div></header><div class="rolling-top"><div><h2 id="rangeTitle">Upcoming 7 days</h2><p>Today and the next six days · Past days disappear automatically</p></div><div class="controls"><span id="count" class="count">0 posts scheduled</span><label class="sr-only" for="platform">Platform</label><select id="platform"><option value="">All platforms</option></select><button id="refresh">↻ Refresh</button></div></div><p id="message" class="status-line" role="status">Loading calendar…</p><section id="grid" class="rolling-grid" aria-label="Rolling seven-day publishing calendar"></section><footer><span id="updated"></span><span>Powered by <strong>Blueprint Collective</strong></span></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),slug=query.get('organization')||'nal';
const API='https://lbheezjanvalalinqxcd.supabase.co/functions/v1/blueprint-social-calendar';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const dayET=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dateAdd=(key,n)=>{const d=new Date(key+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const pretty=(key,opts)=>new Date(key+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',...opts});
const clock=key=>{const m=String(key).match(/T(\d\d):(\d\d)/);if(!m)return 'Time TBD';const h=Number(m[1]);return `${h%12||12}:${m[2]} ${h<12?'AM':'PM'}`};
let events=[],lastDay='',loading=false;
function render(){const today=dayET(),end=dateAdd(today,6);$('rangeTitle').textContent=pretty(today,{month:'short',day:'numeric'})+' – '+pretty(end,{month:'short',day:'numeric',year:'numeric'});const platform=$('platform').value;
const visible=events.filter(e=>{const t=String(e.publish_at_et||'').slice(0,10);return t>=today&&t<=end&&(!platform||String(e.platform||'').split(',').map(s=>s.trim()).includes(platform))}).sort((a,b)=>String(a.publish_at_et).localeCompare(String(b.publish_at_et)));
$('count').textContent=visible.length+' '+(visible.length===1?'post':'posts')+' scheduled';
$('grid').innerHTML=Array.from({length:7},(_,i)=>{const key=dateAdd(today,i),rows=visible.filter(e=>String(e.publish_at_et).startsWith(key));return `<section class="rolling-day ${i===0?'today':''}"><div class="day-head"><strong>${i===0?'TODAY · ':''}${esc(pretty(key,{weekday:'long'}))}</strong><small>${esc(pretty(key,{month:'short',day:'numeric'}))} · ${rows.length} ${rows.length===1?'post':'posts'}</small></div><div class="day-posts">${rows.length?rows.map(e=>`<article class="post"><time>${esc(clock(e.publish_at_et))} ET</time><h3>${esc(e.title)}</h3><p>${esc(e.platform||'')} ${e.campaign?'· '+esc(e.campaign):''}</p>${e.caption?`<details><summary>View caption</summary><p class="caption">${esc(e.caption)}</p></details>`:''}${safe(e.asset_link)?`<a href="${esc(safe(e.asset_link))}" target="_blank" rel="noopener">View asset ↗</a>`:''}${safe(e.destination_link)?`<a href="${esc(safe(e.destination_link))}" target="_blank" rel="noopener">Destination ↗</a>`:''}</article>`).join(''):'<p class="no-posts">No scheduled posts</p>'}</div></section>`}).join('');}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;$('message').classList.remove('error');$('message').textContent='Refreshing schedule…';const today=dayET(),end=dateAdd(today,6),months=[...new Set([today.slice(0,7),end.slice(0,7)])];try{const responses=await Promise.all(months.map(async month=>{const u=new URL(API);u.searchParams.set('organization',slug);u.searchParams.set('month',month);const r=await fetch(u,{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Calendar unavailable');return data}));const all=new Map();for(const data of responses){for(const e of data.events||[])all.set(String(e.monday_id||e.id||JSON.stringify(e)),e)}events=[...all.values()];const org=responses[0].organization||{};$('organizationName').textContent=org.name||'Content calendar';document.title=(org.name||'Content')+' | Rolling Calendar';if(/^#[0-9a-f]{6}$/i.test(org.color||''))document.documentElement.style.setProperty('--accent',org.color);const selected=$('platform').value;const options=[...new Set(events.flatMap(e=>String(e.platform||'').split(',').map(s=>s.trim()).filter(Boolean)))].sort();$('platform').innerHTML='<option value="">All platforms</option>'+options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(options.includes(selected))$('platform').value=selected;lastDay=today;$('message').textContent=responses.some(d=>d.source==='saved')?'Showing the saved content schedule.':'';$('updated').textContent='Refreshed '+new Date().toLocaleString('en-US',{timeZone:'America/New_York'})+' ET';render();}catch(err){$('message').textContent=err.message||'Unable to load calendar';$('message').classList.add('error');render()}finally{loading=false;$('refresh').disabled=false}}
$('refresh').addEventListener('click',load);$('platform').addEventListener('change',render);load();setInterval(()=>{if(dayET()!==lastDay)load();else render()},60000);setInterval(load,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script></body></html>
