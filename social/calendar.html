<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Calendar | Blueprint Collective</title><meta name="description" content="Your organization’s approved social media content calendar."><link rel="stylesheet" href="calendar.css"></head><body><main><header><div><p class="eyebrow">SOCIAL CONTENT CALENDAR</p><h1 id="organizationName">Your content plan.</h1><p class="subhead">A clear view of what’s coming next.</p></div><div class="read-only">View only <span>•</span> Eastern Time</div></header><div class="toolbar"><div class="month-nav"><button id="previous" aria-label="Previous month">←</button><h2 id="monthTitle"></h2><button id="next" aria-label="Next month">→</button><button id="today">Today</button></div><div class="tools"><label class="sr-only" for="platform">Platform</label><select id="platform"><option value="">All platforms</option></select><div class="toggle"><button id="monthView" class="selected">Month</button><button id="agendaView">Agenda</button></div><button id="refresh" aria-label="Refresh calendar">↻</button></div></div><p id="message" class="message" role="status">Loading calendar…</p><section id="monthPanel"><div class="weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="grid" class="calendar-grid" aria-label="Monthly content calendar"></div></section><section class="agenda"><div class="agenda-heading"><h2 id="agendaTitle">Scheduled content</h2><span id="eventCount"></span></div><div id="events"></div></section><footer><span id="updated"></span><span>Powered by <strong>Blueprint Collective</strong></span></footer></main><script src="calendar.js" defer></script></body></html>
