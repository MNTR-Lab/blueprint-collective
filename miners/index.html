function documentView(id){const docs=documentsCache[id]||[];return '<div class="bar"><div><strong>Client Documents ('+docs.length+')</strong><p class="muted">Private files · PDF, images, Word, Excel, and TXT · 10 MB maximum</p></div><button class="btn alt" id="addDocument">+ Upload Document</button></div><div id="documentEditor"></div>'+(docs.length?docs.map(d=>'<div class="journal-entry"><div class="bar"><div><strong>'+esc(d.title)+'</strong><div class="muted">'+esc(d.original_filename)+' · '+(d.size_bytes/1024).toFixed(1)+' KB · '+esc(new Date(d.created_at).toLocaleString())+'</div></div><button class="btn alt" data-download="'+esc(d.id)+'">View / Download</button></div>'+(d.description?'<p class="journal-text">'+esc(d.description)+'</p>':'')+'</div>').join(''):'<p class="muted">No documents uploaded for this client yet.</p>')}
function documentEditor(){const el=$('documentEditor');if(!el)return;el.innerHTML='<form class="contact-form" id="documentForm"><h3>Upload Client Document</h3><div class="fields"><label><span>Document Title</span><input class="field" name="title" required maxlength="250"></label><label><span>Choose File</span><input class="field" type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx,.txt"></label><label class="wide"><span>Description (optional)</span><textarea class="field" name="description" maxlength="2000"></textarea></label></div><div class="actions"><button class="btn" id="saveDocument">Upload Document</button><button class="btn alt" type="button" id="cancelDocument">Cancel</button></div></form>';$('cancelDocument').onclick=()=>el.innerHTML='';$('documentForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveDocument'),file=e.target.elements.file.files[0];const allowed=['application/pdf','image/png','image/jpeg','image/webp','text/plain','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];if(!file||file.size>10485760||!allowed.includes(file.type)){notify('Choose a supported document under 10 MB.','error');return}btn.disabled=true;try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const form=new FormData(e.target);await documentApi('upload',expandedClient,{title:String(form.get('title')||''),description:String(form.get('description')||''),filename:file.name,mime:file.type,base64});await Promise.all([loadDocuments(expandedClient),loadJournal(expandedClient)]);render();notify('Document uploaded successfully.','good')}catch(err){notify('Document upload failed: '+err.message,'error');btn.disabled=false}}}

let myDashboardTasks=[],myDashboardTasksLoaded=false,myDashboardTasksError='';
async function loadMyDashboardTasks(){
 try{
  const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in required');
  const response=await fetch(URL+'/functions/v1/miners-client-tasks',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'list_mine',organization_id:ORG})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load assignments');
  myDashboardTasks=data.tasks||[];myDashboardTasksError='';
 }catch(e){myDashboardTasksError=e.message}myDashboardTasksLoaded=true;
 if(authorized&&page==='dashboard')render();
}
let myUpdates=[],myUpdatesLoaded=false,myUpdatesError='';
async function loadMyUpdates(){
 try{
  const clientIds=[...new Set(myDashboardTasks.map(t=>t.client_id))].slice(0,30);
  const results=await Promise.all(clientIds.map(id=>journalApi('list',id).then(d=>({id,data:d})).catch(()=>null)));
  const email=(await db.auth.getUser()).data.user?.email?.toLowerCase()||'';
  myUpdates=results.filter(Boolean).flatMap(({id,data})=>[
    ...(data.notes||[]).filter(n=>String(n.author_email||'').toLowerCase()!==email).map(n=>({id:n.id,client_id:id,type:'note',title:'Client note',detail:n.body,author:n.author_email,created_at:n.created_at})),
    ...(data.activity||[]).filter(a=>['task_created','task_updated','task_completed'].includes(a.event_type)&&String(a.actor_email||'').toLowerCase()!==email).map(a=>({id:a.id,client_id:id,type:'task',title:a.description,detail:'',author:a.actor_email,created_at:a.created_at}))
  ]).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,40);
  myUpdatesError='';
 }catch(e){myUpdatesError=e.message}
 myUpdatesLoaded=true;if(authorized&&page==='dashboard')render();
}
function myNotificationPanel(){
 const key='miners-notifications-read-v1';

   return '<div style="padding:10px 0;border-bottom:1px solid #e8eaf0"><span class="muted" style="display:block;font-size:12px">'+esc(label)+'</span><strong style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(value)+'</strong></div>';
 }).join('');
 overlay.innerHTML='<div role="dialog" aria-modal="true" aria-label="View record" style="background:#fff;color:#172033;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 20px 70px #0006"><div class="bar"><div><span style="color:#a47a22;font-size:12px;font-weight:800">READ-ONLY VIEW</span><h2 style="margin:6px 0">'+esc(record.title||record.name||'Record')+'</h2></div><button class="btn alt" id="closeRecordView">Close</button></div><div style="margin:15px 0">'+amount+rowsHtml+'</div>'+(section==='pipeline'&&record.stage==='won'?'<div style="border-top:1px solid #e8eaf0;padding-top:16px"><h3>Contract / Approved Proposal</h3><div id="viewRecordDocs" class="muted">Loading agreements…</div></div>':'')+'<div class="actions" style="margin-top:20px"><button class="btn" id="updateFromView">UPDATE</button><button class="btn alt" id="closeRecordView2">Close</button></div></div>';
 document.body.appendChild(overlay);
 const close=()=>overlay.remove();
 $('closeRecordView').onclick=close;
 $('closeRecordView2').onclick=close;
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 $('updateFromView').onclick=()=>{close();editing={section,id:record.id,record};render()};
 if(section==='pipeline'&&record.stage==='won'){
   const el=$('viewRecordDocs');
   try{
     const result=await wonDocApi('list',record.id);
     if(!el.isConnected)return;
     const docs=result.documents||[];
     el.innerHTML=docs.length?docs.map(d=>'<div class="bar" style="padding:10px 0;border-bottom:1px solid #eee"><div><strong>'+esc(d.document_type==='contract'?'Signed Contract':'Approved Proposal')+' · Version '+esc(d.version_number)+'</strong><p class="muted">'+esc(d.original_filename)+' · '+esc(new Date(d.created_at).toLocaleString())+'</p></div><button class="btn alt" data-view-agreement="'+esc(d.id)+'">View / Download</button></div>').join(''):'No agreements uploaded yet.';
     el.querySelectorAll('[data-view-agreement]').forEach(b=>b.onclick=async()=>{try{const d=await wonDocApi('download',record.id,{document_id:b.dataset.viewAgreement});window.open(d.url,'_blank','noopener,noreferrer')}catch(err){notify('Unable to open agreement: '+err.message,'error')}});
   }catch(err){if(el.isConnected)el.textContent='Unable to load agreements: '+err.message}
 }
}

async function wonDocApi(action,opportunity_id,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-opportunity-documents',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,organization_id:ORG,opportunity_id,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Agreement request failed');return data}
async function loadWonDocs(id){const el=$('wonDocsContent');if(!el)return;try{const result=await wonDocApi('list',id);if(!$('wonDocsContent')||editing?.id!==id)return;const docs=result.documents||[];el.innerHTML='<form id="wonDocForm" class="contact-form"><h3>Upload an Agreement</h3><div class="fields"><label><span>Document Type</span><select class="field" name="document_type"><option value="contract">Signed Contract</option><option value="proposal">Approved Proposal</option></select></label><label><span>Choose File</span><input class="field" type="file" name="file" accept=".pdf,.docx,.png,.jpg,.jpeg" required></label></div><div class="actions"><button class="btn" id="wonDocUpload">Upload Agreement</button></div><p class="muted">PDF, Word, PNG or JPG, up to 10 MB. Earlier versions are retained.</p></form><h3>Agreement History ('+docs.length+')</h3>'+(docs.length?docs.map(d=>'<div class="journal-entry"><div class="bar"><div><strong>'+esc(d.document_type==='contract'?'Signed Contract':'Approved Proposal')+' · Version '+esc(d.version_number)+'</strong><p class="muted">'+esc(d.original_filename)+' · '+esc(new Date(d.created_at).toLocaleString())+' · '+esc(d.uploaded_by)+'</p></div><button class="btn alt" data-won-download="'+esc(d.id)+'">View / Download</button></div></div>').join(''):'<p class="muted">No agreements uploaded yet.</p>');$('wonDocForm').onsubmit=async e=>{e.preventDefault();const btn=$('wonDocUpload'),file=e.target.elements.file.files[0],allowed=['application/pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/png','image/jpeg'];if(!file||file.size<1||file.size>10485760||!allowed.includes(file.type)){notify('Choose a supported file under 10 MB.','error');return}btn.disabled=true;try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});await wonDocApi('upload',id,{document_type:e.target.elements.document_type.value,filename:file.name,mime:file.type,base64});notify('Agreement uploaded. Previous versions retained.','good');await loadWonDocs(id)}catch(err){notify('Upload failed: '+err.message,'error');btn.disabled=false}};document.querySelectorAll('[data-won-download]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const result=await wonDocApi('download',id,{document_id:b.dataset.wonDownload});window.open(result.url,'_blank','noopener,noreferrer')}catch(err){notify('Unable to open agreement: '+err.message,'error')}finally{b.disabled=false}})}catch(err){const el=$('wonDocsContent');if(el)el.textContent='Unable to load agreements: '+err.message}}


async function save(e){
 e.preventDefault();
 const btn=$('save'),section=editing.section,formData=new FormData(e.target);
 const record=Object.fromEntries(formData.entries()),changeNote=String(formData.get('price_update_note')||'').trim();
 delete record.price_update_note;
 const wasPipelineWon=section==='pipeline'&&record.stage==='won'&&editing.record?.stage!=='won';
 if(wasPipelineWon){
   const overlay=document.createElement('div');
   overlay.id='wonAgreementOverlay';
   overlay.style.cssText='position:fixed;inset:0;background:rgba(9,16,28,.78);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto';
   overlay.innerHTML='<div role="dialog" aria-modal="true" aria-labelledby="wonAgreementTitle" style="background:#fff;color:#172033;border-radius:16px;max-width:540px;width:100%;padding:26px;box-shadow:0 20px 70px #0006"><div style="color:#a47a22;font-weight:800;font-size:12px;letter-spacing:.1em">WON OPPORTUNITY</div><h2 id="wonAgreementTitle" style="margin:8px 0">Contract / Approved Proposal Required</h2><p style="line-height:1.5">Before completing this sale, upload the signed contract or approved proposal. The document will be saved with the opportunity.</p><form id="wonCloseForm"><label style="display:block;margin:14px 0"><span>Agreement Type</span><select class="field" name="document_type" required><option value="contract">Signed Contract</option><option value="proposal">Approved Proposal</option></select></label><label style="display:block;margin:14px 0"><span>Agreement File (PDF, Word, PNG or JPG · max 10 MB)</span><input class="field" name="file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg" required></label><p id="wonCloseError" style="color:#b42318" role="alert"></p><div class="actions"><button class="btn" id="confirmWonClose" type="submit">Save Won & Upload Agreement</button><button class="btn alt" id="cancelWonClose" type="button">Cancel</button></div></form></div>';
   document.body.appendChild(overlay);
   $('cancelWonClose').onclick=()=>overlay.remove();
   $('wonCloseForm').onsubmit=async event=>{
     event.preventDefault();
     const f=event.target.elements.file.files[0],mime=f?.type||'';
     const allowed=['application/pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/png','image/jpeg'];
     const err=$('wonCloseError'),confirm=$('confirmWonClose');
     if(!f||f.size<1||f.size>10485760||!allowed.includes(mime)){err.textContent='Please choose a supported agreement file under 10 MB.';return}
     confirm.disabled=true;err.textContent='';
     try{
       const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(f)});
       // Save the stage only after a valid agreement file has been selected.
       // If the upload fails, retain this dialog so the user can retry.
       const result=await api(editing.id?'update':'create',section,record,editing.id,changeNote);
       const opportunityId=editing.id||result.item?.id||result.record?.id||result.id;
       if(!opportunityId)throw Error('Opportunity saved but the record ID was not returned. Reopen the Won opportunity to attach its agreement.');
       await wonDocApi('upload',opportunityId,{document_type:event.target.elements.document_type.value,filename:f.name,mime,base64});
       overlay.remove();editing=null;await refresh();await reloadRevenue();
       notify('Opportunity Won. Agreement saved; revenue is pending until payment is collected.','good');
     }catch(error){
       err.textContent='Could not finish: '+error.message+' If the opportunity is already Won, reopen it and upload the agreement in its document section.';
       confirm.disabled=false;
     }
   };
   return;
 }
 btn.disabled=true;
 try{await api(editing.id?'update':'create',section,record,editing.id,changeNote);editing=null;await refresh();notify('Record saved successfully in the Wheeling database.','good')}
 catch(err){notify('Could not save: '+err.message,'error');btn.disabled=false}
}

async function check(){try{const {data:{session}}=await db.auth.getSession();if(isActivationLink&&session&&!session.user?.user_metadata?.miners_password_set){$('login').classList.add('hidden');$('app').classList.add('hidden');$('passwordSetup').classList.remove('hidden');notify('Choose your password to activate your account');return;}if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');notify('Sign in with your Wheeling Miners account');return}await api('list','clients');authorized=true;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('identity').textContent=session.user.email;await refresh();loadMyDashboardTasks();loadJobs();const {data:{user:currentUser}}=await db.auth.getUser();if(currentUser?.email){loadEmployeesIfAdmin()}}catch(e){authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');notify('Access restricted: '+e.message,'error')}}
$('passwordSetupForm').onsubmit=async e=>{e.preventDefault();const p=$('newEmployeePassword').value;if(p!==$('confirmEmployeePassword').value){notify('Passwords do not match','error');return}const {error}=await db.auth.updateUser({password:p,data:{miners_password_set:true}});if(error){notify(error.message,'error');return}history.replaceState({},'',location.pathname);$('passwordSetup').classList.add('hidden');notify('Password created successfully','good');await check()};
$('loginForm').onsubmit=async e=>{e.preventDefault();notify('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){notify(error.message,'error');return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');notify('Signed out')};check();
</script></body></html>
