<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Primary Miner | Live Data Preview</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202124;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#101010;color:#fff;padding:22px 5vw;border-bottom:4px solid #c8a24a}header h1{margin:0;font-size:24px}header small{color:#dfc17d}main{max-width:1180px;margin:28px auto;padding:0 20px}.panel,.metric{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:22px;margin-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{margin:0}.metric b{display:block;font-size:29px;margin-top:8px}.muted{color:#666}.notice{padding:14px;background:#fff3d6;border-radius:8px;margin-bottom:20px}.hidden{display:none}input,button,select{font:inherit;padding:10px;border:1px solid #aaa;border-radius:7px}input{display:block;width:100%;max-width:460px;margin:7px 0 15px}button{background:#141414;color:#fff;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;overflow-wrap:anywhere}.scroll{overflow:auto}nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}nav button{background:#fff;color:#222}nav button.active{background:#141414;color:white}
</style></head><body><header><h1>PRIMARY MINER · Live Data Preview</h1><small>Wheeling Miners CRM · System Owner only · Read-only staging</small></header><main><div id="status" class="notice">Checking your System Owner session…</div><section class="panel hidden" id="login"><h2>System Owner sign-in</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section class="hidden" id="app"><button id="signout">Sign out</button> <button id="refresh">Refresh Monday.com data</button><p class="muted">All counts reflect the first 100 items per board. No editing, approvals, syncing, or employee accounts are enabled.</p><div id="metrics" class="metrics"></div><nav id="tabs"></nav><section class="panel"><h2 id="heading">Records</h2><div class="scroll" id="records"></div></section></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://lbheezjanvalalinqxcd.supabase.co',key='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',org='6b59eb32-4efb-48e4-85da-f25a86238e63';
const sb=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),names={clients:'Clients',leads:'Leads',pipeline:'Sales Pipeline',quotes:'Quotes',tasks:'Tasks',documents:'Documents',activity:'Activity'};let snapshot=null,tab='clients';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(s){$('status').textContent=s}function show(yes){$('login').classList.toggle('hidden',yes);$('app').classList.toggle('hidden',!yes)}
async function api(action){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(url+'/functions/v1/miners-crm',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({action,organization_id:org})});const j=await r.json();if(!r.ok)throw Error(j.error||'Backend request failed');return j}
function render(){if(!snapshot)return;const boards=snapshot.boards||{};$('metrics').innerHTML=Object.entries(names).map(([k,n])=>'<div class="metric">'+esc(n)+'<b>'+((boards[k]?.items||[]).length)+'</b></div>').join('');$('tabs').innerHTML=Object.entries(names).map(([k,n])=>'<button data-board="'+k+'" class="'+(k===tab?'active':'')+'">'+esc(n)+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.board;render()});const b=boards[tab],items=b?.items||[];$('heading').textContent=(b?.name||names[tab])+' · '+items.length+' items';$('records').innerHTML=items.length?'<table><thead><tr><th>Record</th><th>Monday ID</th><th>Fields</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.id)+'</td><td>'+esc((x.column_values||[]).filter(c=>c.text).map(c=>c.id+': '+c.text).join(' | '))+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No records on this board yet.</p>'}
async function load(){status('Loading all seven Wheeling boards…');$('refresh').disabled=true;try{snapshot=await api('dashboard_snapshot');render();status('Connected to Wheeling Monday.com. Live read-only data loaded. Employee access remains locked.')}catch(e){status('Data load failed: '+e.message)}finally{$('refresh').disabled=false}}
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){show(false);status('Sign in with your System Owner account.');return}try{const cfg=await api('configuration');if(cfg.role!=='system_owner')throw Error('System Owner access required');show(true);await load()}catch(e){show(false);status('Access denied: '+e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status(error.message);return}await check()};$('signout').onclick=async()=>{await sb.auth.signOut();show(false);status('Signed out')};$('refresh').onclick=load;check();
</script></body></html>
