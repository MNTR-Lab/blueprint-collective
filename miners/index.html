<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Primary Miner | CRM Dashboard</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#242424;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header{background:#101010;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:1px}header small{display:block;color:#e4c56d;margin-top:4px}main{max-width:1350px;margin:28px auto;padding:0 20px}.banner{padding:13px 17px;background:#fff6dc;border:1px solid #f2d98e;border-radius:10px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e1e1e1;border-radius:12px;padding:20px}.card span{font-size:13px;color:#777}.card b{font-size:32px;display:block;margin-top:10px}.panel{margin-top:20px}h1{font-size:25px;margin:0 0 15px}h2{font-size:18px;margin:0 0 16px}button,select,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #c8c8c8}button{background:#171717;color:#fff;cursor:pointer}button:disabled{opacity:.55}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #ececec;font-size:13px}th{color:#666}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}nav button{background:#fff;color:#222}nav button.active{background:#171717;color:#fff}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#777}.error{color:#9d2929}.table-wrap{overflow:auto}#loginPanel{max-width:480px;margin:40px auto}label{display:block;margin:14px 0}input{display:block;width:100%;margin-top:6px}
</style></head><body>
<header><div><strong>PRIMARY MINER</strong><small>Wheeling Miners · CRM Dashboard</small></div><div><span id="identity">System Owner Preview</span> <button id="logout" class="hidden">Sign Out</button></div></header>
<main><div class="banner" id="status">Checking your System Owner access…</div>
<section id="loginPanel" class="panel hidden"><h1>System Owner Sign In</h1><p>Use your existing Blueprint Collective account.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign In</button></form></section>
<section id="app" class="hidden"><div class="row"><div><h1>Wheeling CRM Overview</h1><p class="muted">Live Monday.com data · Read-only owner testing · Employee access disabled</p></div><button id="refresh">Refresh Data</button></div>
<div class="cards" id="cards"></div>
<nav id="nav"></nav>
<div class="panel"><div class="row"><h2 id="tableTitle">Clients</h2><span class="muted" id="count"></span></div><div class="table-wrap" id="table"></div></div>
</section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://lbheezjanvalalinqxcd.supabase.co',key='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',org='6b59eb32-4efb-48e4-85da-f25a86238e63';
const sb=createClient(url,key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const keys=['clients','leads','pipeline','quotes','tasks','documents','activity'];
const labels={clients:'Clients',leads:'Leads',pipeline:'Pipeline',quotes:'Quotes',tasks:'Tasks',documents:'Documents',activity:'Activity'};
const $=id=>document.getElementById(id);let snapshot=null,active='clients';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s,bad=false){$('status').textContent=s;$('status').classList.toggle('error',bad)}
function show(yes){$('loginPanel').classList.toggle('hidden',yes);$('app').classList.toggle('hidden',!yes);$('logout').classList.toggle('hidden',!yes)}
async function api(action){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(url+'/functions/v1/miners-crm',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action,organization_id:org})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function render(){if(!snapshot)return;$('cards').innerHTML=keys.map(k=>'<div class="card"><span>'+labels[k]+'</span><b>'+(snapshot.boards[k]?.items?.length??0)+'</b></div>').join('');$('nav').innerHTML=keys.map(k=>'<button data-board="'+k+'" class="'+(k===active?'active':'')+'">'+labels[k]+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.board;render()});const board=snapshot.boards[active],items=board?.items||[];$('tableTitle').textContent=labels[active];$('count').textContent=items.length+' records (up to 100 shown)';$('table').innerHTML=items.length?'<table><thead><tr><th>Record</th><th>Details</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+safe(x.name)+'</td><td>'+safe((x.column_values||[]).filter(c=>c.text).map(c=>c.text).join(' · '))+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No records yet in this Wheeling board.</p>'}
async function refresh(){const b=$('refresh');b.disabled=true;status('Loading Wheeling CRM data…');try{const d=await api('dashboard_snapshot');if(d.organization_id!==org||!d.read_only)throw Error('Unexpected workspace response');snapshot=d;render();status('Connected to Wheeling Monday.com · Read-only · Sync disabled')}catch(e){status('Dashboard could not load: '+e.message,true)}finally{b.disabled=false}}
async function check(){try{const {data:{session}}=await sb.auth.getSession();if(!session){show(false);status('Please sign in as System Owner');return}const cfg=await api('configuration');if(cfg.organization_id!==org||cfg.role!=='system_owner')throw Error('System Owner access required');show(true);$('identity').textContent=session.user.email;await refresh()}catch(e){show(false);status('Access restricted: '+e.message,true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status(error.message,true);return}await check()};
$('logout').onclick=async()=>{await sb.auth.signOut();snapshot=null;show(false);status('Signed out')};
$('refresh').onclick=refresh;check();
</script></body></html>
