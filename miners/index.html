<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Miners Organizational CRM</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#24282e;background:#f4f5f7;--gold:#c4971b;--dark:#17191d}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.layout{min-height:100vh;display:flex}aside{width:255px;flex-shrink:0;background:var(--dark);color:white;padding:20px 13px;display:flex;flex-direction:column}.brand{text-align:center;padding:10px 8px 24px;border-bottom:1px solid #494949}.brand img{width:120px;height:120px;object-fit:contain}.brand b{display:block;font-size:19px;margin-top:10px}.brand small{color:#d6b75b;letter-spacing:1.3px;font-size:11px}nav{display:grid;gap:5px;padding-top:15px}.nav{border:0;border-radius:8px;background:transparent;color:#ddd;padding:13px;text-align:left;cursor:pointer}.nav.active,.nav:hover{background:#37332b;border-left:3px solid var(--gold)}.foot{margin-top:auto;text-align:center;border-top:1px solid #555;padding-top:18px;font-size:11px;color:#bbb}.foot img{display:block;width:180px;max-width:100%;margin:10px auto}main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e1e4e8;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:21px}.body{max-width:1200px;padding:25px;margin:auto}.panel{background:white;border:1px solid #e2e5e9;border-radius:12px;padding:20px;margin-bottom:17px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.bar h2{margin:0}.btn{border:0;background:var(--dark);color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:650;font-size:13px}.btn.alt{background:white;color:#222;border:1px solid #ccd0d5}.btn:disabled{opacity:.55}.field{width:100%;padding:11px;border:1px solid #cdd2d8;border-radius:8px;background:white;color:#222}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields label{font-size:13px;font-weight:650}.fields label span{display:block;margin-bottom:7px}.wide{grid-column:1/-1}textarea.field{min-height:95px;resize:vertical}.actions{display:flex;gap:10px;margin-top:20px}.notice{padding:13px 15px;border-radius:9px;background:#fff8e6;color:#6c541e;margin-bottom:17px;font-size:13px}.notice.error{background:#fff1f1;color:#a12222}.notice.good{background:#f0f8ef;color:#285c2c}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}td,th{padding:13px 10px;border-bottom:1px solid #e7e9ed}th{font-size:11px;text-transform:uppercase;color:#6d7680}.scroll{overflow-x:auto}.muted{color:#6e7780;font-size:13px}.hidden{display:none!important}.pill{background:#fff3d6;color:#72500a;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:700}.login{max-width:450px;margin:50px auto}.login label{display:block;margin:15px 0}.login input{margin-top:7px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px;background:white;border:1px solid #e1e4e8;border-radius:12px}.stat strong{font-size:32px;display:block;margin-top:12px}.topright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:760px){.layout{display:block}aside{width:100%}.brand img{height:80px;width:80px}nav{display:flex;overflow-x:auto}.nav{white-space:nowrap}.foot{display:none}.top{padding:13px}.body{padding:14px}.fields{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside><div class="brand"><img src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Wheeling_Miners_a547bbd0-e575-4512-9ad6-47e081cb1fc3.png?v=1790208460" alt="Official Wheeling Miners logo"><b>MINERS</b><small>ORGANIZATIONAL CRM</small></div><nav id="nav"></nav><div class="foot">POWERED BY<img src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Blueprint_Collective-white.png?v=1791560539" alt="Blueprint Collective"><span>System Owner · Wheeling Workspace</span></div></aside><main><header class="top"><h1 id="heading">Dashboard</h1><div class="topright"><span class="pill">OWNER ACCESS ONLY</span><span class="muted" id="identity"></span><button class="btn alt hidden" id="logout">Sign Out</button></div></header><div class="body"><div id="message" class="notice">Checking secure access…</div><section id="login" class="panel login hidden"><h2>System Owner Sign In</h2><p class="muted">Use your existing Blueprint Collective login.</p><form id="loginForm"><label>Email<input class="field" id="email" type="email" required autocomplete="username"></label><label>Password<input class="field" id="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign In</button></form></section><section id="app" class="hidden"></section></div></main></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const URL='https://lbheezjanvalalinqxcd.supabase.co',KEY='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',ORG='6b59eb32-4efb-48e4-85da-f25a86238e63';
const db=createClient(URL,KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections={clients:'Clients',leads:'Leads',pipeline:'Sales Pipeline'};
const definitions={
clients:[['name','Client / Organization','text',true],['contact_name','Contact Person','text'],['email','Email','email'],['phone','Phone','tel'],['status','Status','select',['active','inactive']],['notes','Notes','textarea']],
leads:[['name','Lead / Organization','text',true],['contact_name','Contact Person','text'],['email','Email','email'],['phone','Phone','tel'],['source','Lead Source','text'],['status','Status','select',['new','contacted','qualified','converted','closed']],['client_id','Linked Client','client'],['notes','Notes','textarea']],
pipeline:[['title','Opportunity / Job Name','text',true],['client_id','Client','client'],['lead_id','Lead','lead'],['stage','Stage','select',['new','qualified','proposal','negotiation','won','lost']],['amount','Estimated Value','number'],['expected_close_date','Expected Close Date','date'],['notes','Notes','textarea']]
};
let page='dashboard',rows={clients:[],leads:[],pipeline:[]},editing=null,authorized=false,search='';
function notify(s,type=''){const n=$('message');n.textContent=s;n.className='notice '+type}
async function api(action,section,record,id){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-records',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,section,organization_id:ORG,record,id})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||'Request failed');return payload}
async function refresh(){notify('Loading Wheeling records…');const results=await Promise.all(Object.keys(sections).map(s=>api('list',s)));Object.keys(sections).forEach((s,i)=>rows[s]=results[i].items);notify('Wheeling CRM connected · Changes save to the Wheeling database · Monday.com sync disabled','good');render()}
function selectOptions(type,value){const records=rows[type==='client'?'clients':'leads'];return '<option value="">Not linked</option>'+records.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===value?'selected':'')+'>'+esc(x.name)+'</option>').join('')}
function field(f,record){const [key,label,type,extra]=f,val=record?.[key]??'';let control;if(type==='select')control='<select class="field" name="'+key+'">'+extra.map(x=>'<option value="'+x+'" '+(x===val?'selected':'')+'>'+esc(x[0].toUpperCase()+x.slice(1))+'</option>').join('')+'</select>';else if(type==='client'||type==='lead')control='<select class="field" name="'+key+'">'+selectOptions(type,val)+'</select>';else if(type==='textarea')control='<textarea class="field" name="'+key+'">'+esc(val)+'</textarea>';else control='<input class="field" name="'+key+'" type="'+type+'" value="'+esc(val)+'" '+(extra===true?'required':'')+' '+(type==='number'?'min="0" step="0.01"':'')+'>';return '<label class="'+(type==='textarea'?'wide':'')+'"><span>'+esc(label)+'</span>'+control+'</label>'}
function form(){const record=editing?.record||{},section=editing.section;return '<div class="bar"><h2>'+(editing.id?'Edit ':'Add ')+esc(sections[section])+'</h2><button class="btn alt" id="cancel">Back to list</button></div><div class="panel"><form id="recordForm"><div class="fields">'+definitions[section].map(f=>field(f,record)).join('')+'</div><div class="actions"><button class="btn" id="save">Save Record</button><button class="btn alt" type="button" id="cancel2">Cancel</button></div></form></div>'}
function list(){const items=rows[page].filter(x=>Object.values(x).some(v=>typeof v==='string'&&v.toLowerCase().includes(search.toLowerCase())));const title=page==='pipeline'?'title':'name';return '<div class="bar"><div><h2>'+esc(sections[page])+'</h2><p class="muted">'+rows[page].length+' records · Wheeling database</p></div><button class="btn" id="add">+ Add '+(page==='pipeline'?'Opportunity':page==='leads'?'Lead':'Client')+'</button></div><div class="panel"><input class="field" id="search" placeholder="Search records" value="'+esc(search)+'"><div class="scroll">'+(items.length?'<table><thead><tr><th>Name</th><th>Status / Stage</th><th>Contact / Value</th><th></th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x[title])+'</td><td>'+esc(x.status||x.stage||'')+'</td><td>'+esc(x.contact_name||(page==='pipeline'?'$'+Number(x.amount||0).toLocaleString():x.email))+'</td><td><button class="btn alt edit" data-id="'+esc(x.id)+'">Edit</button></td></tr>').join('')+'</tbody></table>':'<p class="muted" style="padding:20px">No records yet. Use Add to create your first '+esc(sections[page].toLowerCase())+' record.</p>')+'</div></div>'}
function render(){if(!authorized)return;const nav=[['dashboard','Dashboard'],...Object.entries(sections),['monday','Monday.com Boards']];$('nav').innerHTML=nav.map(([key,label])=>'<button class="nav '+(key===page?'active':'')+'" data-page="'+key+'">'+esc(label)+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;editing=null;search='';render()});$('heading').textContent=page==='dashboard'?'Dashboard':page==='monday'?'Monday.com Boards':sections[page];if(editing){$('app').innerHTML=form();$('cancel').onclick=$('cancel2').onclick=()=>{editing=null;render()};$('recordForm').onsubmit=save;return}
if(page==='dashboard')$('app').innerHTML='<div class="bar"><div><h2>Wheeling CRM Overview</h2><p class="muted">Simple client management · Secure Wheeling records</p></div><button class="btn" id="refresh">Refresh</button></div><div class="summary">'+Object.entries(sections).map(([s,label])=>'<div class="stat">'+esc(label)+'<strong>'+rows[s].length+'</strong></div>').join('')+'</div><div class="panel"><h3>How this workspace works</h3><p class="muted">Add a client, track a lead, or create a sales opportunity. Link leads and opportunities to clients using their dropdowns. All edits are stored in Wheeling-specific Supabase tables. Monday.com board data remains separate and read-only until synchronization is approved.</p></div>';
else if(page==='monday')$('app').innerHTML='<div class="panel"><h2>Monday.com Boards</h2><p class="muted">The existing seven Wheeling Monday.com boards are still available through the separate read-only preview. This simple CRM does not automatically copy records to or from Monday.com.</p><a href="/miners/live-preview.html">Open Monday.com Read-only Preview</a></div>';
else $('app').innerHTML=list();
const add=$('add');if(add)add.onclick=()=>{editing={section:page,id:null,record:{}};render()};const refreshBtn=$('refresh');if(refreshBtn)refreshBtn.onclick=()=>refresh().catch(e=>notify(e.message,'error'));const input=$('search');if(input)input.oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)};$('app').querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const item=rows[page].find(x=>x.id===b.dataset.id);editing={section:page,id:item.id,record:item};render()})}
async function save(e){e.preventDefault();const btn=$('save');btn.disabled=true;const section=editing.section,record=Object.fromEntries(new FormData(e.target).entries());try{await api(editing.id?'update':'create',section,record,editing.id);editing=null;await refresh();notify('Record saved successfully in the Wheeling database.','good')}catch(err){notify('Could not save: '+err.message,'error');btn.disabled=false}}
async function check(){try{const {data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');notify('Sign in with your System Owner account');return}await api('list','clients');authorized=true;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('identity').textContent=session.user.email;await refresh()}catch(e){authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');notify('Access restricted: '+e.message,'error')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();notify('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){notify(error.message,'error');return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');notify('Signed out')};check();
</script></body></html>
