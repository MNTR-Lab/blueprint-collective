<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Miners Organizational CRM</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#24282e;background:#f4f5f7;--gold:#c4971b;--dark:#17191d}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.layout{min-height:100vh;display:flex}aside{width:255px;flex-shrink:0;background:var(--dark);color:white;padding:20px 13px;display:flex;flex-direction:column}.brand{text-align:center;padding:10px 8px 24px;border-bottom:1px solid #494949}.brand img{width:120px;height:120px;object-fit:contain}.brand b{display:block;font-size:19px;margin-top:10px}.brand small{color:#d6b75b;letter-spacing:1.3px;font-size:11px}nav{display:grid;gap:5px;padding-top:15px}.nav{border:0;border-radius:8px;background:transparent;color:#ddd;padding:13px;text-align:left;cursor:pointer}.nav.active,.nav:hover{background:#37332b;border-left:3px solid var(--gold)}.foot{margin-top:auto;text-align:center;border-top:1px solid #555;padding-top:18px;font-size:11px;color:#bbb}.foot img{display:block;width:180px;max-width:100%;margin:10px auto}main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e1e4e8;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:21px}.body{max-width:1200px;padding:25px;margin:auto}.panel{background:white;border:1px solid #e2e5e9;border-radius:12px;padding:20px;margin-bottom:17px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.bar h2{margin:0}.btn{border:0;background:var(--dark);color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:650;font-size:13px}.btn.alt{background:white;color:#222;border:1px solid #ccd0d5}.btn:disabled{opacity:.55}.field{width:100%;padding:11px;border:1px solid #cdd2d8;border-radius:8px;background:white;color:#222}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields label{font-size:13px;font-weight:650}.fields label span{display:block;margin-bottom:7px}.wide{grid-column:1/-1}textarea.field{min-height:95px;resize:vertical}.actions{display:flex;gap:10px;margin-top:20px}.notice{padding:13px 15px;border-radius:9px;background:#fff8e6;color:#6c541e;margin-bottom:17px;font-size:13px}.notice.error{background:#fff1f1;color:#a12222}.notice.good{background:#f0f8ef;color:#285c2c}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}td,th{padding:13px 10px;border-bottom:1px solid #e7e9ed}th{font-size:11px;text-transform:uppercase;color:#6d7680}.scroll{overflow-x:auto}.muted{color:#6e7780;font-size:13px}.hidden{display:none!important}.pill{background:#fff3d6;color:#72500a;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:700}.login{max-width:450px;margin:50px auto}.login label{display:block;margin:15px 0}.login input{margin-top:7px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px;background:white;border:1px solid #e1e4e8;border-radius:12px}.stat strong{font-size:32px;display:block;margin-top:12px}.topright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:760px){.layout{display:block}aside{width:100%}.brand img{height:80px;width:80px}nav{display:flex;overflow-x:auto}.nav{white-space:nowrap}.foot{display:none}.top{padding:13px}.body{padding:14px}.fields{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}

.client-grid{display:grid;gap:15px;margin-top:17px}.client-card{border:1px solid #e0e4e9;border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 2px 10px #00000008}.client-head{display:flex;gap:16px;align-items:center;width:100%;border:0;background:#fff;padding:19px;text-align:left;cursor:pointer;color:inherit}.client-head:hover{background:#fbfaf6}.client-avatar{display:flex;align-items:center;justify-content:center;flex:0 0 64px;width:64px;height:64px;background:#17191d;border-radius:12px;color:#d6b75b;font-size:29px;font-weight:750;overflow:hidden}.client-avatar img{width:100%;height:100%;object-fit:contain;background:#fff}.client-title{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.client-title strong{font-size:17px}.client-title small{color:#7b838c;font-size:12px}.client-status{font-size:12px;font-weight:700}.is-active{color:#267347}.is-inactive{color:#777}.client-chevron{font-size:25px;color:#777}.client-foot{border-top:1px solid #edf0f2;padding:12px 19px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#818992}.text-button{border:0;background:none;color:#34383d;font-weight:700;cursor:pointer}.client-expanded{border-top:1px solid #e5e7ea;padding:18px}.client-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e2e5e9;margin:18px 0}.tab{border:0;background:transparent;padding:11px 15px;cursor:pointer;color:#6b737c}.tab.current{color:#17191d;font-weight:700;border-bottom:3px solid #c4971b}.contact-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid #e7e9ed;border-radius:9px;margin-bottom:9px}.contact-form{padding:17px;border:1px solid #e1e4e8;border-radius:11px;background:#fafafa;margin-top:16px}.contact-form h3{margin-top:0}.check{display:inline-flex;align-items:center;gap:8px;margin:14px 18px 0 0;font-size:13px}.profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.profile-fields>div{display:grid;gap:6px}.profile-fields span{font-size:12px;color:#7b838c}.profile-fields strong{font-size:13px;overflow-wrap:anywhere}@media(max-width:620px){.client-actions{align-items:flex-start}.profile-fields{grid-template-columns:1fr}.client-head{padding:13px}.client-avatar{width:50px;height:50px;flex-basis:50px}}
.journal-entry{border:1px solid #e4e7eb;border-radius:10px;padding:15px;margin:12px 0;background:#fff}.journal-entry .bar{margin-bottom:6px}.journal-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.contact-form textarea{display:block;margin-top:9px}
.stat-link{border:1px solid #e6e8eb;text-align:left;cursor:pointer;font:inherit;color:inherit;background:white}.stat-link:hover{border-color:var(--gold);box-shadow:0 2px 10px #00000010}.stat-link small{display:block;color:#747a82;font-size:12px;margin-top:5px}.stat-link strong{display:block}
</style></head><body><div class="layout"><aside><div class="brand"><img src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Wheeling_Miners_a547bbd0-e575-4512-9ad6-47e081cb1fc3.png?v=1790208460" alt="Official Wheeling Miners logo"><b>MINERS</b><small>ORGANIZATIONAL CRM</small></div><nav id="nav"></nav><div class="foot">POWERED BY<img src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Blueprint_Collective-white.png?v=1791560539" alt="Blueprint Collective"><span>System Owner · Wheeling Workspace</span></div></aside><main><header class="top"><h1 id="heading">Dashboard</h1><div class="topright"><span class="pill">OWNER ACCESS ONLY</span><span class="muted" id="identity"></span><button class="btn alt hidden" id="logout">Sign Out</button></div></header><div class="body"><div id="message" class="notice">Checking secure access…</div><section id="login" class="panel login hidden"><h2>System Owner Sign In</h2><p class="muted">Use your existing Blueprint Collective login.</p><form id="loginForm"><label>Email<input class="field" id="email" type="email" required autocomplete="username"></label><label>Password<input class="field" id="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign In</button></form></section><section id="app" class="hidden"></section></div></main></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const URL='https://lbheezjanvalalinqxcd.supabase.co',KEY='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',ORG='6b59eb32-4efb-48e4-85da-f25a86238e63';
const db=createClient(URL,KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections={clients:'Clients',leads:'Leads',pipeline:'Sales Pipeline'};
const definitions={
clients:[['name','Client / Organization','text',true],['contact_name','Contact Person','text'],['email','Email','email'],['phone','Phone','tel'],['status','Status','select',['active','inactive']],['notes','Notes','textarea']],
leads:[['name','Lead / Organization','text',true],['contact_name','Contact Person','text'],['email','Email','email'],['phone','Phone','tel'],['source','Lead Source','text'],['status','Status','select',['new','contacted','qualified','converted','closed']],['client_id','Linked Client','client'],['notes','Notes','textarea']],
pipeline:[['title','Opportunity / Job Name','text',true],['client_id','Client','client'],['lead_id','Lead','lead'],['stage','Stage','select',['new','qualified','proposal','negotiation','won','lost']],['amount','Estimated Value','number'],['expected_close_date','Expected Close Date','date'],['notes','Notes','textarea']]
};
let page='dashboard',rows={clients:[],leads:[],pipeline:[]},editing=null,authorized=false,search='',expandedClient=null,clientTab='contacts',contactsCache={},logosCache={},journalCache={},tasksCache={},documentsCache={};
function notify(s,type=''){const n=$('message');n.textContent=s;n.className='notice '+type}
async function api(action,section,record,id){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-records',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,section,organization_id:ORG,record,id})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||'Request failed');return payload}
async function profileApi(action,client_id,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-profiles',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,client_id,organization_id:ORG,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Profile request failed');return data}
async function journalApi(action,client_id,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-client-journal',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,client_id,organization_id:ORG,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Journal request failed');return data}
async function loadJournal(id){journalCache[id]=await journalApi('list',id)}
async function taskApi(action,client_id,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-client-tasks',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,client_id,organization_id:ORG,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Task request failed');return data}
async function loadTasks(id){const d=await taskApi('list',id);tasksCache[id]=d.tasks||[]}
async function documentApi(action,client_id,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Please sign in');const response=await fetch(URL+'/functions/v1/miners-client-documents',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,client_id,organization_id:ORG,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Document request failed');return data}
async function loadDocuments(id){const d=await documentApi('list',id);documentsCache[id]=d.documents||[]}
function documentView(id){const docs=documentsCache[id]||[];return '<div class="bar"><div><strong>Client Documents ('+docs.length+')</strong><p class="muted">Private files · PDF, images, Word, Excel, and TXT · 10 MB maximum</p></div><button class="btn alt" id="addDocument">+ Upload Document</button></div><div id="documentEditor"></div>'+(docs.length?docs.map(d=>'<div class="journal-entry"><div class="bar"><div><strong>'+esc(d.title)+'</strong><div class="muted">'+esc(d.original_filename)+' · '+(d.size_bytes/1024).toFixed(1)+' KB · '+esc(new Date(d.created_at).toLocaleString())+'</div></div><button class="btn alt" data-download="'+esc(d.id)+'">View / Download</button></div>'+(d.description?'<p class="journal-text">'+esc(d.description)+'</p>':'')+'</div>').join(''):'<p class="muted">No documents uploaded for this client yet.</p>')}
function documentEditor(){const el=$('documentEditor');if(!el)return;el.innerHTML='<form class="contact-form" id="documentForm"><h3>Upload Client Document</h3><div class="fields"><label><span>Document Title</span><input class="field" name="title" required maxlength="250"></label><label><span>Choose File</span><input class="field" type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.xlsx,.txt"></label><label class="wide"><span>Description (optional)</span><textarea class="field" name="description" maxlength="2000"></textarea></label></div><div class="actions"><button class="btn" id="saveDocument">Upload Document</button><button class="btn alt" type="button" id="cancelDocument">Cancel</button></div></form>';$('cancelDocument').onclick=()=>el.innerHTML='';$('documentForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveDocument'),file=e.target.elements.file.files[0];const allowed=['application/pdf','image/png','image/jpeg','image/webp','text/plain','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];if(!file||file.size>10485760||!allowed.includes(file.type)){notify('Choose a supported document under 10 MB.','error');return}btn.disabled=true;try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const form=new FormData(e.target);await documentApi('upload',expandedClient,{title:String(form.get('title')||''),description:String(form.get('description')||''),filename:file.name,mime:file.type,base64});await Promise.all([loadDocuments(expandedClient),loadJournal(expandedClient)]);render();notify('Document uploaded successfully.','good')}catch(err){notify('Document upload failed: '+err.message,'error');btn.disabled=false}}}
function attachDocumentEvents(){if(clientTab!=='documents')return;const b=$('addDocument');if(b)b.onclick=()=>documentEditor();document.querySelectorAll('[data-download]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const result=await documentApi('download',expandedClient,{document_id:b.dataset.download});window.open(result.url,'_blank','noopener,noreferrer')}catch(err){notify('Could not open document: '+err.message,'error')}finally{b.disabled=false}})}

function taskView(id){const tasks=tasksCache[id]||[];const pending=tasks.filter(t=>t.status!=='completed'),done=tasks.filter(t=>t.status==='completed');const row=t=>'<div class="journal-entry"><div class="bar"><div><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.assigned_to||'Unassigned')+' · '+esc(t.priority)+' priority'+(t.due_date?' · Due '+esc(t.due_date):'')+'</div></div><span class="pill">'+esc(t.status.replaceAll('_',' '))+'</span></div><p class="journal-text">'+esc(t.description||'')+'</p><button class="btn alt" data-edittask="'+esc(t.id)+'">Edit Task</button></div>';return '<div class="bar"><strong>Follow-Up Tasks</strong><button class="btn alt" id="addTask">+ Add Task</button></div><div id="taskEditor"></div><h3>Open Tasks ('+pending.length+')</h3>'+(pending.map(row).join('')||'<p class="muted">No open tasks.</p>')+'<details><summary class="muted" style="cursor:pointer;padding:14px 0">Completed / Archived ('+done.length+')</summary>'+done.map(row).join('')+'</details>'}
function taskEditor(id=null){const el=$('taskEditor');if(!el)return;const t=(tasksCache[expandedClient]||[]).find(x=>x.id===id)||{};el.innerHTML='<form id="taskForm" class="contact-form"><h3>'+(id?'Edit':'Add')+' Follow-Up Task</h3><div class="fields"><label><span>Task Title</span><input class="field" name="title" required maxlength="250" value="'+esc(t.title||'')+'"></label><label><span>Assigned To</span><input class="field" name="assigned_to" maxlength="250" value="'+esc(t.assigned_to||'')+'" placeholder="Person responsible"></label><label><span>Due Date</span><input class="field" type="date" name="due_date" value="'+esc(t.due_date||'')+'"></label><label><span>Priority</span><select class="field" name="priority">'+['low','normal','high'].map(v=>'<option value="'+v+'" '+((t.priority||'normal')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label><span>Status</span><select class="field" name="status">'+[['pending','Pending'],['in_progress','In Progress'],['completed','Completed']].map(([v,l])=>'<option value="'+v+'" '+((t.status||'pending')===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label class="wide"><span>Description</span><textarea class="field" name="description" maxlength="5000">'+esc(t.description||'')+'</textarea></label></div><div class="actions"><button class="btn" id="saveTask">Save Task</button><button class="btn alt" type="button" id="cancelTask">Cancel</button></div></form>';$('cancelTask').onclick=()=>el.innerHTML='';$('taskForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveTask');btn.disabled=true;const task=Object.fromEntries(new FormData(e.target).entries());try{await taskApi('save',expandedClient,{task,task_id:id});await Promise.all([loadTasks(expandedClient),loadJournal(expandedClient)]);render();notify('Task saved successfully.','good')}catch(err){notify('Could not save task: '+err.message,'error');btn.disabled=false}}}
function attachTaskEvents(){if(clientTab!=='tasks')return;const b=$('addTask');if(b)b.onclick=()=>taskEditor();document.querySelectorAll('[data-edittask]').forEach(b=>b.onclick=()=>taskEditor(b.dataset.edittask))}

function journalView(id,type){const d=journalCache[id]||{notes:[],activity:[]};if(type==='notes')return '<div class="bar"><strong>Client Notes</strong><span class="muted">Private · System Owner</span></div><form id="noteForm" class="contact-form"><label><span>New note</span><textarea name="body" class="field" maxlength="10000" required placeholder="Write a client note..."></textarea></label><div class="actions"><button class="btn" id="saveNote">Save Note</button></div></form>'+(d.notes.length?d.notes.map(n=>'<div class="journal-entry"><div class="bar"><strong>'+esc(n.author_email)+'</strong><small class="muted">'+esc(new Date(n.updated_at||n.created_at).toLocaleString())+'</small></div><p class="journal-text">'+esc(n.body)+'</p><button class="btn alt" data-editnote="'+esc(n.id)+'">Edit Note</button></div>').join(''):'<p class="muted">No notes yet.</p>');return '<div class="bar"><strong>Client Activity</strong><span class="muted">Latest 100 events</span></div>'+(d.activity.length?d.activity.map(a=>'<div class="journal-entry"><strong>'+esc(a.description)+'</strong><div class="muted">'+esc(a.actor_email)+' · '+esc(new Date(a.created_at).toLocaleString())+'</div></div>').join(''):'<p class="muted">No recorded activity yet. New and updated notes will appear here.</p>')}
async function saveJournalNote(id,note_id,body,button){if(button)button.disabled=true;try{await journalApi(note_id?'update_note':'create_note',id,{note_id,body});await loadJournal(id);render();notify(note_id?'Note updated successfully.':'Note saved successfully.','good')}catch(e){notify('Could not save note: '+e.message,'error');if(button)button.disabled=false}}
function attachJournalEvents(){const id=expandedClient;if(!id)return;const form=$('noteForm');if(form)form.onsubmit=e=>{e.preventDefault();saveJournalNote(id,null,String(new FormData(form).get('body')||''),$('saveNote'))};document.querySelectorAll('[data-editnote]').forEach(btn=>btn.onclick=()=>{const note=(journalCache[id]?.notes||[]).find(x=>x.id===btn.dataset.editnote);if(!note)return;const body=prompt('Edit client note:',note.body);if(body!==null&&body.trim()&&body.trim()!==note.body)saveJournalNote(id,note.id,body,btn)})}
async function openClient(id){if(expandedClient===id){expandedClient=null;render();return}expandedClient=id;clientTab='contacts';render();try{await Promise.all([loadContacts(id),loadLogo(id),loadJournal(id),loadTasks(id),loadDocuments(id)]);if(expandedClient===id)render()}catch(e){notify('Unable to load client details: '+e.message,'error')}}
async function loadContacts(id){const d=await profileApi('list_contacts',id);contactsCache[id]=d.contacts}
async function loadLogo(id){const d=await profileApi('logo_url',id);logosCache[id]=d.url}
function clientCards(){const items=rows.clients.filter(x=>[x.name,x.contact_name,x.email,x.phone].join(' ').toLowerCase().includes(search.toLowerCase()));return '<div class="bar"><div><h2>Clients</h2><p class="muted">'+rows.clients.length+' organizational clients</p></div><button class="btn" id="add">+ Add Client</button></div><div class="panel"><input class="field" id="search" placeholder="Search clients, contacts, or email" value="'+esc(search)+'"><div class="client-grid">'+(items.length?items.map(clientCard).join(''):'<p class="muted">No clients found. Add your first client to get started.</p>')+'</div></div>'}
function clientCard(c){const active=c.status==='active',open=expandedClient===c.id,logo=logosCache[c.id];return '<article class="client-card"><button class="client-head" data-expand="'+esc(c.id)+'"><span class="client-avatar">'+(logo?'<img src="'+esc(logo)+'" alt="Client logo">':esc((c.name||'?').slice(0,1).toUpperCase()))+'</span><span class="client-title"><strong>'+esc(c.name)+'</strong><span class="client-status '+(active?'is-active':'is-inactive')+'">● '+(active?'Active Client':'Inactive Client')+'</span><small>'+esc(c.contact_name||'No primary contact listed')+'</small></span><span class="client-chevron">'+(open?'⌃':'⌄')+'</span></button>'+(open?clientExpanded(c):'<div class="client-foot"><span>Organization Client</span><button class="text-button" data-expand="'+esc(c.id)+'">View Details ↗</button></div>')+'</article>'}
function clientExpanded(c){const contacts=contactsCache[c.id]||[],opps=rows.pipeline.filter(x=>x.client_id===c.id),leads=rows.leads.filter(x=>x.client_id===c.id);return '<div class="client-expanded"><div class="client-actions"><strong>Client Profile</strong><div><button class="btn alt" data-upload="'+esc(c.id)+'">Upload Logo</button> <button class="btn alt edit" data-id="'+esc(c.id)+'">Edit Profile</button><input type="file" class="hidden" accept="image/png,image/jpeg,image/webp" id="upload-'+esc(c.id)+'"></div></div><div class="tabs">'+[['contacts','Employees'],['details','Details'],['records','Records'],['notes','Notes'],['tasks','Tasks'],['documents','Documents'],['activity','Activity']].map(([key,label])=>'<button class="tab '+(clientTab===key?'current':'')+'" data-tab="'+key+'">'+label+'</button>').join('')+'</div>'+(clientTab==='contacts'?'<div class="bar"><strong>Associated Employees ('+contacts.length+')</strong><button class="btn alt" data-addcontact="'+esc(c.id)+'">+ Add Employee / Contact</button></div>'+(contacts.length?contacts.map(x=>'<div class="contact-row"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.job_title||'Contact')+(x.is_primary?' · Primary Contact':'')+'</div><div class="muted">'+esc([x.email,x.phone].filter(Boolean).join(' · '))+'</div></div><button class="btn alt" data-editcontact="'+esc(x.id)+'">Edit</button></div>').join(''):'<p class="muted">No additional contacts yet. Add employees or other people associated with this client.</p>')+'<div id="contactEditor"></div>':clientTab==='documents'?documentView(c.id):clientTab==='tasks'?taskView(c.id):clientTab==='notes'||clientTab==='activity'?journalView(c.id,clientTab):clientTab==='details'?'<div class="profile-fields"><div><span>Organization</span><strong>'+esc(c.name)+'</strong></div><div><span>Status</span><strong>'+esc(c.status)+'</strong></div><div><span>Primary Contact</span><strong>'+esc(c.contact_name||'—')+'</strong></div><div><span>Email</span><strong>'+esc(c.email||'—')+'</strong></div><div><span>Phone</span><strong>'+esc(c.phone||'—')+'</strong></div><div class="wide"><span>Notes</span><strong>'+esc(c.notes||'No notes yet')+'</strong></div></div>':'<div class="profile-fields"><div><span>Linked Opportunities</span><strong>'+opps.length+'</strong></div><div><span>Linked Leads</span><strong>'+leads.length+'</strong></div><div class="wide">'+[...opps.map(x=>({name:x.title,type:'Opportunity'})),...leads.map(x=>({name:x.name,type:'Lead'}))].map(x=>'<p>'+esc(x.type)+': '+esc(x.name)+'</p>').join('')+'<p class="muted">Quotes, documents, and activity remain in Organization Records until connected to the client profile.</p></div></div>')+'</div>'}
function contactEditor(id=null){const c=rows.clients.find(x=>x.id===expandedClient),v=(contactsCache[expandedClient]||[]).find(x=>x.id===id)||{};const editor=$('contactEditor');if(!editor)return;editor.innerHTML='<form id="contactForm" class="contact-form"><h3>'+(id?'Edit':'Add')+' Employee / Contact</h3><div class="fields">'+[['name','Full Name'],['job_title','Job Title'],['email','Email'],['phone','Phone']].map(([key,label])=>'<label><span>'+label+'</span><input class="field" name="'+key+'" '+(key==='name'?'required':'')+' value="'+esc(v[key]||'')+'"></label>').join('')+'</div><label class="check"><input type="checkbox" name="is_primary" '+(v.is_primary?'checked':'')+'> Primary contact</label><label class="check"><input type="checkbox" name="is_active" '+(v.is_active!==false?'checked':'')+'> Active contact</label><div class="actions"><button class="btn" id="saveContact">Save Contact</button><button class="btn alt" type="button" id="cancelContact">Cancel</button></div></form>';$('cancelContact').onclick=()=>editor.innerHTML='';$('contactForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveContact');btn.disabled=true;const f=new FormData(e.target);const contact=Object.fromEntries(['name','job_title','email','phone'].map(k=>[k,String(f.get(k)||'')]));contact.is_primary=f.has('is_primary');contact.is_active=f.has('is_active');try{await profileApi('save_contact',c.id,{contact,contact_id:id});await loadContacts(c.id);render();notify('Contact saved successfully.','good')}catch(err){notify('Could not save contact: '+err.message,'error');btn.disabled=false}}}
async function uploadClientLogo(id,file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2097152){notify('Please choose a PNG, JPG or WebP image under 2 MB.','error');return}notify('Uploading client logo…');try{const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const result=await profileApi('upload_logo',id,{mime:file.type,base64:encoded});logosCache[id]=result.url;render();notify('Client logo uploaded successfully.','good')}catch(e){notify('Logo upload failed: '+e.message,'error')}}
function attachClientEvents(){attachJournalEvents();attachTaskEvents();attachDocumentEvents();document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>openClient(b.dataset.expand));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{clientTab=b.dataset.tab;render()});document.querySelectorAll('[data-addcontact]').forEach(b=>b.onclick=()=>contactEditor());document.querySelectorAll('[data-editcontact]').forEach(b=>b.onclick=()=>contactEditor(b.dataset.editcontact));document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>$('upload-'+b.dataset.upload)?.click());document.querySelectorAll('input[type=file][id^="upload-"]').forEach(input=>input.onchange=()=>uploadClientLogo(input.id.slice(7),input.files?.[0]))}
async function refresh(){notify('Loading Wheeling records…');const results=await Promise.all(Object.keys(sections).map(s=>api('list',s)));Object.keys(sections).forEach((s,i)=>rows[s]=results[i].items);notify('Wheeling CRM connected · Changes save to the Wheeling database · Organizational board synchronization disabled','good');render()}
function selectOptions(type,value){const records=rows[type==='client'?'clients':'leads'];return '<option value="">Not linked</option>'+records.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===value?'selected':'')+'>'+esc(x.name)+'</option>').join('')}
function field(f,record){const [key,label,type,extra]=f,val=record?.[key]??'';let control;if(type==='select')control='<select class="field" name="'+key+'">'+extra.map(x=>'<option value="'+x+'" '+(x===val?'selected':'')+'>'+esc(x[0].toUpperCase()+x.slice(1))+'</option>').join('')+'</select>';else if(type==='client'||type==='lead')control='<select class="field" name="'+key+'">'+selectOptions(type,val)+'</select>';else if(type==='textarea')control='<textarea class="field" name="'+key+'">'+esc(val)+'</textarea>';else control='<input class="field" name="'+key+'" type="'+type+'" value="'+esc(val)+'" '+(extra===true?'required':'')+' '+(type==='number'?'min="0" step="0.01"':'')+'>';return '<label class="'+(type==='textarea'?'wide':'')+'"><span>'+esc(label)+'</span>'+control+'</label>'}
function form(){const record=editing?.record||{},section=editing.section;return '<div class="bar"><h2>'+(editing.id?'Edit ':'Add ')+esc(sections[section])+'</h2><button class="btn alt" id="cancel">Back to list</button></div><div class="panel"><form id="recordForm"><div class="fields">'+definitions[section].map(f=>field(f,record)).join('')+'</div><div class="actions"><button class="btn" id="save">Save Record</button><button class="btn alt" type="button" id="cancel2">Cancel</button></div></form></div>'}
function list(){const items=rows[page].filter(x=>Object.values(x).some(v=>typeof v==='string'&&v.toLowerCase().includes(search.toLowerCase())));const title=page==='pipeline'?'title':'name';return '<div class="bar"><div><h2>'+esc(sections[page])+'</h2><p class="muted">'+rows[page].length+' records · Wheeling database</p></div><button class="btn" id="add">+ Add '+(page==='pipeline'?'Opportunity':page==='leads'?'Lead':'Client')+'</button></div><div class="panel"><input class="field" id="search" placeholder="Search records" value="'+esc(search)+'"><div class="scroll">'+(items.length?'<table><thead><tr><th>Name</th><th>Status / Stage</th><th>Contact / Value</th><th></th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x[title])+'</td><td>'+esc(x.status||x.stage||'')+'</td><td>'+esc(x.contact_name||(page==='pipeline'?'$'+Number(x.amount||0).toLocaleString():x.email))+'</td><td><button class="btn alt edit" data-id="'+esc(x.id)+'">Edit</button></td></tr>').join('')+'</tbody></table>':'<p class="muted" style="padding:20px">No records yet. Use Add to create your first '+esc(sections[page].toLowerCase())+' record.</p>')+'</div></div>'}

const active=rows.clients.filter(x=>x.status==='active').length;

'<div class="panel"><div class="bar"><h3>Recent Opportunities</h3><button class="btn alt" data-go="pipeline">View Pipeline</button></div>'+(recent.length?recent.map(o=>{const client=rows.clients.find(c=>c.id===o.client_id);return '<div class="contact-row"><div><strong>'+esc(o.title)+'</strong><div class="muted">'+esc(o.stage||'new')+(client?' · '+esc(client.name):' · No linked client')+'</div></div>'+(client?'<button class="btn alt" data-client-link="'+esc(client.id)+'">Client Profile</button>':'<button class="btn alt" data-go="pipeline">View Opportunity</button>')+'</div>'}).join(''):'<p class="muted">No opportunities yet.</p>')+'</div>'+
'<div class="panel"><h3>Client Workspaces</h3><p class="muted">Open a client profile to access employees, notes, follow-up tasks, private documents, activity history and linked records. Task due dates and documents are stored within each client profile.</p></div>'

let revenueSettings=null,revenueGoalLoaded=false,revenueGoalError='';
async function loadRevenueGoal(){try{const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in required');const response=await fetch(URL+'/functions/v1/miners-revenue-goals',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'get',organization_id:ORG})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load goal');revenueSettings=data.settings;revenueEntries=data.entries||[];revenueGoalError=''}catch(e){revenueGoalError=e.message}revenueGoalLoaded=true;showRevenueGoal()}

let revenueEntries=[];
function revMoney(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function revStats(){const g=revenueSettings||{},goal=Number(g.goal_amount)||0;const entries=revenueEntries.filter(e=>g.cycle_start&&g.cycle_end&&e.closed_date>=g.cycle_start&&e.closed_date<=g.cycle_end);const verified=entries.filter(e=>e.verified).reduce((a,e)=>a+Number(e.amount),0),pending=entries.filter(e=>!e.verified).reduce((a,e)=>a+Number(e.amount),0);const remaining=Math.max(0,goal-verified);const days=g.cycle_end?Math.max(0,Math.ceil((new Date(g.cycle_end+'T12:00:00')-new Date())/86400000)):0;return {goal,verified,pending,remaining,days,weekly:days?remaining*7/days:0,monthly:days?remaining*30.4375/days:0,pct:goal?Math.min(100,verified/goal*100):0}}
function revCards(pairs){return '<div class="summary">'+pairs.map(([k,v])=>'<div class="stat">'+esc(k)+'<strong>'+esc(String(v))+'</strong></div>').join('')+'</div>'}
function showRevenueGoal(){const el=$('revenueGoalPanel');if(!el)return;if(revenueGoalError){el.innerHTML='<p class="muted">Sales goal unavailable: '+esc(revenueGoalError)+'</p>';return}const g=revenueSettings;if(!g||!g.enabled){el.innerHTML='<p class="muted">Not Configured — set the revenue goal in Revenue Goals on the left navigation.</p><button class="btn alt" data-go="revenue">Manage Revenue Goals →</button>';attachDashboardLinks();return}const x=revStats();el.innerHTML='<p class="muted">Custom cycle: '+esc(g.cycle_start)+' to '+esc(g.cycle_end)+'</p>'+revCards([['Revenue Goal',revMoney(x.goal)],['Verified Revenue',revMoney(x.verified)],['Remaining Goal',revMoney(x.remaining)],['Weekly Needed',revMoney(x.weekly)]])+'<div style="background:#e8ebef;border-radius:8px;height:13px;overflow:hidden;margin:14px 0"><div style="background:#c4971b;width:'+x.pct+'%;height:100%"></div></div><div class="bar"><span class="muted">'+x.pct.toFixed(1)+'% of goal achieved</span><button class="btn alt" data-go="revenue">Manage Revenue Goals →</button></div>';attachDashboardLinks()}
function attachDashboardLinks(){document.querySelectorAll('[data-go="revenue"]').forEach(b=>b.onclick=()=>{page='revenue';editing=null;render()})}
function revenueDetailPage(){const g=revenueSettings||{},x=revStats();if(revenueGoalError)return '<div class="panel"><p>Revenue settings unavailable: '+esc(revenueGoalError)+'</p><button class="btn" id="retryRevenue">Retry</button></div>';if(!revenueGoalLoaded)return '<div class="panel">Loading revenue goals…</div>';return '<div class="bar"><div><h2>Revenue Goals & Performance</h2><p class="muted">Custom revenue cycles and Master Admin verification</p></div><span class="pill">System Owner</span></div>'+
'<div class="panel"><h3>Goal Settings</h3><form id="revenueGoalForm"><div class="fields"><label><span>Revenue Goal ($)</span><input class="field" name="goal_amount" type="number" min="0" max="1000000000000" step="0.01" required value="'+esc(g.goal_amount??'0')+'"></label><label><span>Cycle Start</span><input class="field" name="cycle_start" type="date" required value="'+esc(g.cycle_start||'')+'"></label><label><span>Cycle End</span><input class="field" name="cycle_end" type="date" required value="'+esc(g.cycle_end||'')+'"></label><label><span>Revenue Tracking</span><select class="field" name="enabled"><option value="true" '+(g.enabled?'selected':'')+'>Enabled</option><option value="false" '+(!g.enabled?'selected':'')+'>Disabled</option></select></label></div><div class="actions"><button class="btn" id="saveRevenueGoal">Save Goal Settings</button></div></form></div>'+
revCards([['Revenue Goal',revMoney(x.goal)],['Verified Revenue',revMoney(x.verified)],['Remaining Goal',revMoney(x.remaining)],['Pending Verification',revMoney(x.pending)]])+
'<div class="panel"><h3>Goal Progress — '+x.pct.toFixed(1)+'%</h3><div style="background:#e8ebef;border-radius:8px;height:16px;overflow:hidden"><div style="background:#c4971b;width:'+x.pct+'%;height:100%"></div></div>'+revCards([['Required Weekly Sales',revMoney(x.weekly)],['Required Monthly Sales',revMoney(x.monthly)],['Days Remaining',x.days],['Cycle',(g.cycle_start||'—')+' → '+(g.cycle_end||'—')]])+'</div>'+
'<div class="panel"><div class="bar"><div><h3>Closed Job Revenue Verification</h3><p class="muted">Entries count toward the goal only after Master Admin verification.</p></div><button class="btn alt" id="addRevenueEntry">+ Add Revenue Entry</button></div><div id="revenueEntryEditor"></div>'+(revenueEntries.length?'<div class="scroll"><table><thead><tr><th>Job</th><th>Closed Date</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>'+revenueEntries.map(e=>'<tr><td>'+esc(e.job_name)+'</td><td>'+esc(e.closed_date)+'</td><td>'+revMoney(e.amount)+'</td><td>'+ (e.verified?'Verified':'Pending')+'</td><td><button class="btn alt" data-verify-revenue="'+esc(e.id)+'">'+(e.verified?'Review / Adjust':'Verify Amount')+'</button></td></tr>').join('')+'</tbody></table></div>':'<p class="muted">No revenue entries yet.</p>')+'</div>'+
'<div class="panel"><p class="muted">Revenue entries are manually entered and verified by the System Owner. Live closed-job synchronization is not enabled.</p></div>'}
async function revenueApi(action,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(URL+'/functions/v1/miners-revenue-goals',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,organization_id:ORG,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Revenue request failed');return d}
async function reloadRevenue(){revenueGoalLoaded=false;const d=await revenueApi('get');revenueSettings=d.settings;revenueEntries=d.entries||[];revenueGoalError='';revenueGoalLoaded=true;render()}
function attachRevenuePageEvents(){if(!revenueGoalLoaded){loadRevenueGoal().then(()=>{if(page==='revenue')render()});return}const retry=$('retryRevenue');if(retry)retry.onclick=()=>reloadRevenue().catch(e=>notify(e.message,'error'));const form=$('revenueGoalForm');if(form)form.onsubmit=async e=>{e.preventDefault();const b=$('saveRevenueGoal');b.disabled=true;try{const f=new FormData(form);await revenueApi('save',{goal_amount:Number(f.get('goal_amount')),cycle_start:f.get('cycle_start'),cycle_end:f.get('cycle_end'),enabled:f.get('enabled')==='true'});await reloadRevenue();notify('Revenue goal saved.','good')}catch(err){notify(err.message,'error');b.disabled=false}};const add=$('addRevenueEntry');if(add)add.onclick=()=>{const el=$('revenueEntryEditor');el.innerHTML='<form id="revenueEntryForm" class="contact-form"><div class="fields"><label><span>Closed Job / Revenue Description</span><input class="field" name="job_name" required maxlength="250"></label><label><span>Closed Date</span><input class="field" name="closed_date" type="date" required></label><label><span>Revenue Amount ($)</span><input class="field" name="amount" type="number" min="0" step="0.01" required></label></div><div class="actions"><button class="btn" id="saveRevenueEntry">Add Pending Entry</button><button type="button" class="btn alt" id="cancelRevenueEntry">Cancel</button></div></form>';$('cancelRevenueEntry').onclick=()=>el.innerHTML='';$('revenueEntryForm').onsubmit=async e=>{e.preventDefault();const b=$('saveRevenueEntry');b.disabled=true;try{const f=new FormData(e.target);await revenueApi('add_entry',{job_name:f.get('job_name'),closed_date:f.get('closed_date'),amount:Number(f.get('amount'))});await reloadRevenue();notify('Revenue entry added for verification.','good')}catch(err){notify(err.message,'error');b.disabled=false}}};document.querySelectorAll('[data-verify-revenue]').forEach(b=>b.onclick=async()=>{const entry=revenueEntries.find(x=>x.id===b.dataset.verifyRevenue);if(!entry)return;const input=prompt('Verify closed revenue for '+entry.job_name+'. Adjust amount if needed:',entry.amount);if(input===null)return;const amount=Number(input);if(!input.trim()||!Number.isFinite(amount)||amount<0){notify('Invalid amount.','error');return}if(!confirm('Verify and approve '+revMoney(amount)+' for '+entry.job_name+'?'))return;try{await revenueApi('verify_entry',{entry_id:entry.id,amount});await reloadRevenue();notify('Revenue verified.','good')}catch(err){notify(err.message,'error')}})}
function attachDashboardEvents(){if(revenueGoalLoaded)showRevenueGoal();else loadRevenueGoal();
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;editing=null;search='';render()});
document.querySelectorAll('[data-client-link]').forEach(b=>b.onclick=async()=>{page='clients';editing=null;search='';await openClient(b.dataset.clientLink)});
}

else if(page==='revenue')$('app').innerHTML=revenueDetailPage();
else if(page==='monday')$('app').innerHTML='<div class="bar"><div><h2>Organization Records</h2><p class="muted">Your Wheeling organizational information, all within this CRM.</p></div><button class="btn" id="loadBoards">Load Records</button></div><div class="panel"><p class="muted">Browse the seven connected organizational record categories. This view is read-only; changes to Clients, Leads and Sales Pipeline are made through their main CRM pages.</p><div id="boardResults" class="muted">Select Load Records to view the connected organizational records.</div></div>';
else $('app').innerHTML=page==='clients'?clientCards():list();
const loadBoards=$('loadBoards');if(loadBoards)loadBoards.onclick=async()=>{loadBoards.disabled=true;const target=$('boardResults');target.textContent='Loading organization records…';try{const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(URL+'/functions/v1/miners-crm',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'dashboard_snapshot',organization_id:ORG})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load records');const labels={clients:'Clients',leads:'Leads',pipeline:'Sales Pipeline',quotes:'Quotes & Approvals',tasks:'Tasks & Follow-ups',documents:'Documents',activity:'Activity'};target.innerHTML=Object.entries(labels).map(([key,label])=>{const board=d.boards?.[key];const items=board?.items||[];return '<div style="border-top:1px solid #e7e9ed;padding:16px 0"><h3>'+esc(label)+' <span class="muted">('+items.length+')</span></h3>'+(items.length?'<div class="scroll"><table><thead><tr><th>Record</th><th>Details</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc((x.column_values||[]).filter(c=>c.text).map(c=>c.text).join(' · '))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">No records in this category.</p>')+'</div>'}).join('')}catch(e){target.textContent='Unable to load organizational records: '+e.message}finally{loadBoards.disabled=false}};if(page==='clients'&&!editing)attachClientEvents();if(page==='dashboard')attachDashboardEvents();if(page==='revenue')attachRevenuePageEvents();const add=$('add');if(add)add.onclick=()=>{editing={section:page,id:null,record:{}};render()};const refreshBtn=$('refresh');if(refreshBtn)refreshBtn.onclick=()=>refresh().catch(e=>notify(e.message,'error'));const input=$('search');if(input)input.oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)};$('app').querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const item=rows[page].find(x=>x.id===b.dataset.id);editing={section:page,id:item.id,record:item};render()})}
async function save(e){e.preventDefault();const btn=$('save');btn.disabled=true;const section=editing.section,record=Object.fromEntries(new FormData(e.target).entries());try{await api(editing.id?'update':'create',section,record,editing.id);editing=null;await refresh();notify('Record saved successfully in the Wheeling database.','good')}catch(err){notify('Could not save: '+err.message,'error');btn.disabled=false}}
async function check(){try{const {data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');notify('Sign in with your System Owner account');return}await api('list','clients');authorized=true;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('identity').textContent=session.user.email;await refresh()}catch(e){authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');notify('Access restricted: '+e.message,'error')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();notify('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){notify(error.message,'error');return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');notify('Signed out')};check();
</script></body></html>
