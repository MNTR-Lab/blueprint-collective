<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Primary Miner | Owner Test</title>
<style>body{margin:0;background:#f4f5f7;font:15px system-ui;color:#222}header{background:#171717;color:white;padding:22px 5vw}header small{color:#d6b75b}main{max-width:900px;margin:25px auto;padding:0 15px}.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:24px;margin:15px 0}.notice{background:#fff4d8;padding:14px;border-radius:8px}input,button,select{font:inherit;padding:10px;border:1px solid #aaa;border-radius:7px}input{display:block;width:95%;margin:6px 0 14px}button{background:#171717;color:white;cursor:pointer}.hidden{display:none}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;text-align:left;padding:10px;font-size:13px}</style></head>
<body><header><h2>PRIMARY MINER · Integration Test</h2><small>System Owner only · Read-only · No employee access</small></header><main>
<div id="status" class="notice">Sign in using your existing System Owner account.</div>
<section id="loginPanel" class="panel"><h3>System Owner login</h3><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="testPanel" class="panel hidden"><button id="logout">Sign out</button><h3>Wheeling Monday.com board connection</h3><p>Read-only test. No records will be changed.</p><select id="board"><option value="clients">Clients</option><option value="leads">Leads</option><option value="pipeline">Sales Pipeline</option><option value="quotes">Quotes</option><option value="tasks">Tasks</option><option value="documents">Documents</option><option value="activity">Activity</option></select> <button id="load">Test connection</button><div id="results"></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://lbheezjanvalalinqxcd.supabase.co',key='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',org='6b59eb32-4efb-48e4-85da-f25a86238e63';
const sb=createClient(url,key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),status=s=>{$('status').textContent=s},esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=ok=>{$('loginPanel').classList.toggle('hidden',ok);$('testPanel').classList.toggle('hidden',!ok)};
async function api(action,board_key){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Login required');const r=await fetch(url+'/functions/v1/miners-crm',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({action,board_key,organization_id:org})});const data=await r.json();if(!r.ok)throw Error(data.error||'Connection failed');return data}
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){show(false);return}try{const d=await api('configuration');if(d.role!=='system_owner')throw Error('System Owner permission required');show(true);status('System Owner verified. Backend connected. Sync disabled.')}catch(e){show(false);status('Access denied: '+e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status(error.message);return}await check()};
$('logout').onclick=async()=>{await sb.auth.signOut();show(false);status('Signed out')};
$('load').onclick=async()=>{$('load').disabled=true;$('results').textContent='Testing…';try{const d=await api('preview_board',$('board').value),items=d.items||[];$('results').innerHTML='<h3>'+esc(d.board_name)+' ('+items.length+' items)</h3>'+(items.length?'<table><tr><th>Item</th><th>Columns</th></tr>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc((x.column_values||[]).filter(c=>c.text).map(c=>c.id+': '+c.text).join(' | '))+'</td></tr>').join('')+'</table>':'<p>No records yet. Empty response confirms successful connection.</p>');status('Monday.com connection successful')}catch(e){$('results').textContent=e.message;status('Test failed')}finally{$('load').disabled=false}};
check();
</script></body></html>
