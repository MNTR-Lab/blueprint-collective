<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Primary Miner | Secure CRM Preview</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20232a;background:#f4f5f7;--gold:#c4971b;--dark:#17191d;--line:#e1e4e8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:248px;flex-shrink:0;background:var(--dark);color:white;padding:22px 13px;display:flex;flex-direction:column;gap:12px}.brand{padding:14px 10px 24px;border-bottom:1px solid #494949}.brand b{font-size:21px;letter-spacing:.6px}.brand small{display:block;color:#d6b75b;font-size:11px;letter-spacing:1.2px;margin-top:7px}nav{display:grid;gap:3px}.nav{width:100%;border:0;text-align:left;background:transparent;color:#c6c8ce;padding:12px 13px;border-radius:9px;font-size:13px}.nav:hover,.nav.active{background:#363330;color:#fff;border-left:3px solid var(--gold)}.sidebarfoot{margin-top:auto;border-top:1px solid #414141;padding:16px 8px 8px;text-align:center;font-size:11px;color:#bbb}main{min-width:0;flex:1}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:17px 26px}.top h1{margin:0;font-size:21px}.content{max-width:1480px;margin:auto;padding:25px}.pill{display:inline-block;border-radius:50px;background:#fff4d7;color:#735108;border:1px solid #f0dc9c;padding:7px 11px;font-size:11px;font-weight:750}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:19px}.heading h2{margin:0 0 5px;font-size:25px}.sub{font-size:13px;color:#66717d;margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px;margin-bottom:16px;box-shadow:0 2px 8px #00000006}.card{margin:0}.card label{font-size:12px;color:#66717d}.card strong{display:block;font-size:27px;margin:12px 0}.card small{color:#8c929b;font-size:11px}.btn{background:var(--dark);color:white;border:0;border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700}.btn.alt{background:#fff;color:#282a2f;border:1px solid #cfd3d9}.btn:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.field{border:1px solid #cfd5dc;border-radius:8px;padding:10px 11px;background:#fff;color:#222;min-width:140px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th{background:#f6f7f9;color:#68727d;text-transform:uppercase;font-size:10px;letter-spacing:.5px}td,th{padding:12px;border-bottom:1px solid #ebedf0;text-align:left}td{vertical-align:middle}.muted{color:#7a8590}.notice{border:1px solid #e9d8a8;background:#fffaf0;padding:14px;border-radius:10px;color:#725c29;font-size:12px;margin-bottom:18px;line-height:1.55}.error{border-color:#dca3a3;color:#9b2d2d;background:#fff3f3}.empty{padding:26px;text-align:center;color:#89919b}.hidden{display:none!important}#loginPanel{max-width:450px;margin:60px auto}#loginPanel input{width:100%;display:block;margin:8px 0 15px}#loginPanel label{font-size:13px}.secondary{font-size:12px;color:#777}.status{font-size:12px;color:#777}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.layout{display:block}aside{width:100%;padding:12px}.brand{padding:6px}nav{display:flex;overflow:auto}.nav{white-space:nowrap}.sidebarfoot{display:none}.content{padding:14px}.top{padding:13px}.cards{gap:9px}.card{padding:13px}}
</style></head>
<body><div class="layout"><aside><div class="brand"><b>PRIMARY MINER</b><small>WHEELING MINERS · CRM</small></div><nav id="nav"></nav><div class="sidebarfoot">Powered by Blueprint Collective<br>System Owner · Secure Preview</div></aside><main><header class="top"><h1 id="pageTitle">Dashboard</h1><div class="toolbar" style="margin:0"><span class="pill">OWNER PREVIEW · READ ONLY</span><span class="secondary" id="identity"></span><button class="btn alt hidden" id="signOut">Sign Out</button></div></header><div class="content"><div class="notice" id="status">Verifying System Owner access…</div><section id="loginPanel" class="panel hidden"><h2>System Owner Sign In</h2><p class="secondary">Use your existing Blueprint Collective credentials.</p><form id="loginForm"><label>Email<input class="field" id="email" type="email" required autocomplete="username"></label><label>Password<input class="field" id="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign In</button></form></section><section id="view" class="hidden"></section></div></main></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const URL='https://lbheezjanvalalinqxcd.supabase.co',KEY='sb_publishable_PVlEl61mo7WEm_0AiaIMAw_Us8xIXqC',ORG='6b59eb32-4efb-48e4-85da-f25a86238e63';
const sb=createClient(URL,KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const NAV=[['dashboard','▦','Dashboard'],['clients','▣','Clients'],['leads','◎','Leads'],['pipeline','◇','Sales Pipeline'],['quotes','▤','Quotes & Approvals'],['tasks','☷','Tasks & Follow-ups'],['documents','▧','Documents'],['activity','◫','Activity'],['messages','✉','Internal Messages'],['inbox','✉','Email Inbox'],['calendar','▦','Calendar'],['revenue','▥','Revenue & Goals'],['reports','◫','Reports'],['team','♙','Team & Users'],['archive','▤','Archived Records']];
const KEYS=['clients','leads','pipeline','quotes','tasks','documents','activity'];const LABELS=Object.fromEntries(NAV.map(([k,,v])=>[k,v]));
const $=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snapshot=null,page='dashboard',filter='',authorized=false;
function status(t,error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function visible(ok){authorized=ok;$('loginPanel').classList.toggle('hidden',ok);$('view').classList.toggle('hidden',!ok);$('signOut').classList.toggle('hidden',!ok)}
async function api(action){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please sign in');const r=await fetch(URL+'/functions/v1/miners-crm',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({action,organization_id:ORG})});let d;try{d=await r.json()}catch{throw Error('Invalid server response')}if(!r.ok)throw Error(d.error||'Connection failed');return d}
function rows(k){return snapshot?.boards?.[k]?.items||[]}
function card(label,value,caption){return '<div class="card"><label>'+safe(label)+'</label><strong>'+safe(value)+'</strong><small>'+safe(caption)+'</small></div>'}
function render(){if(!authorized||!snapshot)return;$('nav').innerHTML=NAV.map(([k,ico,name])=>'<button class="nav '+(page===k?'active':'')+'" data-page="'+k+'">'+ico+' &nbsp; '+name+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='';render()});$('pageTitle').textContent=LABELS[page]||'Dashboard';let html='';
if(page==='dashboard'){html='<div class="heading"><div><h2>Business Overview</h2><p class="sub">Connected to Wheeling Monday.com · Owner preview</p></div><button class="btn" id="refresh">Refresh Data</button></div><div class="cards">'+[...KEYS].map(k=>card(LABELS[k],rows(k).length,'Live board records (max 100)')).join('')+'</div><div class="panel"><h3>Connected Workspaces</h3><p class="secondary">All seven boards are isolated to Wheeling Miners. Data is read-only; creation, approvals, and team invitations are disabled.</p></div>'}
else if(KEYS.includes(page)){const items=rows(page),matches=items.filter(x=>[x.name,...(x.column_values||[]).map(c=>c.text)].join(' ').toLowerCase().includes(filter.toLowerCase()));html='<div class="heading"><div><h2>'+safe(LABELS[page])+'</h2><p class="sub">'+items.length+' records retrieved from Wheeling Monday.com (first 100 per board)</p></div><button class="btn" id="refresh">Refresh Data</button></div><div class="panel"><div class="toolbar"><input id="search" class="field" placeholder="Search records" value="'+safe(filter)+'"></div><div class="tablewrap">'+(matches.length?'<table><thead><tr><th>Record</th><th>Board details</th></tr></thead><tbody>'+matches.map(x=>'<tr><td>'+safe(x.name)+'</td><td>'+safe((x.column_values||[]).filter(c=>c.text).map(c=>c.text).join(' · '))+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">'+(filter?'No matching records':'No records in this Wheeling board yet')+'</div>')+'</div></div>'}
else{html='<div class="heading"><div><h2>'+safe(LABELS[page])+'</h2><p class="sub">Module awaiting secure backend integration</p></div></div><div class="panel"><h3>Not yet enabled</h3><p class="secondary">This section remains locked during pre-launch. No staging data, simulated records, or Blueprint Collective information is displayed.</p></div>'}
$('view').innerHTML=html;const refresh=$('refresh');if(refresh)refresh.onclick=load;const search=$('search');if(search)search.oninput=e=>{const pos=e.target.selectionStart;filter=e.target.value;render();const n=$('search');n.focus();n.setSelectionRange(pos,pos)}}
async function load(){const b=$('refresh');if(b)b.disabled=true;status('Loading Wheeling Monday.com boards…');try{const d=await api('dashboard_snapshot');if(d.organization_id!==ORG||d.read_only!==true||KEYS.some(k=>!d.boards?.[k]))throw Error('Unexpected Wheeling workspace response');snapshot=d;render();status('Connected to Wheeling Monday.com · System Owner only · Read-only · Employee access disabled')}catch(e){status('Data load failed: '+e.message,true)}finally{if(b)b.disabled=false}}
async function check(){try{const {data:{session}}=await sb.auth.getSession();if(!session){visible(false);status('Sign in as System Owner to access Wheeling CRM');return}const cfg=await api('configuration');if(cfg.organization_id!==ORG||cfg.role!=='system_owner')throw Error('System Owner access required');$('identity').textContent=session.user.email;visible(true);await load()}catch(e){visible(false);status('Access restricted: '+e.message,true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status(error.message,true);return}await check()};
$('signOut').onclick=async()=>{await sb.auth.signOut();snapshot=null;visible(false);status('Signed out')};check();
</script></body></html>
