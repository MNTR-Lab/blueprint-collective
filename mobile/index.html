<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint Collective — Mobile Login</title>
<style>
:root { --navy:#101c32; --line:#e5eaf1; }
* { box-sizing:border-box; }
body { margin:0; background:#e9eef5; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17253b; }
.shell { max-width:430px; min-height:100dvh; margin:auto; background:#f8fafc; box-shadow:0 0 60px #14243a25; overflow:hidden; }
.top { background:linear-gradient(145deg,#0d192d,#1d3354); color:white; padding:calc(env(safe-area-inset-top) + 25px) 25px 32px; border-radius:0 0 28px 28px; text-align:center; }
.brand { display:flex; justify-content:center; align-items:center; }
.brand-logo { display:block; width:min(100%,255px); max-height:92px; object-fit:contain; object-position:center; margin:0 auto; }
.eyebrow { font-size:11px; letter-spacing:2px; color:#9bb5d7; font-weight:700; margin-top:28px; text-align:center; }
.headline { font-size:29px; line-height:1.16; letter-spacing:-.8px; font-weight:750; margin:10px 0 9px; text-align:center; }
.sub { color:#c3d0e1; font-size:13px; line-height:1.6; margin:0; text-align:center; }
.content { padding:24px 22px 100px; }
.label { font-size:12px; font-weight:750; margin:0 0 14px; letter-spacing:.2px; }
.field { display:flex; align-items:center; gap:11px; background:white; border:1px solid var(--line); border-radius:13px; padding:0 15px; margin-bottom:12px; height:55px; color:#64748b; }
.field svg { flex-shrink:0; }
.field input { border:0; outline:0; font:inherit; font-size:14px; width:100%; min-width:0; background:transparent; color:#15233c; }
.field input::placeholder { color:#9caabd; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 1px 20px; font-size:12px; }
.remember { display:flex; align-items:center; gap:7px; color:#64748b; }
.remember input { accent-color:#243e68; }
.link { border:0; background:none; color:#315e9b; font-weight:700; font-size:12px; cursor:pointer; padding:0; }
.primary { background:#172b49; color:white; border:0; border-radius:13px; width:100%; padding:17px; font-weight:750; font-size:14px; cursor:pointer; box-shadow:0 8px 20px #172b4920; }
.primary:hover { background:#25426c; }
.hint { font-size:12px; color:#8290a4; text-align:center; margin:19px 0 26px; line-height:1.6; }
.foot { font-size:11px; color:#96a2b2; text-align:center; margin-top:25px; }
@media(min-width:600px) { body { padding:32px 0; } .shell { border-radius:30px; min-height:840px; } .top { padding-top:30px; } }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><img class="brand-logo" src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Blueprint_Collective-white.png?v=1791560539" alt="Blueprint Collective"></div>
    <div class="eyebrow">YOUR WORKSPACE. ONE PLACE.</div>
    <h1 class="headline">Welcome back.</h1>
    <p class="sub">Sign in securely to continue to your account.</p>
  </header>
  <div class="content">
    <p class="label">Sign in to your account</p>
    <label class="field"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" placeholder="Work email address" autocomplete="username"></label>
    <label class="field"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="link" type="button" id="toggle">Show</button></label>
    <div class="row"><label class="remember"><input type="checkbox" checked> Keep me signed in</label><button class="link" type="button" id="forgot">Forgot password?</button></div>
    <button class="primary" id="signin" type="button">Sign in →</button>
    <p id="login-status" role="status" aria-live="polite" style="font-size:12px;text-align:center;color:#8b3444;margin-top:10px"></p>
    <p class="hint">After sign-in, you’ll be taken directly to the account assigned to you.</p>
    <p class="foot">Powered by Blueprint Collective · Secure workspace access</p>
  </div>
</main>
<script>
const password=document.getElementById('password');
document.getElementById('toggle').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password';document.getElementById('toggle').textContent=password.type==='password'?'Show':'Hide';});
document.getElementById('signin').addEventListener('click',()=>{document.getElementById('login-status').textContent='Login connection is not configured yet. This page is a design preview only.';});
document.getElementById('forgot').addEventListener('click',()=>{document.getElementById('login-status').textContent='Password reset will be connected to the existing authentication system.';});
</script>
</body>
</html>
