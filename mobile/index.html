
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blueprint Collective — Private Mobile App Preview</title><style>
:root{--navy:#101c32;--navy2:#172842;--blue:#5c93ed;--muted:#94a3b8;--line:#e5eaf1}*{box-sizing:border-box}body{margin:0;background:#e9eef5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17253b}.shell{max-width:430px;min-height:100dvh;margin:auto;background:#f8fafc;box-shadow:0 0 60px #14243a25;position:relative;overflow:hidden}.top{background:linear-gradient(145deg,#0d192d,#1d3354);color:white;padding:calc(env(safe-area-inset-top) + 25px) 25px 32px;border-radius:0 0 28px 28px}.brand-logo{display:block;width:min(100%,255px);max-height:92px;object-fit:contain;object-position:left center}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:1.1px;font-size:15px}.mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff55;border-radius:11px;background:#ffffff14;color:#a9c8ff;font-size:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9bb5d7;font-weight:700;margin-top:28px}.headline{font-size:29px;line-height:1.16;letter-spacing:-.8px;font-weight:750;margin:10px 0 9px}.sub{color:#c3d0e1;font-size:13px;line-height:1.6;margin:0}.content{padding:24px 22px 100px}.label{font-size:12px;font-weight:750;margin:0 0 14px;letter-spacing:.2px}.field{display:flex;align-items:center;gap:11px;background:white;border:1px solid var(--line);border-radius:13px;padding:0 15px;margin-bottom:12px;height:55px;color:#64748b}.field svg{flex-shrink:0}.field input{border:0;outline:0;font:inherit;font-size:14px;width:100%;background:transparent;color:#15233c}.field input::placeholder{color:#9caabd}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 1px 20px;font-size:12px}.remember{display:flex;align-items:center;gap:7px;color:#64748b}.remember input{accent-color:#243e68}.link{border:0;background:none;color:#315e9b;font-weight:700;font-size:12px;cursor:pointer;padding:0}.primary{background:#172b49;color:white;border:0;border-radius:13px;width:100%;padding:17px;font-weight:750;font-size:14px;cursor:pointer;box-shadow:0 8px 20px #172b4920}.primary:hover{background:#25426c}.hint{font-size:12px;color:#8290a4;text-align:center;margin:19px 0 26px;line-height:1.6}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:10px;font-weight:800;letter-spacing:1.6px;margin:22px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#e0e6ee}.orgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.org{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);padding:14px 12px;border-radius:13px;min-height:69px}.org .symbol{width:33px;height:33px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:#edf2fa;color:#29466c;font-weight:800;font-size:13px}.org strong{font-size:11px;line-height:1.4;display:block}.org small{font-size:10px;color:#95a2b5;display:block;margin-top:3px}.foot{font-size:11px;color:#96a2b2;text-align:center;margin-top:25px}.screen{display:none}.screen.active{display:block}.back{background:none;border:0;color:#d3e0f1;cursor:pointer;padding:0;font-size:13px}.dashboard{padding:25px 22px}.dashboard h2{font-size:24px;margin:6px 0 8px}.dashboard p{color:#69788c;font-size:13px;line-height:1.6}.dashboard .org{margin:12px 0}.secondary{border:1px solid #d9e2ef;background:white;border-radius:12px;padding:14px;width:100%;color:#233d60;font-weight:700;cursor:pointer}.notice{background:#edf4ff;border:1px solid #d7e6fc;padding:14px;border-radius:12px;color:#3a577b;font-size:12px;line-height:1.5;margin-top:17px}@media(min-width:600px){body{padding:32px 0}.shell{border-radius:30px;min-height:840px}.top{padding-top:30px}}
</style></head><body><main class="shell"><section id="login" class="screen active"><header class="top"><div class="brand"><img class="brand-logo" src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Blueprint_Collective-white.png?v=1791560539" alt="Blueprint Collective" /></div><div class="eyebrow">YOUR WORKSPACE. ONE PLACE.</div><h1 class="headline">Welcome back.</h1><p class="sub">Sign in securely to continue to your account.</p></header><div class="content"><p class="label">Sign in to your account</p><label class="field"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" placeholder="Work email address" autocomplete="username"></label><label class="field"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="link" type="button" id="toggle">Show</button></label><div class="row"><label class="remember"><input type="checkbox" checked> Keep me signed in</label><button class="link" type="button" onclick="alert('Password reset will be connected to the existing authentication system.')">Forgot password?</button></div><button class="primary" id="signin" type="button">Sign in →</button><p id="login-status" role="status" aria-live="polite" style="font-size:12px;text-align:center;color:#8b3444;margin-top:10px"></p><p class="hint">After sign-in, you’ll be taken directly to the account assigned to you.</p><p class="foot">Powered by Blueprint Collective · Secure workspace access</p></div></section></main><script>
document.getElementById('toggle').addEventListener('click',()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('toggle').textContent=p.type==='password'?'Show':'Hide';});
document.getElementById('signin').addEventListener('click',()=>{document.getElementById('login-status').textContent='Login connection is not configured yet. This page is a design preview only.';});
</script></body></html>
