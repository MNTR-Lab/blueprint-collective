<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tasks · Blueprint Collective</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#19334f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#11253e;color:white;padding:22px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}main{max-width:1050px;margin:38px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:26px;box-shadow:0 6px 20px #18344d09}h1{margin:0 0 8px;font-size:27px}p{color:#6a7b8d;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.metric{background:white;border:1px solid #e1e8f0;border-radius:12px;padding:20px}.metric strong{font-size:29px;display:block;margin-top:9px}.metric span{font-size:12px;color:#687d91}button{background:#173f6b;color:white;border:0;border-radius:8px;padding:11px 17px;font-weight:650;cursor:pointer}button.secondary{background:#eef3f8;color:#1c3b5a}input,select{font:inherit;border:1px solid #ccd8e4;border-radius:8px;padding:10px;width:100%}label{display:block;margin:20px 0 8px;font-weight:650;font-size:13px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:15px;text-align:left;border-bottom:1px solid #e6ecf2;font-size:13px}th{color:#65798e;background:#f7f9fc}td small{display:block;color:#718396;margin-top:4px}.scroll{overflow:auto}.hide{display:none}.message{padding:10px 0;font-size:13px;color:#ae2b36}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}header{padding:18px 20px}}</style></head><body>
<header><b>BLUEPRINT COLLECTIVE <span style="font-weight:400;color:#b7cce1">/ My Tasks</span></b><button id="signout" class="secondary hide">Sign Out</button></header><main>
<section id="login" class="panel" style="max-width:460px;margin:80px auto"><h1>Employee Sign In</h1><p>Use the email address your administrator invited to this workspace.</p><form id="loginform"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required placeholder="you@company.com"><p id="loginmsg" class="message"></p><button type="submit">Email Sign-In Link</button></form></section>
<section id="workspace" class="hide"><div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><div><h1>My Tasks</h1><p id="greeting">Your assigned work</p></div><button class="secondary" id="refresh">Refresh</button></div><div class="grid"><div class="metric"><span>Assigned</span><strong id="total">0</strong></div><div class="metric"><span>In Progress</span><strong id="progress">0</strong></div><div class="metric"><span>Completed</span><strong id="completed">0</strong></div></div><section class="panel"><h2 style="font-size:18px">Assigned Tasks</h2><p id="status" class="message"></p><div class="scroll"><table><thead><tr><th>Task / Project</th><th>Due Date</th><th>Priority</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const url='https://lbheezjanvalalinqxcd.supabase.co',key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiaGVlemphbnZhbGFsaW5xeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjIwNDcsImV4cCI6MjEwNzEzODA0N30.lDap2OWhFi3udJQorDmtEKF-WhOt62I8ZLbENQRqaoM',client=supabase.createClient(url,key),fn=url+'/functions/v1/blueprint-employee';
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,extra={}){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Please sign in');const r=await fetch(fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){el('status').textContent='Loading…';try{const [p,d]=await Promise.all([call('profile'),call('my_tasks')]);el('greeting').textContent='Welcome, '+p.staff.display_name;const jobs=Object.fromEntries(d.jobs.map(x=>[x.id,x.title]));el('total').textContent=d.tasks.length;el('progress').textContent=d.tasks.filter(x=>x.status==='In Progress').length;el('completed').textContent=d.tasks.filter(x=>x.status==='Completed').length;el('rows').innerHTML=d.tasks.map(t=>'<tr><td><b>'+esc(t.title)+'</b><small>'+esc(jobs[t.job_id]||'')+'</small></td><td>'+esc(t.due_date||'Not set')+'</td><td>'+esc(t.priority||'Normal')+'</td><td><select aria-label="Status for '+esc(t.title)+'" data-task="'+esc(t.id)+'">'+['To Do','In Progress','Completed'].map(v=>'<option '+(v===t.status?'selected':'')+'>'+v+'</option>').join('')+'</select></td></tr>').join('')||'<tr><td colspan="4">No tasks assigned yet.</td></tr>';el('status').textContent='';document.querySelectorAll('[data-task]').forEach(e=>e.onchange=async()=>{try{await call('update_task',{taskId:e.dataset.task,status:e.value});await load()}catch(err){el('status').textContent=err.message;await load()}})}catch(err){el('status').textContent=err.message}}
async function show(){const {data:{session}}=await client.auth.getSession();el('login').classList.toggle('hide',!!session);el('workspace').classList.toggle('hide',!session);el('signout').classList.toggle('hide',!session);if(session)await load()}
el('loginform').onsubmit=async e=>{e.preventDefault();el('loginmsg').textContent='Sending…';const {error}=await client.auth.signInWithOtp({email:el('email').value.trim(),options:{emailRedirectTo:location.origin+'/employee.html',shouldCreateUser:false}});el('loginmsg').textContent=error?error.message:'Check your email for a secure sign-in link.'};
el('signout').onclick=async()=>{await client.auth.signOut();await show()};
el('refresh').onclick=load;client.auth.onAuthStateChange(()=>setTimeout(show,0));show();
</script></body></html>
