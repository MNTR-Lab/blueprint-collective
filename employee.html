let data;try{data=JSON.parse(localStorage.getItem(K))||structuredClone(sample)}catch{data=structuredClone(sample)};let page='dashboard',business='blueprint',search='',clientTab='active',settingsTab='businesses';const navs=[['dashboard','▦','Dashboard'],['team-directory','♙','Team Directory'],['email','✉','Email Inbox'],['client-management','▣','Clients'],['leads','◎','Leads'],['deals','◇','Opportunities'],['jobs','▤','Jobs & Projects'],['tasks','☷','Tasks & Activities'],['revenue','▥','Revenue Goals'],['settings','⚙','Settings'],['logout','⇥','Log Out']];const schemas={leads:{title:'Leads',fields:['name','company','email','status','value','owner'],statuses:['New','Contacted','Qualified','Unqualified','Converted']},clients:{title:'Companies & Clients',fields:['name','email','status','owner'],statuses:['Prospect','Active','Inactive','Archived']},contacts:{title:'Contacts',fields:['name','company','email','status'],statuses:['Primary','Secondary','Other']},deals:{title:'Opportunities',fields:['name','company','value','status','owner'],statuses:['Discovery','Quoting','Proposal Sent','Negotiation','Won','Lost']},jobs:{title:'Jobs & Projects',fields:['name','company','status','owner'],statuses:['Not Started','In Progress','On Hold','Completed']},tasks:{title:'Activities & Tasks',fields:['name','company','status','owner'],statuses:['Open','In Progress','Completed']}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(data));const records=k=>data.records[k].filter(x=>x.businessId===business);const fmt=n=>'$'+Number(n||0).toLocaleString();const badge=s=>{let c=/active|won|qualified|completed/i.test(s)?'green':/new|progress|proposal|contacted/i.test(s)?'orange':/lost|unqualified/i.test(s)?'red':'gray';return `<span class="status ${c}">${esc(s)}</span>`};function render(){document.getElementById('nav').innerHTML=navs.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''}" onclick="${id==='logout'?'bcLogout()':`navigate('${id}')`}"><span>${icon}</span>${label}${id==='email'&&bcMailHasNew?'<span class="bc-new-mail-dot" title="New email received" aria-label="New email received"></span>':''}${id==='jobs'&&bcJobsHasNew?'<span class="bc-new-mail-dot" title="New job or client approval activity" aria-label="New job activity"></span>':''}${id==='tasks'&&bcTasksHasNew?'<span class="bc-new-mail-dot" title="New task added" aria-label="New task"></span>':''}</button>`).join('');document.getElementById('topTitle').textContent=navs.find(n=>n[0]===page)[2];document.getElementById('businessSelect').innerHTML=data.businesses.map(b=>`<option value="${esc(b.id)}" ${business===b.id?'selected':''}>${esc(b.name)}</option>`).join('');document.getElementById('businessSelect').onchange=e=>{business=e.target.value;search='';render()};document.getElementById('view').innerHTML=page==='dashboard'?dashboard():page==='team-directory'?'<div class="heading"><div><h2>Team Directory</h2><p>Manage your team members and invitations.</p></div></div><section class="panel"><p>Select Team Directory to manage employees.</p></section>':page==='revenue'?bcRevenuePage():page==='client-management'?clientManagement():schemas[page]?listPage(page):page==='connections'?connections():page==='contacts'?listPage('contacts'):page==='clients'?clientManagement():settings();}function navigate(p){page=p;search='';if(p==='email')bcMailMarkSeen();if(p==='tasks')bcTasksMarkSeen();render();if(p==='team-directory')bcOpenTeamDirectory()}

/* Revenue Goals admin prototype. Data is local to this browser until backend integration. */
const BC_REV_KEY='blueprint_revenue_preview_v1';
function bcRevLoad(){try{return JSON.parse(localStorage.getItem(BC_REV_KEY))||{}}catch{return {}}}
let bcRev=Object.assign({enabled:true,goal:750000,start:'2026-10-01',end:'2027-06-30',entries:[]},bcRevLoad());
function bcRevSave(){localStorage.setItem(BC_REV_KEY,JSON.stringify(bcRev))}
function bcRevMoney(n){return Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
function bcRevSummary(){let entries=bcRev.entries.filter(x=>x.date>=bcRev.start&&x.date<=bcRev.end);let verified=entries.filter(x=>x.verified).reduce((a,x)=>a+Number(x.amount),0),pending=entries.filter(x=>!x.verified).reduce((a,x)=>a+Number(x.amount),0),remaining=Math.max(0,bcRev.goal-verified),days=Math.max(0,Math.ceil((new Date(bcRev.end+'T12:00:00')-new Date())/86400000));return {verified,pending,remaining,days,weekly:days?remaining*7/days:0,monthly:days?remaining*30.4375/days:0}}
function bcRevenueSummaryCard(){if(!bcRev.enabled)return '';const x=bcRevSummary();return '<section class="panel"><div class="heading"><div><h2>Revenue Performance</h2><p>Custom cycle: '+bcRev.start+' to '+bcRev.end+'</p></div><button class="btn secondary" onclick="navigate(\'revenue\')">Manage Revenue Goals →</button></div><div class="cards">'+[['Revenue Goal',bcRevMoney(bcRev.goal)],['Verified Revenue',bcRevMoney(x.verified)],['Remaining Goal',bcRevMoney(x.remaining)],['Weekly Needed',bcRevMoney(x.weekly)]].map(a=>'<div class="card"><div class="label">'+a[0]+'</div><div class="value">'+a[1]+'</div></div>').join('')+'</div><div class="bar"><div style="width:'+Math.min(100,bcRev.goal?x.verified/bcRev.goal*100:0)+'%;background:#1c9567"></div></div><p class="notice">Preview only — values are not yet synchronized with live job records.</p></section>'}
function bcRevenuePage(){const x=bcRevSummary(),pct=bcRev.goal?Math.min(100,x.verified/bcRev.goal*100):0;return '<div class="heading"><div><h2>Revenue Goals & Performance</h2><p>Custom revenue cycles and required Admin verification.</p></div><span class="pill">Admin preview · Local only</span></div><section class="panel"><div class="toolbar"><label><input id="bcRevEnabled" type="checkbox" '+(bcRev.enabled?'checked':'')+'> Enable Revenue Module</label></div><div class="formgrid"><label>Revenue Goal ($)<input id="bcRevGoal" type="number" min="1" value="'+bcRev.goal+'"></label><label>Cycle Start<input id="bcRevStart" type="date" value="'+bcRev.start+'"></label><label>Cycle End<input id="bcRevEnd" type="date" value="'+bcRev.end+'"></label></div><div class="actions"><button class="btn" onclick="bcRevSettings()">Save Goal Settings</button></div></section><div class="cards">'+[['Revenue Goal',bcRevMoney(bcRev.goal)],['Verified Revenue',bcRevMoney(x.verified)],['Remaining Goal',bcRevMoney(x.remaining)],['Pending Verification',bcRevMoney(x.pending)]].map(a=>'<div class="card"><div class="label">'+a[0]+'</div><div class="value">'+a[1]+'</div></div>').join('')+'</div><section class="panel"><h3>Goal Progress — '+pct.toFixed(1)+'%</h3><div class="bar"><div style="width:'+pct+'%;background:#1c9567"></div></div><div class="cards" style="margin-top:22px"><div class="card"><div class="label">Required Weekly Sales</div><div class="value">'+bcRevMoney(x.weekly)+'</div></div><div class="card"><div class="label">Required Monthly Sales</div><div class="value">'+bcRevMoney(x.monthly)+'</div></div><div class="card"><div class="label">Days Remaining</div><div class="value">'+x.days+'</div></div><div class="card"><div class="label">Cycle</div><div class="foot">'+bcRev.start+' → '+bcRev.end+'</div></div></div></section><section class="panel"><div class="heading"><div><h2>Closed Job Revenue Verification</h2><p>Job amounts will prefill when live integration is connected.</p></div><button class="btn secondary" onclick="bcRevAdd()">+ Add Preview Job</button></div><div class="tablewrap"><table><thead><tr><th>Job</th><th>Closed Date</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>'+bcRev.entries.map((e,i)=>'<tr><td>'+esc(e.job)+'</td><td>'+esc(e.date)+'</td><td>'+bcRevMoney(e.amount)+'</td><td>'+ (e.verified?'<span class="status green">Verified</span>':'<span class="status orange">Pending</span>')+'</td><td><button class="btn secondary" onclick="bcRevVerify('+i+')">'+(e.verified?'Review / Adjust':'Verify Amount')+'</button></td></tr>').join('')+'</tbody></table></div>'+(bcRev.entries.length?'':'<div class="empty">No revenue entries yet. Add a preview job to test verification.</div>')+'</section><div class="alert">This is a front-end preview. Changes are saved only in this browser and do not affect live revenue or CRM jobs.</div>'}
function bcRevSettings(){let goal=Number(document.getElementById('bcRevGoal').value),start=document.getElementById('bcRevStart').value,end=document.getElementById('bcRevEnd').value;if(!(goal>0)||!start||!end||start>end){alert('Enter a valid goal and date range.');return}Object.assign(bcRev,{goal,start,end,enabled:document.getElementById('bcRevEnabled').checked});bcRevSave();render()}
function bcRevAdd(){let job=prompt('Preview job name:','New Closed Job');if(!job)return;let value=Number(prompt('Proposed revenue amount:','12500'));if(!Number.isFinite(value)||value<0){alert('Invalid amount');return}bcRev.entries.push({job,date:bcRev.start,amount:value,verified:false});bcRevSave();render()}
function bcRevVerify(i){let e=bcRev.entries[i];if(!e)return;let input=prompt('Verify closed revenue for '+e.job+'. Adjust the amount if needed:',e.amount);if(input===null)return;let amount=Number(input);if(!input.trim()||!Number.isFinite(amount)||amount<0){alert('Invalid amount');return}if(!confirm('Verify and approve '+bcRevMoney(amount)+' for '+e.job+'?'))return;e.amount=amount;e.verified=true;e.verifiedAt=new Date().toISOString();bcRevSave();render()}

function dashboard(){const leads=records('leads'),deals=records('deals'),jobs=records('jobs'),tasks=records('tasks');let active=deals.filter(x=>!['Won','Lost'].includes(x.status));return `${bcRevenueSummaryCard()}<div class="heading"><div><h2>Business Overview</h2><p>Track your pipeline, customers, and work in one place.</p></div><button class="btn" onclick="openRecord('leads')">+ New Lead</button></div><div class="alert">Demo workspace: sample records are fictional and saved only in this browser. Live data synchronization is not enabled.</div><div class="cards">${[['Total Leads',leads.length,'All stages'],['Open Pipeline',fmt(active.reduce((a,b)=>a+Number(b.value||0),0)),'Unclosed opportunities'],['Active Jobs',jobs.filter(x=>x.status!=='Completed').length,'In progress or pending'],['Open Tasks',tasks.filter(x=>x.status!=='Completed').length,'Follow-ups to complete']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="foot">${x[2]}</div></div>`).join('')}</div><div class="twocol"><section class="panel"><h3>Recent Leads</h3>${table('leads',leads.slice(0,5),true)}<button class="btn secondary" onclick="navigate('leads')">View all leads →</button></section><section class="panel"><h3>Sales Pipeline</h3>${schemas.deals.statuses.map(s=>{let count=deals.filter(x=>x.status===s).length;return `<div class="line"><span>${esc(s)}</span><b>${count}</b></div><div class="bar"><div style="width:${deals.length?count/deals.length*100:0}%"></div></div>`}).join('')}</section></div><section class="panel"><h3>Next Steps</h3><p class="muted">Configure your business profile and data mappings in Connections. Live synchronization will be enabled after the secure backend is deployed.</p></section>`}function table(k,items,compact=false){let fields=compact?['name','company','status']:schemas[k].fields;return `<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f==='name'?'Name':f)}</th>`).join('')}<th></th></tr></thead><tbody>${items.length?items.map(x=>`<tr>${fields.map(f=>`<td>${f==='status'?badge(x[f]):f==='value'?fmt(x[f]):esc(x[f])}</td>`).join('')}<td><button class="btn secondary" onclick="openRecord('${k}','${x.id}')">Edit</button></td></tr>`).join(''):`<tr><td class="empty" colspan="${fields.length+1}">No records yet</td></tr>`}</tbody></table></div>`}function listPage(k){let r=records(k).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));return `<div class="heading"><div><h2>${schemas[k].title}</h2><p>${r.length} record${r.length===1?'':'s'} in this business</p></div><button class="btn" onclick="openRecord('${k}')">+ Add ${k==='clients'?'Client':k==='deals'?'Opportunity':k==='tasks'?'Task':k==='jobs'?'Job':k==='contacts'?'Contact':'Lead'}</button></div><section class="panel"><div class="toolbar"><input id="search" class="field" placeholder="Search records..." value="${esc(search)}" oninput="search=this.value;document.getElementById('resultTable').innerHTML=table('${k}',records('${k}').filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase()))))"><span class="pill">Business-isolated records</span></div><div id="resultTable">${table(k,r)}</div></section>`}function openRecord(k,id){let old=id?data.records[k].find(x=>x.id===id):null;let schema=schemas[k];document.getElementById('modal').innerHTML=`<h3>${old?'Edit':'Add'} ${schema.title.replace(/s$/,'')}</h3><form id="recordForm"><div class="formgrid">${schema.fields.map(f=>`<label class="${f==='name'?'wide':''}">${esc(f[0].toUpperCase()+f.slice(1))}${f==='status'?`<select name="${f}">${schema.statuses.map(s=>`<option ${old?.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`:`<input name="${f}" ${f==='value'?'type="number" min="0" step="0.01"':f==='email'?'type="email"':'type="text"'} value="${esc(old?.[f]??(f==='owner'?'Admin':''))}" ${f==='name'?'required':''}>`}</label>`).join('')}</div><div class="actions">${old?`<button type="button" class="btn danger" onclick="deleteRecord('${k}','${id}')">Delete</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save Record</button></div></form>`;document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target));if(k==='leads'||k==='deals')values.value=Number(values.value||0);if(old)Object.assign(old,values);else data.records[k].unshift({id:crypto.randomUUID(),businessId:business,...values});save();closeModal();render()};document.getElementById('modalbg').classList.add('show')}function deleteRecord(k,id){if(!confirm('Delete this demo record?'))return;data.records[k]=data.records[k].filter(x=>x.id!==id);save();closeModal();render()}function closeModal(){document.getElementById('modalbg').classList.remove('show')}document.getElementById('modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});function clientManagement(){
 const all=records('clients'),active=all.filter(x=>!x.inactive),inactive=all.filter(x=>x.inactive);
 const viewRows=(items)=>`<div class="tablewrap"><table><thead><tr><th>Company / Client</th><th>Client Number</th><th>Primary Contact</th><th>Email</th><th>Phone</th><th>Status</th><th>Make Inactive</th><th></th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.clientNumber||'Legacy record')}</td><td>${esc(x.contactName||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td><td>${badge(x.inactive?'Inactive':x.status||'Active')}</td><td><label style="display:flex;align-items:center;gap:8px;white-space:nowrap"><input type="checkbox" ${x.inactive?'checked':''} onchange="setClientInactive('${x.id}',this.checked)"> Make Inactive</label></td><td><button class="btn secondary" onclick="openClientIntake('${x.id}')">Edit</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No clients in this section</td></tr>'}</tbody></table></div>`;

 const body=clientTab==='contacts'?`<section class="panel"><div class="heading"><div><h3>Contacts</h3><p>People associated with your clients</p></div><button class="btn secondary" onclick="openRecord('contacts')">+ Add Contact</button></div>${table('contacts',records('contacts'))}</section>`:`<section class="panel"><h3>${clientTab==='inactive'?'Inactive / Archived Clients':'Active Clients'}</h3>${viewRows(clientTab==='inactive'?inactive:active)}</section>`;
 return `<div class="heading"><div><h2>Clients</h2><p>Client intake, directory, and contacts in one place</p></div><button class="btn" onclick="openClientIntake()">+ New Client</button></div><div class="alert">Local demonstration only. Client numbers and checkbox changes are stored in this browser; they are not yet synchronized with the master client board. Do not enter confidential customer data until secure synchronization is enabled.</div>${tabbar}${body}`;

 document.getElementById('clientIntakeForm').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target));if(x){Object.assign(x,vals)}else{data.records.clients.unshift({id:crypto.randomUUID(),businessId:business,clientNumber:generateDemoClientNumber(),status:'Active',inactive:false,createdAt:new Date().toISOString(),...vals})}save();closeModal();render()};document.getElementById('modalbg').classList.add('show');

 if(key==='type')bcTypeFilter=v;
 if(key==='rep')bcRepFilter=v;
 if(key==='sort')bcSort=v;
 bcRenderClientResults();
}
function bcClearFilters(){
 bcSearch='';bcTypeFilter='all';bcRepFilter='all';bcSort='name-asc';render();
}
function bcFilteredClients(){
 const q=bcSearch.trim().toLocaleLowerCase();
 const current=clientTab==='inactive'?bcClients.filter(x=>x.inactive):bcClients.filter(x=>!x.inactive);
 const filtered=current.filter(x=>{
  const searchable=[x.name,x.clientNumber,x.contactName,x.email,x.phone,x.address,x.city,x.state,x.zip].map(v=>String(v||'').toLocaleLowerCase());
  const matchesSearch=!q||searchable.some(v=>v.includes(q));
  const matchesType=bcTypeFilter==='all'||String(x.type||'').split(',').map(v=>v.trim()).includes(bcTypeFilter);
  const matchesRep=bcRepFilter==='all'||(bcRepFilter==='unassigned'?!x.representative:x.representative===bcRepFilter);
  return matchesSearch&&matchesType&&matchesRep;
 });
 const collator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
 filtered.sort((a,b)=>{
  if(bcSort==='name-desc')return collator.compare(b.name||'',a.name||'');
  if(bcSort==='newest')return (b.createdAt||'').localeCompare(a.createdAt||'')||collator.compare(a.name||'',b.name||'');
  if(bcSort==='oldest')return (a.createdAt||'').localeCompare(b.createdAt||'')||collator.compare(a.name||'',b.name||'');
  if(bcSort==='number')return collator.compare(a.clientNumber||'',b.clientNumber||'');
  return collator.compare(a.name||'',b.name||'');
 });
 return filtered;
}

 <label>Assigned representative<select onchange="bcFilterChange('rep',this.value)">${options(repOptions,bcRepFilter)}</select></label>
 <label>Sort by<select onchange="bcFilterChange('sort',this.value)">${options(sortOptions,bcSort)}</select></label>
 </div>
 <div style="margin-bottom:12px"><button class="btn secondary" onclick="bcClearFilters()">Clear Filters</button></div>
 <div id="bcFilteredResults"><p class="notice">Showing ${bcFilteredClients().length} of ${clientTab==='inactive'?inactive.length:active.length} clients</p>${bcClientRows(bcFilteredClients())}</div>
 </section>`;
};
</script>

<script>
/* Live contact directory, linked to verified client records */
let bcContacts=[],bcContactsLoaded=false,bcContactsLoading=false,bcContactsError='';
const bcBaseLoad=bcLoad;
bcLoad=async function(){
 await bcBaseLoad();
 if(bcSession)await bcLoadContacts();
};
function bcContactCol(item,id){return(item.column_values||[]).find(x=>x.id===id)?.text||''}
function bcContactValue(item,id){const c=(item.column_values||[]).find(x=>x.id===id);try{return JSON.parse(c?.value||'null')}catch{return null}}
function bcContactConvert(item){return{id:String(item.id),name:item.name,
 clientNumber:bcContactCol(item,'text_mm7zy7k0'),clientId:bcContactCol(item,'text_mm7z5k5x'),
 company:bcContactCol(item,'text_mm7zbtdm'),title:bcContactCol(item,'text_mm7zwtx2'),
 email:bcContactCol(item,'email_mm7zfbk8'),phone:bcContactCol(item,'phone_mm7zyfzm'),
 primary:bcContactValue(item,'boolean_mm7zkts3')?.checked===true||bcContactCol(item,'boolean_mm7zkts3').toLowerCase()==='v',
 notes:bcContactCol(item,'long_text_mm7z8r9c')}}
async function bcLoadContacts(){
 if(!bcSession)return;
 bcContactsLoading=true;bcContactsError='';render();
 try{const d=await bcCall('contacts_list');bcContacts=(d.items||[]).map(bcContactConvert);bcContactsLoaded=true}
 catch(e){bcContactsError=e.message;bcContactsLoaded=false}
 finally{bcContactsLoading=false;render()}
}
function bcContactsView(){
 const rows=bcContacts.slice().sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="heading"><div><h2>Clients</h2><p>Live MNTR+ Database contact directory</p></div><div class="actions"><button class="btn secondary" onclick="bcLoadContacts()">↻ Refresh</button><button class="btn" onclick="bcOpenContact()">+ Add Contact</button></div></div>
 <div class="toolbar">${[['active','Active Clients',bcClients.filter(x=>!x.inactive).length],['inactive','Inactive Clients',bcClients.filter(x=>x.inactive).length],['contacts','Contacts',bcContacts.length]].map(([id,label,n])=>`<button class="btn ${clientTab===id?'':'secondary'}" onclick="switchClientTab('${id}')">${label} (${n})</button>`).join('')}</div>
 ${bcContactsError?`<div class="alert">${esc(bcContactsError)}</div>`:''}
 ${bcContactsLoading?'<p class="notice">Loading contacts…</p>':''}
 <section class="panel"><div class="heading"><div><h3>Contacts</h3><p>People linked to your client records</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Client Number</th><th>Job Title</th><th>Email</th><th>Phone</th><th>Primary</th><th></th></tr></thead><tbody>
 ${rows.length?rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.company)}</td><td>${esc(c.clientNumber)}</td><td>${esc(c.title)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.primary?'Yes':'—'}</td><td><button class="btn secondary" onclick="bcOpenContact('${esc(c.id)}')">Edit</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No contacts have been added yet.</td></tr>'}
 </tbody></table></div></section>`;
}
function bcOpenContact(id){
 const c=id?bcContacts.find(x=>x.id===String(id)):null;
 if(id&&!c){alert('Contact not found. Refresh and try again.');return}
 if(!bcClients.length){alert('Create a client first, then add its contacts.');return}
 const opts=bcClients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${esc(x.id)}" ${String(c?.clientId||'')===String(x.id)?'selected':''}>${esc(x.name)} (${esc(x.clientNumber)})</option>`).join('');
 document.getElementById('modal').innerHTML=`<h3>${c?'Edit Contact':'Add Contact'}</h3><p class="notice">Contacts are linked to the selected client in the MNTR+ Database.</p><form id="bcContactForm"><div class="formgrid">
 <label class="wide">Client / Company<select name="clientId" required><option value="">Select client</option>${opts}</select></label>
 ${[['name','Contact Name',true],['title','Job Title',false],['email','Email',false],['phone','Phone',false]].map(([key,label,req])=>`<label>${label}<input name="${key}" ${key==='email'?'type="email"':''} value="${esc(c?.[key]||'')}" ${req?'required':''}></label>`).join('')}
 <label class="wide" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="primary" ${c?.primary?'checked':''}> Primary Contact</label>
 <label class="wide">Notes<textarea name="notes" rows="3">${esc(c?.notes||'')}</textarea></label>
 </div><p id="bcContactError" class="notice"></p><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">${c?'Save Contact Changes':'Create Contact in Database'}</button></div></form>`;
 document.getElementById('bcContactForm').onsubmit=async e=>{
 e.preventDefault();const btn=e.target.querySelector('button[type=submit]'),msg=document.getElementById('bcContactError');btn.disabled=true;msg.textContent='Saving contact…';
 try{const vals=Object.fromEntries(new FormData(e.target));vals.primary=e.target.elements.primary.checked;
 await bcCall(c?'contacts_update':'contacts_create',c?{id:c.id,...vals}:vals);
 closeModal();await bcLoadContacts();if(bcContactsError)alert('Saved, but refreshing contacts failed: '+bcContactsError);
 }catch(err){msg.textContent='Unable to save: '+err.message}
 finally{btn.disabled=false}
 };
 document.getElementById('modalbg').classList.add('show');
}
const bcContactsOriginalManagement=clientManagement;
clientManagement=function(){if(bcSession&&clientTab==='contacts')return bcContactsView();return bcContactsOriginalManagement()};
if(bcSession)bcLoadContacts();
</script>

<script>
let bcLeads=[],bcLeadsError='',bcLeadsLoading=false,bcLeadSearch='',bcLeadStatus='All';
const bcLeadStatuses=['New','Contacted','Qualified','Proposal Sent','Won','Lost'];
function bcLeadCol(item,id){return(item.column_values||[]).find(c=>c.id===id)?.text||''}
function bcLeadConvert(x){return{id:String(x.id),name:x.name,contact:bcLeadCol(x,'text_mm7z6xwp'),email:bcLeadCol(x,'email_mm7zqcz7'),phone:bcLeadCol(x,'phone_mm7zytyq'),status:bcLeadCol(x,'color_mm7zqvy7')||'New',source:bcLeadCol(x,'text_mm7z89gz'),type:bcLeadCol(x,'text_mm7z4y0h'),rep:bcLeadCol(x,'text_mm7z6nvy'),follow:bcLeadCol(x,'date_mm7z4fz0'),value:bcLeadCol(x,'numeric_mm7znksy'),notes:bcLeadCol(x,'long_text_mm7zrbr1')}}
async function bcLoadLeads(){if(!bcSession)return;bcLeadsLoading=true;bcLeadsError='';render();try{const d=await bcCall('leads_list');bcLeads=(d.items||[]).map(bcLeadConvert)}catch(e){bcLeadsError=e.message}finally{bcLeadsLoading=false;render()}}
const bcLeadConvertOriginal=bcLeadConvert;
bcLeadConvert=function(x){const v=bcLeadConvertOriginal(x);v.converted=bcLeadCol(x,'text_mm7zn3q7');return v};
async function bcConvertLead(id){
 const lead=bcLeads.find(x=>x.id===String(id));
 if(!lead)return alert('Lead not found. Refresh and try again.');
 if(lead.converted)return alert('Already converted to '+lead.converted);
 if(!confirm('Convert '+lead.name+' into an ACTIVE CLIENT? This creates a permanent BC client number and marks the lead Won.'))return;
 try{const r=await bcCall('lead_convert',{id:lead.id});alert('Client created: '+r.clientNumber+(r.contactWarning?'\n'+r.contactWarning:''));await bcLoadLeads();await bcLoad();await bcLoadContacts()}
 catch(e){alert('Conversion error: '+e.message+'\nRefresh before attempting anything further.')}
}
function bcLeadRows(){const q=bcLeadSearch.trim().toLowerCase();return bcLeads.filter(x=>(bcLeadStatus==='All'||x.status===bcLeadStatus)&&(!q||[x.name,x.contact,x.email,x.phone,x.rep,x.source].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>a.name.localeCompare(b.name))}
function bcLeadTable(){const rows=bcLeadRows();return '<p class="notice">Showing '+rows.length+' of '+bcLeads.length+' leads</p><div class="tablewrap"><table><thead><tr><th>Company / Lead</th><th>Contact</th><th>Email</th><th>Status</th><th>Representative</th><th>Follow-up</th><th>Est. Value</th><th>Actions</th></tr></thead><tbody>'+(rows.length?rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.contact)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.rep)+'</td><td>'+esc(x.follow)+'</td><td>'+esc(x.value)+'</td><td><button class="btn secondary" onclick="bcOpenLead(\''+esc(x.id)+'\')">Edit</button> '+(x.converted?'<span class="notice">Converted: '+esc(x.converted)+'</span>':'<button class="btn" onclick="bcConvertLead(\''+esc(x.id)+'\')">Convert to Client</button>')+'</td></tr>').join(''):'<tr><td colspan="8">No leads match these filters.</td></tr>')+'</tbody></table></div>'}
function bcLeadsView(){return '<div class="heading"><div><h2>Leads</h2><p>Live MNTR+ Database lead pipeline</p></div><div class="actions"><button class="btn secondary" onclick="bcLoadLeads()">↻ Refresh</button><button class="btn" onclick="bcOpenLead()">+ New Lead</button></div></div>'+(bcLeadsError?'<div class="alert">'+esc(bcLeadsError)+'</div>':'')+(bcLeadsLoading?'<p class="notice">Loading leads…</p>':'')+'<section class="panel"><div class="formgrid"><label class="wide">Search leads<input type="search" placeholder="Company, contact, email, representative…" value="'+esc(bcLeadSearch)+'" oninput="bcLeadSearch=this.value;bcLeadRefreshRows()"></label><label>Lead Status<select onchange="bcLeadStatus=this.value;bcLeadRefreshRows()">'+['All',...bcLeadStatuses].map(x=>'<option '+(bcLeadStatus===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label></div><div id="bcLeadTable">'+bcLeadTable()+'</div></section>'}
function bcLeadRefreshRows(){const el=document.getElementById('bcLeadTable');if(el)el.innerHTML=bcLeadTable()}
function bcOpenLead(id){
 const x=id?bcLeads.find(l=>l.id===String(id)):null;if(id&&!x)return alert('Lead not found. Refresh and try again.');
 const fields=[['name','Company / Lead Name','text'],['contact','Contact Name','text'],['email','Email','email'],['phone','Phone','tel'],['source','Lead Source','text'],['type','Customer Type','text'],['rep','Assigned Representative','text'],['follow','Next Follow-Up','date'],['value','Estimated Value','number']];
 const inputs=fields.map(([k,label,type])=>'<label>'+label+'<input name="'+k+'" type="'+type+'" '+(k==='name'?'required ':'')+(k==='value'?'min="0" step="0.01" ':'')+'value="'+esc(x?.[k]||'')+'"></label>').join('');
 document.getElementById('modal').innerHTML='<h3>'+(x?'Edit Lead':'New Lead')+'</h3><p class="notice">Lead records are saved to the live MNTR+ Database.</p><form id="bcLeadForm"><div class="formgrid">'+inputs+'<label>Lead Status<select name="status">'+bcLeadStatuses.map(v=>'<option '+((x?.status||'New')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="wide">Notes<textarea name="notes" rows="3">'+esc(x?.notes||'')+'</textarea></label></div><p id="bcLeadFormError" class="notice"></p><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">'+(x?'Save Lead Changes':'Create Lead in Database')+'</button></div></form>';
 document.getElementById('bcLeadForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]'),msg=document.getElementById('bcLeadFormError');btn.disabled=true;msg.textContent='Saving lead…';try{const v=Object.fromEntries(new FormData(e.target));await bcCall(x?'leads_update':'leads_create',x?{id:x.id,...v}:v);closeModal();await bcLoadLeads()}catch(err){msg.textContent='Unable to save: '+err.message}finally{btn.disabled=false}};
 document.getElementById('modalbg').classList.add('show');
}
const bcOriginalRender=render;
render=function(){bcOriginalRender();if(page==='leads'&&bcSession)document.getElementById('view').innerHTML=bcLeadsView()};
const bcOriginalNavigate=navigate;
navigate=function(p){bcOriginalNavigate(p);if(p==='leads'&&bcSession)bcLoadLeads()};
if(bcSession&&page==='leads')bcLoadLeads();
</script>

<script>
/* Blueprint Collective — Live Sales Pipeline */
navs.find(n=>n[0]==='deals')[2]='Sales Pipeline';
let bcSales=[],bcSalesLoading=false,bcSalesError='',bcSalesSelected=null,bcSalesQuotes=[],bcJobs=[];
const bcStages=['Inquiry','Qualifying','Preparing Quote','Quote Sent','Negotiation','Won','Lost'];
const bcQuoteStatuses=['Draft','Sent','Under Review','Revision Requested','Approved','Declined'];
const bcSalesMoney=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n||0));
const bcSalesDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
async function bcLoadSales(){
 if(!bcSession)return;
 bcSalesLoading=true;bcSalesError='';render();
 try{const r=await bcCall('sales_list');bcSales=r.items||[]}
 catch(e){bcSalesError=e.message}
 finally{bcSalesLoading=false;render()}
}
function bcSalesView(){
 if(bcSalesSelected){const o=bcSales.find(x=>x.id===bcSalesSelected);if(!o){bcSalesSelected=null;return bcSalesView()}return bcSalesDetail(o)}
 const open=bcSales.filter(x=>!['Won','Lost'].includes(x.stage)),value=open.reduce((n,x)=>n+Number(x.estimated_value||0),0);
 return `<div class="heading"><div><h2>Sales Pipeline</h2><p>Track opportunities, customer quotes, revisions and follow-ups.</p></div><div class="actions"><button class="btn secondary" onclick="bcLoadSales()">↻ Refresh</button><button class="btn" onclick="bcSalesEdit()">+ New Opportunity</button></div></div>
 ${bcSalesError?'<div class="alert">'+esc(bcSalesError)+'</div>':''}
 <div class="cards"><div class="card"><div class="label">Open Opportunities</div><div class="value">${open.length}</div></div><div class="card"><div class="label">Potential Revenue</div><div class="value">${bcSalesMoney(value)}</div></div><div class="card"><div class="label">Quotes Sent</div><div class="value">${bcSales.filter(x=>x.stage==='Quote Sent').length}</div></div><div class="card"><div class="label">Won Opportunities</div><div class="value">${bcSales.filter(x=>x.stage==='Won').length}</div></div></div>
 <section class="panel"><h3>Opportunities</h3>${bcSalesLoading?'<p>Loading…</p>':''}<div class="tablewrap"><table><thead><tr><th>Opportunity</th><th>Client</th><th>Stage</th><th>Value</th><th>Follow-Up</th><th></th></tr></thead><tbody>${bcSales.length?bcSales.map(o=>`<tr><td><b>${esc(o.title)}</b></td><td>${esc(o.client_name||'—')}</td><td>${esc(o.stage)}</td><td>${bcSalesMoney(o.estimated_value)}</td><td>${bcSalesDate(o.next_follow_up)}</td><td><button class="btn secondary" onclick="bcSalesOpen('${o.id}')">View</button></td></tr>`).join(''):'<tr><td colspan="6">No opportunities yet. Create the first one to get started.</td></tr>'}</tbody></table></div></section>`;
}
function bcSalesDetail(o){
 const quotes=bcSalesQuotes;
 return `<div class="heading"><div><button class="btn secondary" onclick="bcSalesSelected=null;render()">← All Opportunities</button><h2 style="margin-top:14px">${esc(o.title)}</h2><p>${esc(o.client_name||'Unassigned client')} · ${esc(o.representative||'No representative')}</p></div><div class="actions"><button class="btn secondary" onclick="bcSalesEdit('${o.id}')">Edit Opportunity</button><button class="btn" onclick="bcConvertToJob('${o.id}')" ${!quotes.some(q=>q.status==='Approved')?'disabled title="Approve a quote first"':''}>Convert to Job</button></div></div>
 <div class="cards"><div class="card"><div class="label">Opportunity Value</div><div class="value">${bcSalesMoney(o.estimated_value)}</div></div><div class="card"><div class="label">Current Stage</div><div class="value" style="font-size:22px">${esc(o.stage)}</div></div><div class="card"><div class="label">Expected Close</div><div class="value" style="font-size:22px">${bcSalesDate(o.expected_close)}</div></div><div class="card"><div class="label">Quote Versions</div><div class="value">${quotes.length}</div></div></div>
 <section class="panel" style="margin-bottom:20px"><h3>Sales Progress</h3><div style="display:flex;gap:5px;flex-wrap:wrap">${bcStages.map(x=>`<span style="padding:10px;border-radius:6px;background:${o.stage===x?'#244f84':'#e9edf3'};color:${o.stage===x?'white':'#263a55'};font-size:12px">${esc(x)}</span>`).join('')}</div><p class="notice">Next follow-up: ${bcSalesDate(o.next_follow_up)}</p></section>
 <div class="twocol"><section class="panel"><div class="heading"><div><h3>Documents & Quotes</h3><p>Secure document history and revisions</p></div><button class="btn" onclick="bcSalesUpload()">+ Upload Quote</button></div>
 ${quotes.length?quotes.map(q=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #e4eaf1"><div><b>${esc(q.file_name)}</b><div class="notice">Version ${q.version_number} · ${bcSalesMoney(q.quoted_amount)} · ${bcSalesDate(q.date_sent)} · ${esc(q.status)}</div></div><div class="actions"><button class="btn secondary" onclick="bcSalesDownload('${q.id}')">Open</button>${q.status!=='Approved'&&o.stage!=='Won'?`<button class="btn" onclick="bcApproveQuote('${q.id}')">Approve</button>`:''}</div></div>`).join(''):'<p class="notice">No quotes uploaded yet.</p>'}
 </section><section class="panel"><h3>Opportunity Information</h3><div class="formgrid"><div><div class="notice">Client</div><b>${esc(o.client_name||'—')}</b></div><div><div class="notice">Contact</div><b>${esc(o.contact_name||'—')}</b></div><div><div class="notice">Representative</div><b>${esc(o.representative||'—')}</b></div><div><div class="notice">Source</div><b>${esc(o.source||'—')}</b></div><div><div class="notice">Next Follow-Up</div><b>${bcSalesDate(o.next_follow_up)}</b></div><div><div class="notice">Stage</div><b>${esc(o.stage)}</b></div></div><h3>Notes</h3><p>${esc(o.notes||'No notes yet.')}</p></section></div>`;
}
async function bcSalesOpen(id){bcSalesSelected=id;bcSalesQuotes=[];render();try{const r=await bcCall('sales_quotes',{opportunityId:id});bcSalesQuotes=r.items||[];render()}catch(e){alert('Unable to load quotes: '+e.message)}}
function bcSalesEdit(id){
 const o=id?bcSales.find(x=>x.id===id):null;
 const f=(name,label,type='text')=>`<label>${label}<input name="${name}" type="${type}" ${name==='title'?'required':''} ${type==='number'?'min="0" step="0.01"':''} value="${esc(o?.[name]||'')}"></label>`;
 const clientOptions='<option value="">No linked client</option>'+bcClients.filter(c=>!c.inactive).map(c=>`<option value="${esc(c.id)}" ${o?.client_item_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 document.getElementById('modal').innerHTML=`<h3>${o?'Edit':'New'} Opportunity</h3><form id="bcSalesForm"><div class="formgrid">${f('title','Opportunity Name')}<label>Linked Client<select name="client_item_id" id="bcSalesClient">${clientOptions}</select></label><label>Client Contact<select name="contact_name" id="bcSalesContact"><option value="">Select a linked client first</option></select></label>${f('representative','Assigned Representative')}${f('source','Lead Source')}${f('estimated_value','Estimated Value','number')}${f('expected_close','Expected Close Date','date')}${f('next_follow_up','Next Follow-Up','date')}<label>Sales Stage<select name="stage">${bcStages.map(v=>`<option ${o?.stage===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="wide">Notes<textarea name="notes" rows="3">${esc(o?.notes||'')}</textarea></label></div><p id="bcSalesMsg" class="notice"></p><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save Opportunity</button></div></form>`;
 const form=document.getElementById('bcSalesForm');
 const clientSelect=form.elements.client_item_id,contactSelect=form.elements.contact_name;
 const populateClient=()=>{
   const client=bcClients.find(c=>String(c.id)===String(clientSelect.value));
   const matches=client?bcContacts.filter(c=>String(c.clientId)===String(client.id)||Boolean(client.clientNumber&&c.clientNumber===client.clientNumber)):[];
   contactSelect.innerHTML='<option value="">'+(client?'Select contact (optional)':'Select a linked client first')+'</option>'+matches.map(c=>'<option value="'+esc(c.name)+'">'+esc(c.name)+(c.primary?' — Primary':'')+'</option>').join('');
   const preferred=matches.find(c=>c.primary)||matches[0];
   if(preferred)contactSelect.value=preferred.name;
   if(client){
     const notice=document.getElementById('bcSalesMsg');
     notice.textContent='Linked to '+client.name+(client.clientNumber?' ('+client.clientNumber+')':'')+(preferred?' · Contact: '+preferred.name:' · No saved contacts found');
   }else document.getElementById('bcSalesMsg').textContent='';
 };
 clientSelect.addEventListener('change',populateClient);
 populateClient();
 if(o?.contact_name){
   if(!Array.from(contactSelect.options).some(x=>x.value===o.contact_name))contactSelect.add(new Option(o.contact_name,o.contact_name));
   contactSelect.value=o.contact_name;
 }
 document.getElementById('bcSalesForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]'),msg=document.getElementById('bcSalesMsg');btn.disabled=true;msg.textContent='Saving…';try{const v=Object.fromEntries(new FormData(e.target));const client=bcClients.find(c=>c.id===v.client_item_id);v.client_name=client?.name||'';v.client_number=client?.clientNumber||'';if(o)v.id=o.id;const r=await bcCall('sales_save',v);closeModal();await bcLoadSales();if(o)bcSalesSelected=o.id;else bcSalesSelected=r.item.id;await bcSalesOpen(bcSalesSelected);if(v.stage==='Quote Sent')bcSalesUpload()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};
 document.getElementById('modalbg').classList.add('show');
}
function bcSalesUpload(){
 if(!bcSalesSelected)return;
 document.getElementById('modal').innerHTML=`<h3>Upload Quote</h3><p class="notice">Files are stored privately and linked to this opportunity. Maximum 15 MB.</p><form id="bcQuoteForm"><div class="formgrid"><label class="wide">Quote File<input type="file" name="file" accept=".pdf,.doc,.docx,.xls,.xlsx" required></label><label>Quote Amount ($)<input name="quoted_amount" type="number" min="0" step="0.01" required></label><label>Quote Status<select name="status">${bcQuoteStatuses.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Date Sent<input name="date_sent" type="date"></label><label class="wide">Revision Notes<textarea name="notes" rows="3"></textarea></label></div><p class="notice" id="bcQuoteMsg"></p><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Upload Quote</button></div></form>`;

async function bcJobOpen(id){

function bcJobStatusSelect(j){

}
async function bcJobQuickStatus(jobId,select){
  const job=bcJobs.find(j=>String(j.id)===String(jobId));
  if(!job||!select||select.value===job.job_status)return;
  const previous=job.job_status,next=select.value;
  select.disabled=true;
  try{
    // The job_update endpoint expects the complete editable job configuration,
    // just as the working Edit Job Details form supplies it.
    const fields=['job_type','priority','assigned_to','start_date','due_date','description','internal_notes'];
    const values=Object.fromEntries(fields.map(key=>[key,job[key]??'']));
    // Edit Job Details defaults these two select fields when missing.
    if(!values.job_type||!bcJobTypes.includes(values.job_type))values.job_type=bcJobTypes[0];
    if(!values.priority||!bcJobPriorities.includes(values.priority))values.priority=bcJobPriorities[1];
    await bcCall('job_update',{jobId,job_status:next,...values});
    job.job_status=next;
    await bcLoadJobs();
  }catch(error){
    job.job_status=previous;
    select.value=previous;
    alert('Unable to update job status: '+error.message);
    render();
  }finally{select.disabled=false}
}

const BC_EMPLOYEE_FN=BC_URL+'/functions/v1/blueprint-employee';
async function bcEmployeeCall(action,extra={}){
 if(!bcSession?.access_token)throw Error('Please sign in again.');
 if(bcSession.expires_at&&Date.now()/1000>bcSession.expires_at-60){if(!await bcRefreshSession())throw Error('Session expired. Please sign in again.');}
 const r=await fetch(BC_EMPLOYEE_FN,{method:'POST',headers:bcAuthHeaders(bcSession.access_token),body:JSON.stringify({action,...extra})});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(data.error||'Employee invitation failed');
 return data;
}
async function bcInviteEmployee(id){
 const x=bcStaff.find(v=>v.id===id);
 if(!x||!x.active||!x.email)return;
 const resend=!!x.user_id;
 if(!confirm(`${resend?'Resend a secure password-setup email':'Send an employee login invitation'} to ${x.display_name} at ${x.email}?`))return;
 const btn=document.getElementById('bcInviteBtn_'+id),msg=document.getElementById('bcJobMsg');
 if(btn)btn.disabled=true;
 if(msg)msg.textContent='Sending invitation…';
 try{
  await bcEmployeeCall(resend?'resend_invite':'invite',{staffId:id});
  const result=await bcCall('staff_list');bcStaff=result.items||[];
  bcStaffDirectory();
  const notice=document.getElementById('bcJobMsg');if(notice)notice.textContent=(resend?'A new secure password-setup email was requested for ':'Invitation sent to ')+x.email+'. Check the inbox and spam folder.';
 }catch(e){if(msg)msg.textContent='Unable to send invitation: '+e.message;if(btn)btn.disabled=false;}
}

   try{
    await bcEmployeeCall('invite',{staffId:person.id});

    alert('Employee saved. A secure sign-in invitation was sent to '+email+'.');
   }catch(err){
    alert('Employee saved, but the invitation could not be sent: '+err.message+'\n\nOpen Team Directory and use Send Invitation to retry.');
   }
  }
 });

/* Conversation history: groups received and sent correspondence by correspondent and normalized subject.
   This is a subject-based view; RFC Message-ID threading can be added separately. */
let bcConversationSelected='';
function bcConversationSubject(subject){return String(subject||'(No subject)').replace(/^(?:(?:re|fw|fwd)\s*:\s*)+/ig,'').trim().toLowerCase()||'(no subject)';}
function bcConversationGroups(){
 const messages=[];
 for(const m of bcInboxVisibleMessages())messages.push({kind:'received',id:m.id,when:m.received_at,other:bcClientEmailAddress(m.sender),subject:m.subject||'',message:m});
 for(const m of bcSentMessages){
  if(bcInboxClientFilter){const c=bcClients.find(x=>String(x.id)===bcInboxClientFilter);if(!c||!(String(m.client_link_id||'')===String(c.id)||bcClientEmailAddress(m.recipient)===bcClientEmailAddress(c.email)))continue;}
  messages.push({kind:'sent',id:m.id,when:m.sent_at||m.created_at,other:bcClientEmailAddress(m.recipient),subject:m.subject||'',message:m});
 }
 const groups=new Map();
 for(const m of messages){const key=m.other+'|'+bcConversationSubject(m.subject);if(!groups.has(key))groups.set(key,{key,other:m.other,subject:m.subject||'(No subject)',messages:[]});groups.get(key).messages.push(m);}
 return [...groups.values()].map(g=>({...g,messages:g.messages.sort((a,b)=>Date.parse(a.when)-Date.parse(b.when)),latest:Math.max(...g.messages.map(m=>Date.parse(m.when)||0))})).sort((a,b)=>b.latest-a.latest);
}
function bcConversationOpen(key){bcConversationSelected=key;render();}
function bcConversationLayout(){
 const groups=bcConversationGroups();const selected=groups.find(g=>g.key===bcConversationSelected)||groups[0];
 const entries=selected?selected.messages.map(m=>{
  const received=m.kind==='received';const body=received?bcEmailBody(m.message):m.message.body_text;
  const meta=received?'From: '+m.message.sender:'To: '+m.message.recipient;
  return `<article style="border:1px solid #dce4ee;border-radius:9px;padding:14px;margin-bottom:12px;background:#fff"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${received?'Received':'Sent'}</b><span style="font-size:12px;color:#60758d">${bcInboxEscape(new Date(m.when).toLocaleString())}</span></div><p style="font-size:12px;margin:8px 0">${bcInboxEscape(meta)}</p><div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55">${bcInboxEscape(body||'No message text available.')}</div>${received?`<p><button class="btn secondary" onclick="bcReplyIncoming('${bcInboxEscape(m.id)}')">Reply</button></p>`:''}</article>`;
 }).join(''):'';
 return `<p class="muted">Correspondence grouped by contact and subject. Messages with changed subjects may appear in separate conversations.</p>${bcInboxFilterNotice()}<div style="display:grid;grid-template-columns:minmax(210px,35%) minmax(0,65%);gap:14px;align-items:start"><div style="max-height:65vh;overflow:auto;border:1px solid #dce4ee;border-radius:8px">${groups.map(g=>`<button type="button" onclick="bcConversationOpen('${bcInboxEscape(g.key)}')" style="display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid #e5ebf1;background:${selected?.key===g.key?'#e9f1fa':'white'};cursor:pointer;color:#18283e"><strong>${bcInboxEscape(g.subject)}</strong><div style="font-size:12px;overflow-wrap:anywhere">${bcInboxEscape(g.other)}</div><div style="font-size:11px;color:#60758d">${g.messages.length} message(s) · ${bcInboxEscape(new Date(g.latest).toLocaleDateString())}</div></button>`).join('')||'<p style="padding:14px">No conversations yet.</p>'}</div><div style="min-width:0">${selected?`<h3>${bcInboxEscape(selected.subject)}</h3><p class="muted">${bcInboxEscape(selected.other)}</p>${entries}`:'<p>Select a conversation.</p>'}</div></div>`;
}
const bcMailSwitchBeforeConversations=bcMailSwitch;
bcMailSwitch=function(tab){if(tab==='conversations'){bcMailTab=tab;bcSendFeedback='';render();bcLoadSent();return;}bcMailSwitchBeforeConversations(tab);};

   Matching uses the client's primary email address; ambiguous addresses are not assigned. */

/* Secure manual client assignment for incoming email.
   The linked client ID is an external client reference (text), not a Supabase UUID.
   Unlink restores normal address matching; original messages remain unchanged. */
let bcEmailLinkBusy=false,bcEmailLinkFeedback='';
async function bcSetEmailClientLink(messageId,clientId){
 if(bcEmailLinkBusy)return;
 const m=bcInboxMessages.find(x=>String(x.id)===String(messageId));
 if(!m)return;
 if(clientId && !bcClients.some(c=>String(c.id)===String(clientId))){bcEmailLinkFeedback='Select a valid client.';render();return;}
 bcEmailLinkBusy=true;bcEmailLinkFeedback='';render();
 try{
  if(bcSession.expires_at&&Date.now()/1000>bcSession.expires_at-60)await bcRefreshSession();
  const response=await fetch(BC_URL+'/functions/v1/blueprint-email-inbox',{
   method:'POST',headers:bcAuthHeaders(bcSession.access_token),
   body:JSON.stringify({action:'link',messageId:String(messageId),clientId:clientId||null})
  });
  const result=await response.json();
  if(!response.ok)throw Error(result.error||'Unable to update client link');
  m.linked_client_external_id=result.message.linked_client_external_id;
  bcEmailLinkFeedback=clientId?'Email linked to client.':'Manual link removed. Automatic email matching still applies.';
 }catch(e){bcEmailLinkFeedback=e.message||String(e);}
 finally{bcEmailLinkBusy=false;render();}
}
const bcInboxDetailBeforeLink=bcInboxDetail;
bcInboxDetail=function(m){

 if(!m)return html;

 const matched=bcEmailClientMatch(m);
 const choices=[...bcClients].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
 const opts=choices.map(c=>'<option value="'+bcInboxEscape(String(c.id))+'" '+(assigned===String(c.id)?'selected':'')+'>'+bcInboxEscape(c.name||'Client')+' ('+bcInboxEscape(c.clientNumber||String(c.id))+')</option>').join('');
 const form='<div style="padding:12px;margin:12px 0;border:1px solid #dce4ee;border-radius:8px">'+
  '<label style="display:block;font-weight:600;margin-bottom:6px">Link this incoming email to a client</label>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
  '<select id="bcEmailClientSelect" style="min-width:220px;max-width:100%;padding:8px;flex:1" '+(bcEmailLinkBusy?'disabled':'')+'>'+
  '<option value="">Not Assigned to a Client</option>'+opts+'</select>'+
  '<button class="btn secondary" '+(bcEmailLinkBusy?'disabled':'')+' onclick="bcSetEmailClientLink('+JSON.stringify(String(m.id))+',document.getElementById(\'bcEmailClientSelect\').value)">'+(bcEmailLinkBusy?'Saving…':'Save Link')+'</button>'+
  (assigned?'<button class="btn secondary" '+(bcEmailLinkBusy?'disabled':'')+' onclick="bcSetEmailClientLink('+JSON.stringify(String(m.id))+',null)">Unlink</button>':'')+'</div>'+
  '<p class="muted" style="margin-top:8px">'+(assigned?'Manually linked: '+bcInboxEscape(matched?.name||'Client not found'):'Automatic match: '+bcInboxEscape(matched?.name||'None'))+'</p>'+
  (bcEmailLinkFeedback?'<p class="notice">'+bcInboxEscape(bcEmailLinkFeedback)+'</p>':'')+'</div>';
 return html.replace('<hr>',form+'<hr>');
};

 '<p class="muted">'+list.length+' job(s)'+(client?' for '+esc(client.name):'')+' · Jobs are managed in Blueprint Collective.</p></section>'+
 (bcJobsError?'<div class="alert">'+esc(bcJobsError)+'</div>':'')+form+
 '<section class="panel bc-jobs-list-panel"><h3>'+(bcJobsArchiveTab==='completed'?'Completed & Archived Jobs':'Active Jobs')+'</h3><div class="bc-jobs-card-list">'+(bcJobsBusy?'<p class="muted">Loading jobs…</p>':rows||'<p class="muted">No jobs match this view. Select + New Job to create one.</p>')+'</div></section>';
}
const bcRenderBeforeJobs=render;
render=function(){bcRenderBeforeJobs();if(page==='jobs'){const view=document.getElementById('view');if(view)view.innerHTML=bcSession?bcJobsPage():'<section class="panel"><h2>Jobs & Projects</h2><p>Connecting to your selected Blueprint Collective workspace…</p></section>';}};
const bcNavigateBeforeJobs=navigate;
navigate=function(p){bcNavigateBeforeJobs(p);if(p==='jobs'&&!bcJobsLoaded&&!bcJobsBusy&&bcSession)bcCoreLoadJobs();};
const bcClientRowsBeforeJobs=bcClientRows;
bcClientRows=function(items){const html=bcClientRowsBeforeJobs(items);return html.replace(/(<button class="btn secondary" onclick="bcOpenClientHistory\('([^']+)'\)">History<\/button>)/g,(_,button,id)=>button+' <button class="btn secondary" onclick="bcCoreOpenJobs(\''+id+'\')">Jobs</button>');};

</script>

<script>
/* Blueprint Collective job detail workspace. All changes originate here. */
let bcDetailJobId='',bcDetailData=null,bcDetailBusy=false,bcDetailError='';
const bcJobPageBeforeDetails=bcJobsPage;
bcJobsPage=function(){
 const base=bcJobPageBeforeDetails();
 if(!bcDetailJobId)return base.replace('</tbody></table>', '</tbody></table>');
 const j=bcCoreJobs.find(x=>x.id===bcDetailJobId);
 if(!j)return base;
 const h=esc;
 const details=bcDetailBusy?'<p>Loading job details…</p>':bcDetailError?'<p class="notice">'+h(bcDetailError)+'</p>':!bcDetailData?'<p>Open the job to view its records.</p>':
 '<div style="display:grid;gap:16px">'+
 '<div><h3>Job Notes</h3><form onsubmit="bcDetailAddNote(event)"><textarea name="body" rows="3" maxlength="10000" required placeholder="Add an internal job note" style="width:100%;padding:10px"></textarea><button class="btn" type="submit">Save Note</button></form>'+
 (bcDetailData.notes.length?bcDetailData.notes.map(n=>'<div style="padding:12px;border-bottom:1px solid #ddd"><small>'+h(new Date(n.created_at).toLocaleString())+'</small><p style="white-space:pre-wrap">'+h(n.body)+'</p></div>').join(''):'<p class="muted">No notes yet.</p>')+'</div>'+
 '<details class="bc-collapse-section"><summary><span>Job Documents</span><span class="bc-collapse-meta">'+bcDetailData.documents.length+' file(s)</span></summary><div class="bc-collapse-content"><div class="bc-documents"><p class="muted">Keep quotes, proofs, invoices, and approvals organized with this job.</p><form class="bc-upload-form" onsubmit="bcDetailUpload(event)"><div class="bc-upload-top"><label for="bcDocumentCategory">Document Type</label><select id="bcDocumentCategory" name="category"><option>Quote</option><option>Proof</option><option>Invoice</option><option>Approval</option><option>Other</option></select></div><div class="bc-upload-drop" id="bcUploadDrop" ondragover="bcDetailDragOver(event)" ondragleave="bcDetailDragLeave(event)" ondrop="bcDetailDrop(event)"><input type="file" name="file" id="bcUploadFile" required onchange="bcDetailFileChanged(this)"><label for="bcUploadFile" class="bc-upload-pick"><span class="bc-upload-icon">↑</span><strong>Choose a file or drag it here</strong><span>PDFs, images and other documents · Up to 15 MB</span><span class="bc-upload-browse">Browse files</span></label></div><div id="bcUploadSelected" class="bc-upload-selected" aria-live="polite">No file selected</div><div class="bc-upload-actions"><span id="bcUploadProgress" class="muted" role="status">Files are stored securely with this job.</span><button class="btn" type="submit">Upload Document</button></div></form>'+
 (bcDetailData.documents.length?'<div class="tablewrap"><table><thead><tr><th>Document</th><th>Category</th><th>Added</th><th></th></tr></thead><tbody>'+bcDetailData.documents.map(d=>'<tr><td>'+h(d.filename)+'</td><td>'+h(d.category)+'</td><td>'+h(new Date(d.created_at).toLocaleDateString())+'</td><td><button class="btn secondary" onclick="bcDetailDownload(\''+h(d.id)+'\')">Download</button> <button class="btn secondary" onclick="bcDetailView(\''+h(d.id)+'\')">View</button></td></tr>').join('')+'</tbody></table></div>' :'<p class="muted">No documents yet.</p>')+'</div></div></details>'+
 '<p class="muted"></div>';
 return base+'<section class="panel" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>Job Details</h2><p>'+h(j.job_number)+' · '+h(j.title)+' · '+h(j.client_name)+'</p></div><button class="btn secondary" onclick="bcDetailClose()">Close Details</button></div>'+details+'</section>';
};
const bcJobsRenderBeforeDetails=render;
render=function(){
 bcJobsRenderBeforeDetails();
 if(page==='jobs'){
 const table=document.querySelector('#view table tbody');
 if(table){
 for(const row of table.rows){
  const edit=row.querySelector('button[onclick^="bcCoreJobEdit"]');
  if(!edit)continue;
  const id=edit.getAttribute('onclick').match(/'([^']+)'/)?.[1];
  if(!id||row.querySelector('.bc-detail-open'))continue;
  const button=document.createElement('button');
  button.type='button';button.className='btn secondary bc-detail-open';button.textContent='Details';
  button.onclick=()=>bcDetailOpen(id);
  edit.parentElement.insertBefore(button,edit);
 }
 }
 }
};
async function bcDetailOpen(id){
 bcMarkJobApprovalSeen(id);
 bcDetailJobId=id;bcDetailBusy=true;bcDetailError='';bcDetailData=null;render();
 await bcDetailReload();
}
// Supabase is the authority for approval transitions; the browser must never
// independently change a job status based on only the most recent approval.
function bcSyncApprovalJobStatus(detail){
 const job=detail?.job;
 if(!job)return detail;
 const cached=bcCoreJobs.find(x=>String(x.id)===String(job.id||bcDetailJobId));
 if(cached)Object.assign(cached,job);
 return detail;
}
async function bcDetailReload(){
 const requestedId=bcDetailJobId;
 if(!requestedId)return;
 try{
  const r=await bcJobsRequest({action:'details',id:requestedId});
  if(requestedId!==bcDetailJobId)return;
  bcDetailData=r;bcDetailError='';
  bcSyncApprovalJobStatus(r);
  // Refresh the table from the same backend after approval-related actions.
  // Avoid a second full-page render while the list is being fetched.
  const list=await bcJobsRequest({action:'list'});
  if(requestedId!==bcDetailJobId)return;
  bcCoreJobs=list.jobs||[];
  bcJobsLoaded=true;
  await bcJobsPoll();
 }catch(e){if(requestedId===bcDetailJobId)bcDetailError=e.message||String(e);}
 finally{if(requestedId===bcDetailJobId){bcDetailBusy=false;render();}}
}
// Client approvals happen outside this page. Keep the list and the opened
// job synchronized while this tab is visible, without disrupting editing.
let bcJobsAutoRefreshBusy=false;
async function bcJobsAutoRefresh(){
 if(bcJobsAutoRefreshBusy||page!=='jobs'||document.hidden||!bcSession?.access_token||
    bcJobsBusy||bcJobFormOpen||bcJobEditing||bcDetailBusy)return;
 const active=document.activeElement;
 if(active&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName)&&active.closest('#view'))return;
 bcJobsAutoRefreshBusy=true;
 try{
  const list=await bcJobsRequest({action:'list'});
  if(page!=='jobs'||document.hidden)return;
  const fresh=list.jobs||[];
  const changed=JSON.stringify(fresh.map(j=>[j.id,j.status,j.sync_status,j.updated_at]))!==
    JSON.stringify(bcCoreJobs.map(j=>[j.id,j.status,j.sync_status,j.updated_at]));
  bcCoreJobs=fresh;bcJobsLoaded=true;
  if(changed)await bcJobsPoll();
  if(bcDetailJobId){
   const id=bcDetailJobId;
   const detail=await bcJobsRequest({action:'details',id});
   if(id!==bcDetailJobId||page!=='jobs')return;
   const detailChanged=JSON.stringify([detail.job?.status,detail.approvals?.map(a=>[a.id,a.status,a.revision_status])])!==
     JSON.stringify([bcDetailData?.job?.status,bcDetailData?.approvals?.map(a=>[a.id,a.status,a.revision_status])]);
   if(detailChanged){bcDetailData=detail;bcSyncApprovalJobStatus(detail);render();}
   else if(changed)render();
  }else if(changed)render();
 }catch(e){console.warn('Jobs background refresh:',e.message);}
 finally{bcJobsAutoRefreshBusy=false;}
}
setInterval(bcJobsAutoRefresh,12000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bcJobsAutoRefresh();});
function bcDetailClose(){bcDetailJobId='';bcDetailData=null;render()}
async function bcDetailAddNote(e){
 e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;
 try{await bcJobsRequest({action:'addNote',id:bcDetailJobId,body:f.elements.body.value});await bcDetailReload();}
 catch(err){alert('Unable to save note: '+err.message);b.disabled=false;}
}
function bcDetailFileChanged(input){
 const file=input.files&&input.files[0],label=document.getElementById('bcUploadSelected');
 if(!label)return;
 label.textContent=file?'Selected: '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)':'No file selected';
 label.classList.toggle('has-file',!!file);
}
function bcDetailDragOver(event){event.preventDefault();event.dataTransfer.dropEffect='copy';document.getElementById('bcUploadDrop')?.classList.add('dragging')}
function bcDetailDragLeave(event){if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('dragging')}
function bcDetailDrop(event){
 event.preventDefault();event.currentTarget.classList.remove('dragging');
 const file=event.dataTransfer.files?.[0],input=document.getElementById('bcUploadFile');
 if(!file||!input)return;
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;bcDetailFileChanged(input);
}
async function bcDetailUpload(e){
 e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),file=f.elements.file.files[0];
 if(!file)return;if(file.size>15*1024*1024){alert('Maximum file size is 15 MB');return;}
 b.disabled=true;
 const progress=document.getElementById('bcUploadProgress');if(progress)progress.textContent='Preparing your file…';
 try{
 const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)});
 if(progress)progress.textContent='Uploading securely…';
 await bcJobsRequest({action:'uploadDocument',id:bcDetailJobId,filename:file.name,category:f.elements.category.value,contentType:file.type||'application/octet-stream',base64});
 await bcDetailReload();
 }catch(err){if(progress)progress.textContent='Upload unsuccessful. Please try again.';alert('Upload failed: '+err.message);b.disabled=false;}
}

async function bcDetailView(documentId){
 try{
  const doc=bcDetailData?.documents?.find(d=>d.id===documentId);
  if(!doc)throw Error('Document not found');
  const r=await bcJobsRequest({action:'downloadDocument',id:bcDetailJobId,documentId});
  const type=(doc.content_type||'').toLowerCase();
  const safeName=String(doc.filename||'Document').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isImage=type.startsWith('image/') && !type.includes('svg');
  const isPdf=type==='application/pdf'||doc.filename.toLowerCase().endsWith('.pdf');
  if(!isImage&&!isPdf){window.open(r.url,'_blank','noopener,noreferrer');return}
  let modal=document.getElementById('bcDocumentViewer');
  if(modal)modal.remove();
  modal=document.createElement('div');modal.id='bcDocumentViewer';modal.className='bc-doc-viewer';
  modal.innerHTML='<div class="bc-doc-viewer-panel" role="dialog" aria-modal="true" aria-label="Document preview"><div class="bc-doc-viewer-header"><strong>'+safeName+'</strong><div><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="'+r.url+'">Open in New Tab</a> <button class="btn secondary" type="button" onclick="bcDetailCloseView()">Close</button></div></div><div class="bc-doc-viewer-body"></div></div>';
  modal.addEventListener('click',e=>{if(e.target===modal)bcDetailCloseView()});
  const body=modal.querySelector('.bc-doc-viewer-body');
  const preview=document.createElement(isImage?'img':'iframe');
  preview.src=r.url;
  if(!isImage)preview.title='Document preview';
  body.appendChild(preview);document.body.appendChild(modal);
 }catch(err){alert('Unable to view document: '+err.message)}
}
function bcDetailCloseView(){document.getElementById('bcDocumentViewer')?.remove()}

async function bcDetailDownload(documentId){
 try{const r=await bcJobsRequest({action:'downloadDocument',id:bcDetailJobId,documentId});window.open(r.url,'_blank','noopener,noreferrer')}
 catch(err){alert('Download failed: '+err.message)}
}
</script>

<script>
/* Blueprint Collective: internal job approvals and job correspondence */
async function bcJobUpdateProductionStatus(event){
 event.preventDefault();
 const form=event.currentTarget,button=form.querySelector('button[type=submit]');
 const status=form.elements.status.value,job=bcDetailData?.job;
 if(!job||!bcDetailJobId)return;
 if(status===job.status)return;
 if(!confirm('Change job '+(job.job_number||'')+' to '+status+'?'))return;
 button.disabled=true;
 try{
  await bcJobsRequest({action:'update',id:bcDetailJobId,status});
  await bcDetailReload();
  await bcCoreLoadJobs();
 }catch(err){alert('Unable to update production status: '+(err.message||err))}
 finally{button.disabled=false}
}

let bcJobEmailData=null,bcJobEmailBusy=false;
const bcJobPageBeforeWorkflow=bcJobsPage;
bcJobsPage=function(){
 let html=bcJobPageBeforeWorkflow();
 if(!bcDetailJobId||!bcDetailData)return html;
 const h=esc,docs=bcDetailData.documents||[],approvals=bcDetailData.approvals||[],events=bcDetailData.approvalEvents||[];
 const fileName=id=>docs.find(d=>d.id===id)?.filename||'Document';
 const approvalRows=approvals.map(a=>{
 const status=h(a.status),pending=a.status==='Pending Approval';
 const actions=pending?'<button class="btn secondary" onclick="bcJobReview(\''+a.id+'\',\'Approved\')">Approve</button> <button class="btn secondary" onclick="bcJobReview(\''+a.id+'\',\'Changes Requested\')">Request Changes</button> <button class="btn" onclick="bcJobClientLink(\''+a.id+'\',true)">Send Approval Request</button> <button class="btn secondary" onclick="bcJobClientLink(\''+a.id+'\')">Client Approval Link</button> <button class="btn secondary" onclick="bcJobRevokeClientLink(\''+a.id+'\')">Revoke Links</button>':'';
 return '<div class="bc-workflow-record"><div><strong>'+h(fileName(a.document_id))+'</strong><div class="muted">'+status+' · '+new Date(a.requested_at).toLocaleString()+'</div>'+(a.review_note?'<p>'+h(a.review_note)+'</p>':'')+'</div><div>'+actions+'</div></div>';
 }).join('');
 const revisionRequests=approvals.filter(a=>a.status==='Changes Requested'&&a.revision_status==='Needs Revision');
 const revisionHtml=revisionRequests.length?'<div class="bc-revisions"><h4>Revisions Required ('+revisionRequests.length+')</h4><p class="muted">Upload the corrected document above, then resubmit it for approval.</p>'+revisionRequests.map(a=>'<div class="bc-revision-task"><div><strong>'+h(fileName(a.document_id))+'</strong><p><strong>Changes requested:</strong> '+h(a.review_note||'See approval notes')+'</p><span class="bc-revision-status">Needs Revision</span></div><form data-approval-id="'+h(a.id)+'" onsubmit="bcJobSubmitRevision(event,this.dataset.approvalId)"><label>Updated document<select name="documentId" required><option value="">Select newly uploaded file</option>'+docs.filter(d=>d.id!==a.document_id).map(d=>'<option value="'+h(d.id)+'">'+h(d.filename)+'</option>').join('')+'</select></label><label>Revision notes<input name="note" placeholder="What was updated?"></label><button class="btn" type="submit">Resubmit for Approval</button></form></div>').join('')+'</div>':'';
 const approvalHistory=events.length?'<details><summary>Approval history ('+events.length+')</summary>'+events.map(e=>'<div class="bc-workflow-event"><strong>'+h(e.event_type)+'</strong> · '+h(new Date(e.created_at).toLocaleString())+(e.note?' — '+h(e.note):'')+'</div>').join('')+'</details>':'';
 const eligibleDocs=docs.filter(d=>!approvals.some(a=>a.document_id===d.id));
 const docOptions=eligibleDocs.map(d=>'<option value="'+h(d.id)+'">'+h(d.filename)+' ('+h(d.category)+')</option>').join('');
 const recentApproved=approvals.filter(a=>a.status==='Approved').sort((a,b)=>new Date(b.reviewed_at)-new Date(a.reviewed_at))[0];
 const approvalNotice=recentApproved?'<div style="padding:8px 12px;margin:8px 0;border:1px solid #a7dec3;background:#effbf4;border-radius:7px;color:#146c43"><strong>✓ Client Approved: '+h(fileName(recentApproved.document_id))+'</strong><span style="font-size:12px;margin-left:8px">Approved '+h(new Date(recentApproved.reviewed_at).toLocaleString())+'</div></div>':'';
 const approvalHtml='<details class="bc-collapse-section"><summary><span>Document Approvals</span><span class="bc-collapse-meta">'+approvals.length+' request(s)</span></summary><div class="bc-collapse-content"><p class="muted">Submit an uploaded document for an internal approval decision. Every decision is recorded.</p>'+
 (eligibleDocs.length?'<form onsubmit="bcJobRequestApproval(event)" class="bc-workflow-form"><label>Document to review<select name="documentId" required>'+docOptions+'</select></label><button class="btn" type="submit">Request Approval</button></form>':'<p class="muted">No documents awaiting approval. Upload a new document to request approval.</p>')+
 revisionHtml+(approvalRows||'<p class="muted">No approval requests yet.</p>')+approvalHistory+'</div></details>';
 let emailsHtml='';
 if(bcJobEmailBusy)emailsHtml='<p>Loading correspondence…</p>';
 else if(!bcJobEmailData){
  const saved=bcDetailData.linkedEmails||[];
  const rows=saved.map(e=>'<div class="bc-workflow-record"><div><strong>'+h(e.subject||'(No subject)')+'</strong><div class="muted">'+h(e.direction==='incoming'?'Received':'Sent')+' · '+h(e.sender||'')+' → '+h(e.recipient||'')+' · '+h(e.when?new Date(e.when).toLocaleString():'')+'</div></div><div class="bc-mail-buttons"><button class="btn secondary" onclick="bcJobViewEmail(\''+e.id+'\',\''+e.direction+'\')">Read Email</button><button class="btn secondary" onclick="bcJobEmailLink(\''+e.id+'\',\''+e.direction+'\',false)">Unlink</button></div></div>').join('');
  emailsHtml=(rows||'<p class="muted">No emails linked to this job yet.</p>')+'<button class="btn secondary" onclick="bcJobLoadEmails()">Browse & Link More Emails</button>';
 }
 else{
  const links=bcDetailData.emailLinks||[];
  const combined=[...(bcJobEmailData.incoming||[]).map(e=>({...e,direction:'incoming',when:e.received_at})),...(bcJobEmailData.outgoing||[]).map(e=>({...e,direction:'outgoing',when:e.sent_at||e.created_at}))].sort((a,b)=>new Date(b.when)-new Date(a.when));
  const available=combined.filter(e=>!bcJobEmailData.links.some(l=>l.email_id===e.id&&l.job_id!==bcDetailJobId&&l.direction===e.direction));
  const linked=available.filter(e=>links.some(l=>l.email_id===e.id&&l.direction===e.direction));
  const unlinked=available.filter(e=>!links.some(l=>l.email_id===e.id&&l.direction===e.direction));
  const formatEmail=e=>'<strong>'+h(e.subject||'(No subject)')+'</strong><div class="muted">'+h(e.direction==='incoming'?'Received':'Sent')+' · '+h(e.sender||'')+' → '+h(e.recipient||'')+' · '+h(e.when?new Date(e.when).toLocaleString():'')+'</div>';
  const linkedRows=linked.map(e=>'<div class="bc-workflow-record"><div>'+formatEmail(e)+'</div><div class="bc-mail-buttons"><button class="btn secondary" onclick="bcJobViewEmail(\''+e.id+'\',\''+e.direction+'\')">Read Email</button><button class="btn secondary" onclick="bcJobEmailLink(\''+e.id+'\',\''+e.direction+'\',false)">Unlink</button></div></div>').join('');
  const options=unlinked.map(e=>'<option value="'+h(e.direction+':'+e.id)+'">'+h((e.direction==='incoming'?'IN':'OUT')+' · '+(e.subject||'(No subject)')+' · '+(e.sender||''))+'</option>').join('');
  emailsHtml='<div class="bc-workflow-form"><label>Find existing CRM correspondence<select id="bcJobEmailChoice">'+(options||'<option value="">No unlinked emails available</option>')+'</select></label><button class="btn" type="button" onclick="bcJobAttachSelectedEmail()" '+(!options?'disabled':'')+'>Link to Job</button><button class="btn secondary" type="button" onclick="bcJobLoadEmails()">Refresh</button></div>'+(linkedRows||'<p class="muted">No emails linked to this job yet.</p>')+'<p class="muted">Shows the latest 100 incoming and 100 outgoing emails. Emails already linked to other jobs are excluded.</p>';
 }
 const emailHtml='<details class="bc-collapse-section"><summary><span>Email Correspondence</span><span class="bc-collapse-meta">'+(bcDetailData.linkedEmails||[]).length+' linked</span></summary><div class="bc-collapse-content"><p class="muted">Link existing client emails to this job. Original messages remain in the CRM inbox and sent mail.</p>'+emailsHtml+'</div></details>';
 /* Place the most recent actionable approval state immediately under the job heading. */
 const latestDecision=approvals.filter(a=>['Approved','Changes Requested','Pending'].includes(a.status)).sort((a,b)=>new Date(b.reviewed_at||b.requested_at||0)-new Date(a.reviewed_at||a.requested_at||0))[0];
 let topApproval='';
 if(latestDecision){
  const state=latestDecision.status;
  const theme=state==='Approved'?['#effbf4','#a7dec3','#146c43']:state==='Changes Requested'?['#fff7e6','#f1cd86','#855600']:['#f3f6fa','#d8e1ed','#40526a'];
  const label=state==='Approved'?'✓ Client Approved':state==='Changes Requested'?'Changes Requested':'Approval Pending';
  const stamp=latestDecision.reviewed_at||latestDecision.requested_at;
  topApproval='<div style="display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 11px;margin:8px 0 14px;border:1px solid '+theme[1]+';background:'+theme[0]+';color:'+theme[2]+';border-radius:7px;font-size:13px"><strong>'+label+'</strong><span>'+h(fileName(latestDecision.document_id))+'</span>'+(stamp?'<span>· '+h(new Date(stamp).toLocaleString())+'</span>':'')+'</div>';
 }
 if(topApproval){
  const headerEnd=html.indexOf('</div>',html.indexOf('<h2>Job Details</h2>'));
  if(headerEnd>=0)html=html.slice(0,headerEnd+6)+topApproval+html.slice(headerEnd+6);
 }
 const insertAt=html.lastIndexOf('</section>');
 return insertAt>=0?html.slice(0,insertAt)+approvalHtml+emailHtml+html.slice(insertAt):html+approvalHtml+emailHtml;
};

 const note=status==='Changes Requested'?prompt('What changes are needed?'):prompt('Optional approval note (leave blank if none):');

async function bcJobClientLink(approvalId,sendEmail=false){
 const email=prompt(sendEmail?'Client email address to send the approval request:':'Client email (optional; for your reference when sharing the link):','');
 if(email===null)return;
 const recipient=email.trim().toLowerCase();
 if(sendEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient)){alert('Enter a valid client email address.');return}
 if(sendEmail&&!confirm('Send a document approval request to '+recipient+'?'))return;
 try{
  const data=await bcJobsRequest({action:'createClientApprovalLink',id:bcDetailJobId,approvalId,recipientEmail:recipient});
  const url=data.url;
  if(sendEmail){
   const job=bcDetailData?.job||bcCoreJobs.find(x=>x.id===bcDetailJobId)||{};
   const approval=(bcDetailData?.approvals||[]).find(a=>a.id===approvalId);
   const doc=(bcDetailData?.documents||[]).find(d=>d.id===approval?.document_id);
   const subject='Document Approval Requested - '+(job.job_number||'Blueprint Collective');
   const body='Hello,\n\nA document is ready for your review and approval.\n\nJob: '+(job.job_number||'')+'\n'+(job.title||'')+'\nDocument: '+(doc?.filename||'Document')+'\n\nReview the document and select Approve Document or Request Changes using this secure link:\n'+url+'\n\nThis link expires in 14 days. Please do not forward it.\n\nThank you,\nBlueprint Collective';
   try{
    await bcOutgoingRequest('send',{to:recipient,subject,body});
    const original=(bcDetailData?.approvals||[]).filter(a=>a.status==='Changes Requested'&&a.revision_status==='Resubmitted'&&a.revision_document_id===approval?.document_id).sort((a,b)=>new Date(b.reviewed_at)-new Date(a.reviewed_at))[0];
    if(original){
     try{await bcJobsRequest({action:'markRevisionSent',id:bcDetailJobId,approvalId:original.id});await bcJobsPoll();await bcDetailReload()}
     catch(markError){alert('Email sent, but the change-request notification could not be cleared automatically: '+markError.message);return}
    }
    alert('Approval request emailed successfully to '+recipient+'.');
   }catch(sendError){
    bcShowClientApprovalLink(url,'Email could not be sent: '+sendError.message+'. Copy the link to send manually.');
   }
   return;
  }
  bcShowClientApprovalLink(url,'Share this secure link with your client. It expires after 14 days. Anyone with the link can review and respond, so send it privately.');
 }catch(e){alert('Unable to create client approval request: '+e.message)}
}

 document.body.appendChild(modal);document.getElementById('bc-client-link-url').value=url;document.getElementById('bc-client-link-message').textContent=message;
}

async function bcJobViewEmail(emailId,direction){
 const currentJob=bcDetailJobId;
 let modal=document.getElementById('bc-job-mail-viewer');
 if(modal)modal.remove();
 modal=document.createElement('div');
 modal.id='bc-job-mail-viewer';modal.className='bc-doc-viewer';
 modal.innerHTML='<div class="bc-doc-viewer-panel bc-mail-view-panel" role="dialog" aria-modal="true" aria-label="Email message"><div class="bc-doc-viewer-header"><strong>Job Correspondence</strong><div><button class="btn secondary" type="button" onclick="bcJobCloseEmail()">Close</button></div></div><div class="bc-mail-view-content">Loading message…</div></div>';
 modal.addEventListener('click',e=>{if(e.target===modal)bcJobCloseEmail()});
 document.body.appendChild(modal);
 try{
  const result=await bcJobsRequest({action:'emailDetail',id:currentJob,emailId,direction});
  if(!document.getElementById('bc-job-mail-viewer')||bcDetailJobId!==currentJob)return;
  const m=result.message||{};
  const body=direction==='incoming'?bcEmailBody(m):(m.body_text||'No message content available.');
  const content=modal.querySelector('.bc-mail-view-content');
  content.innerHTML='<h3>'+esc(m.subject||'(No subject)')+'</h3><div class="bc-mail-meta"><div><strong>From:</strong> '+esc(m.sender||'')+'</div><div><strong>To:</strong> '+esc(m.recipient||'')+'</div><div><strong>Date:</strong> '+esc(m.received_at||m.sent_at||m.created_at?new Date(m.received_at||m.sent_at||m.created_at).toLocaleString():'')+'</div><div><strong>Type:</strong> '+(direction==='incoming'?'Received':'Sent')+'</div></div><pre class="bc-mail-body"></pre>';
  content.querySelector('.bc-mail-body').textContent=body;
 }catch(err){const content=modal.querySelector('.bc-mail-view-content');if(content)content.textContent='Unable to load email: '+err.message}
}
