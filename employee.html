<script>
/* Production workspace. Stage progress is derived from persisted Supabase records
   by organization, pending the production database/API integration. */
(function(){
const defaults=['Artwork & Design','Materials & Ordering','Production','Quality Control','Delivery & Fulfillment'];
let bcProdWorkloadEmployee='all',bcProdQueueTab='active',selectedJob='',bcProdStages=[],bcProdEntries=[],bcProdEmployees=[],bcProdFulfillments=[],bcProdLoading=false,bcProdError='';
const org=()=>String(window.bcSelectedOrganizationId||window.bcOrganizationId||window.bcCurrentOrganizationId||'default');
const stages=()=>bcProdStages.map(x=>x.name);
const progress=()=>{
 const byJob={};
 for(const r of bcProdEntries){const i=bcProdStages.findIndex(s=>s.id===r.stage_id);if(i<0)continue;(byJob[r.job_id]??={})[i]={status:r.status,assignee:r.assigned_to||'',employeeId:r.employee_id||'',target:r.target_date||'',completed:r.completed_date||'',notes:r.notes||''};}
 return byJob;
};
async function bcProdLoad(){
 if(bcProdLoading)return;
 bcProdLoading=true;bcProdError='';
 try{
  let data=await bcJobsRequest({action:'productionLoad'});
  if(!data.stages?.length){await bcJobsRequest({action:'productionSeed'});data=await bcJobsRequest({action:'productionLoad'});}
  bcProdStages=data.stages||[];bcProdEntries=data.entries||[];bcProdEmployees=data.employees||[];bcProdFulfillments=data.fulfillments||[];
 }catch(err){bcProdError=String(err?.message||err);}
 finally{bcProdLoading=false;if(page==='production'||page==='production-settings')render();}
}
window.bcProductionTasks=()=>bcProdEntries.filter(r=>r.employee_id).map(r=>({
 id:r.id,job_id:r.job_id,stage_id:r.stage_id,employee_id:r.employee_id,
 assigned_to:bcProdEmployees.find(x=>x.id===r.employee_id)?.full_name||r.assigned_to||'',
 stage:bcProdStages.find(x=>x.id===r.stage_id)?.name||'Production stage',
 job:bcCoreJobs.find(x=>String(x.id)===String(r.job_id)),
 status:r.status||'Not Started',due_date:r.target_date||''
}));
window.bcProductionTaskRefresh=async()=>{await bcCoreLoadJobs();await bcProdLoad();if(page==='tasks')render()};
window.bcProductionTaskStatus=async(jobId,stageId,status)=>{
 const j=bcCoreJobs.find(x=>String(x.id)===String(jobId));
 const stage=bcProdStages.find(x=>x.id===stageId);
 if(!j||!stage)return alert('Production assignment not found. Refresh and try again.');
 const old=bcProdEntries.find(x=>x.job_id===jobId&&x.stage_id===stageId);
 try{
  await bcJobsRequest({action:'productionSaveEntry',id:jobId,stageId,status,employeeId:old?.employee_id||'',assignedTo:old?.assigned_to||'',targetDate:old?.target_date||null,completedDate:status==='Completed'?(old?.completed_date||new Date().toISOString().slice(0,10)):null,notes:old?.notes||''});
  await bcCoreLoadJobs();await bcProdLoad();render();
 }catch(err){alert('Unable to update production task: '+String(err.message||err));await bcProdLoad();render()}
};
window.bcProductionOpenJob=id=>{selectedJob=String(id);navigate('production')};
const e=s=>esc(s);
const statusNames=['Not Started','In Progress','Completed','On Hold'];
const activeJobs=()=>bcCoreJobs.filter(j=>['Ready for Production','In Production','Completed','Closed'].includes(j.status));
function summary(){
 const jobs=activeJobs();
 return '<div class="bc-prod-cards">'+[
  ['Ready for Production',jobs.filter(j=>j.status==='Ready for Production').length],
  ['In Production',jobs.filter(j=>j.status==='In Production').length],
  ['Completed',jobs.filter(j=>j.status==='Completed').length],
  ['Closed',jobs.filter(j=>j.status==='Closed').length]
 ].map(([name,n])=>'<div class="bc-prod-card"><div class="muted">'+name+'</div><div class="bc-prod-num">'+n+'</div></div>').join('')+'</div>';
}
function workloadPage(){
 const jobs=activeJobs(), byJob=progress(), employees=bcProdEmployees;
 const rows=[];
 for(const job of jobs){
  const rec=byJob[String(job.id)]||{};
  bcProdStages.forEach((stage,i)=>{
   const r=rec[i]||{};
   if(!r.employeeId)return;
   const person=employees.find(p=>p.id===r.employeeId);
   rows.push({job,stage,index:i,person,name:person?.full_name||r.assignee||'Unknown employee',status:r.status||'Not Started',target:r.target||'',employeeId:r.employeeId});
  });
 }
 const selected=bcProdWorkloadEmployee;
 const filtered=rows.filter(r=>selected==='all'||r.employeeId===selected);
 const active=filtered.filter(r=>r.status!=='Completed');
 const today=new Date().toISOString().slice(0,10);
 const overdue=active.filter(r=>r.target&&r.target<today);
 const opts='<option value="all">All employees</option>'+employees.map(p=>'<option value="'+e(p.id)+'" '+(selected===p.id?'selected':'')+'>'+e(p.full_name)+(p.active?'':' (Inactive)')+'</option>').join('');
 return '<section class="bc-prod-panel" style="margin:18px 0"><div class="bc-prod-head"><div><h3>Employee Workload</h3><p class="muted">Assignments from your Staff Directory, linked to production stages.</p></div><div><label for="bc-workload-filter">Employee</label><select id="bc-workload-filter" onchange="bcProdWorkloadFilter(this.value)">'+opts+'</select></div></div>'+
 '<div class="bc-prod-cards">'+[['Assigned stages',filtered.length],['Active assignments',active.length],['In progress',active.filter(r=>r.status==='In Progress').length],['Overdue',overdue.length]].map(([label,value])=>'<div class="bc-prod-card"><div class="muted">'+label+'</div><div class="bc-prod-num">'+value+'</div></div>').join('')+'</div>'+

function bcGuessCarrier(raw){
 const n=String(raw||'').trim().replace(/[\s-]/g,'').toUpperCase();
 if(!n)return {name:'Enter a tracking number',url:''};
 if(/^1Z[A-Z0-9]{16}$/.test(n))return {name:'UPS',url:'https://www.ups.com/track?tracknum='+encodeURIComponent(n)};
 if(/^(94|93|92|95|96)\d{18,20}$/.test(n)||/^(70|71|72|73|74|75|76|77|78|79)\d{18,20}$/.test(n))return {name:'USPS (likely)',url:'https://tools.usps.com/go/TrackConfirmAction?tLabels='+encodeURIComponent(n)};
 if(/^\d{12}$/.test(n)||/^\d{15}$/.test(n)||/^\d{20}$/.test(n))return {name:'Carrier uncertain',url:''};
 return {name:'Carrier unknown — verify tracking number',url:''};
}

<script>
/* Production assignment alerts: employee-scoped, persistent until acknowledged or completed. */
let bcProductionAlerts=[];
async function bcLoadProductionAlerts(){
 const staff=(typeof bcStaff!=='undefined'?bcStaff:[]).find(x=>x.user_id===bcSession?.user?.id&&x.active);
 if(!staff){bcProductionAlerts=[];return}
 try{
  const r=await bcJobsRequest({action:'productionNotifications',staffId:staff.id});
  bcProductionAlerts=r.items||[];
 }catch(e){console.warn('Production alerts:',e)}
 bcRenderProductionAlertDots();
}
function bcRenderProductionAlertDots(){
 document.querySelectorAll('[data-bc-production-dot]').forEach(x=>x.remove());
 if(!bcProductionAlerts.length)return;
 for(const el of document.querySelectorAll('button,a')){
  if(el.closest('table'))continue;
  if(el.textContent.trim().includes('Tasks & Activities')&&el.textContent.length<90){
   const dot=document.createElement('span');
   dot.dataset.bcProductionDot='1';dot.textContent=' ●';dot.style.color='#d82e38';dot.title=bcProductionAlerts.length+' production assignment(s) need attention';
   el.appendChild(dot);
  }
 }
}

 catch(e){alert('Unable to acknowledge: '+e.message)}
}

 (bcProductionAlerts.length?bcProductionAlerts.map(n=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ddd"><div><strong>'+esc(n.title)+'</strong><small style="display:block">'+esc(n.message)+'</small></div><button class="btn secondary" onclick="bcAcknowledgeProductionAlert(&quot;'+n.id+'&quot;)">Acknowledge</button></div>').join(''):'<p class="notice">No production assignments requiring acknowledgement.</p>')+'</section>';

<script>
/* Blueprint Collective live operations dashboard. Uses existing authenticated CRM data. */
(function(){
 let loading=false,loadedAt=0,error='';
 const safe=v=>esc(String(v==null?'':v));
 const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
 const isOpen=t=>t.status!=='Completed'&&t.status!=='Cancelled';
 async function load(force=false){
  if(!bcSession||loading)return;
  if(!force&&Date.now()-loadedAt<60000)return;
  loading=true;error='';if(page==='dashboard')render();
  const results=await Promise.allSettled([bcCoreLoadJobs(),bcCall('job_tasks_all'),bcJobsRequest({action:'notificationStatus'})]);
  if(results[1].status==='fulfilled'){bcAllTasks=results[1].value.items||[];bcTaskJobs=results[1].value.jobs||[];}
  if(results[2].status==='fulfilled'){bcUnresolvedJobIds=(results[2].value.unresolvedJobs||[]).map(String);}
  if(results.some(r=>r.status==='rejected'))error='Some dashboard information could not be refreshed. Use Refresh to try again.';
  loadedAt=Date.now();loading=false;if(page==='dashboard')render();
 }
 window.bcDashboardRefresh=()=>load(true);
 const oldNavigate=navigate;
 navigate=function(p){oldNavigate(p);if(p==='dashboard')load()};
 const oldDashboard=dashboard;
 dashboard=function(){
  if(!bcSession)return '<section class="panel"><h2>Dashboard</h2><p class="muted">Sign in to see your workspace.</p></section>';
  const jobs=Array.isArray(bcCoreJobs)?bcCoreJobs:[],tasks=Array.isArray(bcAllTasks)?bcAllTasks:[];
  const active=jobs.filter(j=>!['Completed','Closed'].includes(j.status));
  const completed=jobs.filter(j=>['Completed','Closed'].includes(j.status));
  const prod=jobs.filter(j=>j.status==='In Production');
  const waiting=jobs.filter(j=>j.status==='Awaiting Approval');
  const overdue=tasks.filter(t=>isOpen(t)&&t.due_date&&t.due_date<today());
  const openTasks=tasks.filter(isOpen);
  const attention=new Set([...(bcUnresolvedJobIds||[]),...(bcUnreadApprovedJobIds||[])].map(String));
  const cards=[['Active Jobs',active.length,'jobs'],['In Production',prod.length,'production'],['Pending Approval',waiting.length,'jobs'],['Open Tasks',openTasks.length,'tasks'],['Overdue Tasks',overdue.length,'tasks'],['Completed Jobs',completed.length,'jobs']];
  const cardHtml=cards.map(([name,count,target])=>'<button class="card" style="text-align:left;cursor:pointer" onclick="navigate(\''+target+'\')"><div class="label">'+name+'</div><div class="value">'+count+'</div><div class="foot">View '+(target==='production'?'production':target==='tasks'?'tasks':'jobs')+' →</div></button>').join('');

<script>
/* Group incoming replies in the existing Email Center; no extra page or panel. */
function bcMailThreadSubject(subject){
 return String(subject||'(No subject)').replace(/^\s*((re|fw|fwd)\s*:\s*)+/ig,'').trim().toLowerCase();
}
function bcMailThreadKey(m){
 const sender=bcClientEmailAddress(m.sender||'').toLowerCase();
 return bcMailThreadSubject(m.subject)+'|'+sender;
}
function bcMailBuildThreads(messages){
 const groups=new Map();
 for(const m of messages){
  const key=bcMailThreadKey(m);
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(m);
 }
 return [...groups.values()].map(items=>{
  items.sort((a,b)=>new Date(a.received_at)-new Date(b.received_at));
  return {items,latest:items[items.length-1]};
 }).sort((a,b)=>new Date(b.latest.received_at)-new Date(a.latest.received_at));
}
const bcMailPreviousDetail=bcInboxDetail;
bcInboxDetail=function(m){
 if(!m)return bcMailPreviousDetail(m);
 const key=bcMailThreadKey(m);
 const items=bcInboxMessages.filter(x=>bcMailThreadKey(x)===key)
  .sort((a,b)=>new Date(a.received_at)-new Date(b.received_at));
 if(items.length<2)return bcMailPreviousDetail(m);
 const history=items.map((x,i)=>'<details '+(x.id===m.id?'open':'')+' style="border-bottom:1px solid #e3e9f0;padding:10px 0"><summary style="cursor:pointer"><strong>'+bcInboxEscape(x.sender)+'</strong> <span class="muted">'+bcInboxEscape(new Date(x.received_at).toLocaleString())+'</span></summary><p style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto">'+bcInboxEscape(bcEmailBody(x))+'</p></details>').join('');
 return '<div style="margin-bottom:12px"><strong>'+items.length+' messages in this conversation</strong><p class="muted">Incoming messages grouped by sender and subject.</p>'+history+'</div>'+bcMailPreviousDetail(m);
};
</script>

<script>
/* Unified incoming/outgoing timeline inside the existing conversation reader. */
function bcMailSentForIncoming(m){
 const subject=bcMailThreadSubject(m.subject);
 const address=bcClientEmailAddress(m.sender||'').toLowerCase();
 return bcSentMessages.filter(x=>bcMailThreadSubject(x.subject)===subject &&
   bcClientEmailAddress(x.recipient||'').toLowerCase()===address);
}
function bcMailUnifiedTimeline(m){
 const key=bcMailThreadKey(m);
 const incoming=bcInboxMessages.filter(x=>bcMailThreadKey(x)===key)
   .map(x=>({kind:'incoming',date:x.received_at,id:x.id,from:x.sender,to:x.recipient,body:bcEmailBody(x)}));
 const outgoing=bcMailSentForIncoming(m)
   .map(x=>({kind:'sent',date:x.created_at,id:x.id,from:x.sender,to:x.recipient,body:x.body_text||''}));
 return [...incoming,...outgoing].sort((a,b)=>new Date(a.date)-new Date(b.date));
}
const bcMailUnifiedOldDetail=bcInboxDetail;
bcInboxDetail=function(m){
 if(!m)return bcMailUnifiedOldDetail(m);
 const timeline=bcMailUnifiedTimeline(m);
 const cards=timeline.map(x=>'<div style="border-bottom:1px solid #e3e9f0;padding:12px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>'+(x.kind==='sent'?'↗ Sent':'↙ Received')+'</strong><span class="muted">'+bcInboxEscape(new Date(x.date).toLocaleString())+'</span></div><div style="font-size:12px;margin-top:5px"><b>From:</b> '+bcInboxEscape(x.from)+'<br><b>To:</b> '+bcInboxEscape(x.to)+'</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+bcInboxEscape(x.body)+'</p></div>').join('');
 const original=bcMailUnifiedOldDetail(m);
 return '<h3>'+bcInboxEscape(m.subject||'(No subject)')+'</h3><p class="muted">'+timeline.length+' messages · '+timeline.filter(x=>x.kind==='sent').length+' sent · '+timeline.filter(x=>x.kind==='incoming').length+' received</p>'+cards+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn" onclick="bcReplyIncoming(\''+bcInboxEscape(m.id)+'\')">Reply</button><button class="btn secondary" onclick="bcMailReplyAll(\''+bcInboxEscape(m.id)+'\')">Reply All</button></div>'+
 '<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Job association &amp; message details</summary><div style="padding-top:12px">'+original+'</div></details>';
};
const bcMailUnifiedPriorLoad=bcLoadInbox;
bcLoadInbox=async function(){await Promise.all([bcMailUnifiedPriorLoad(),bcLoadSent()])};
const bcMailUnifiedPriorSend=bcSendCompose;
bcSendCompose=async function(ev){await bcMailUnifiedPriorSend(ev);if(bcMailTab==='inbox')await bcLoadSent()};

<script>
/* Step 3: Email attachments. MIME parts are decoded in-browser, not exposed as public URLs. */
let bcComposeAttachments=[];
const bcAttachmentOldOpenCompose=bcOpenCompose;
bcOpenCompose=function(...args){bcComposeAttachments=[];return bcAttachmentOldOpenCompose(...args)};
const bcAttachmentOldSwitch=bcMailSwitch;
bcMailSwitch=function(tab){if(tab!=='compose')bcComposeAttachments=[];return bcAttachmentOldSwitch(tab)};
function bcAttachmentReadFiles(input){
 const files=[...(input.files||[])];input.value='';
 if(files.length+bcComposeAttachments.length>5){alert('Maximum 5 attachments.');return}
 for(const file of files){
  if(file.size>5*1024*1024){alert(file.name+' exceeds the 5 MB per-file limit.');return}
  if(!/^[\w .()\-]+$/.test(file.name)||file.name.length>150){alert('Rename the file using letters, numbers, spaces, periods, underscores or hyphens.');return}
 }
 if(files.reduce((n,f)=>n+f.size,0)+bcComposeAttachments.reduce((n,f)=>n+f.size,0)>7.5*1024*1024){alert('Combined attachments cannot exceed 7.5 MB.');return}
 bcComposeAttachments.push(...files);render();
}
function bcAttachmentRemove(i){bcComposeAttachments.splice(i,1);render()}
const bcAttachmentOldComposeLayout=bcOutgoingComposeLayout;
bcOutgoingComposeLayout=function(){
 let html=bcAttachmentOldComposeLayout();
 const widget='<div style="margin:12px 0"><label style="display:block;font-weight:600;margin-bottom:6px">Attachments (up to 5 files, 5 MB each)</label><input type="file" multiple onchange="bcAttachmentReadFiles(this)" aria-label="Attach files"><div style="margin-top:8px">'+bcComposeAttachments.map((f,i)=>'<div style="margin:5px 0">'+bcInboxEscape(f.name)+' ('+(f.size/1024).toFixed(0)+' KB) <button class="btn secondary" type="button" onclick="bcAttachmentRemove('+i+')">Remove</button></div>').join('')+'</div></div>';
 return html.replace('<div class="actions"><button class="btn" type="submit"',widget+'<div class="actions"><button class="btn" type="submit"');
};
function bcAttachmentBase64(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
  reader.onerror=()=>reject(Error('Could not read '+file.name));
  reader.readAsDataURL(file);
 });
}
bcSendCompose=async function(ev){
 ev.preventDefault();if(bcSendBusy)return;
 bcSendBusy=true;bcSendFeedback='';render();
 try{
  const attachments=await Promise.all(bcComposeAttachments.map(async f=>({filename:f.name,content:await bcAttachmentBase64(f)})));
  await bcOutgoingRequest('send',{to:bcComposeTo,subject:bcComposeSubject,body:bcComposeBody,clientId:bcComposeClientId,attachments});
  bcComposeAttachments=[];bcComposeOpen=false;bcComposeTo='';bcComposeSubject='';bcComposeBody='';bcComposeClientId=null;
  bcMailTab='sent';bcSendFeedback='Email submitted successfully'+(attachments.length?' with '+attachments.length+' attachment(s)':'')+'.';
  await bcLoadSent();
 }catch(e){bcSendFeedback=e.message||String(e)}
 finally{bcSendBusy=false;if(page==='email')render()}
};
function bcMimeAttachments(m){
 const raw=bcMimeText(m.raw_mime_base64);
 if(!raw)return [];
 const boundary=(raw.match(/boundary\s*=\s*(?:"([^"]+)"|([^;\s\r\n]+))/i)||[]);
 if(!boundary[1]&&!boundary[2])return [];
 const parts=raw.split('--'+(boundary[1]||boundary[2]));
 const found=[];
 for(const part of parts){
  const sep=part.search(/\r?\n\r?\n/);if(sep<0)continue;
  const head=part.slice(0,sep);
  const disposition=(head.match(/^Content-Disposition:\s*([^\r\n]+)/im)||[])[1]||'';
  const name=(disposition.match(/filename\s*=\s*"([^"]+)"/i)||disposition.match(/filename\s*=\s*([^;\s]+)/i)||[])[1];
  if(!name||!/attachment/i.test(disposition))continue;
  const transfer=(head.match(/^Content-Transfer-Encoding:\s*([^\r\n]+)/im)||[])[1]||'';
  if(!/base64/i.test(transfer))continue;
  const content=part.slice(sep).replace(/^\r?\n\r?\n/,'').replace(/--\s*$/,'').replace(/[^A-Za-z0-9+/=]/g,'');
  if(content.length>14*1024*1024)continue;
  found.push({name,content,type:(head.match(/^Content-Type:\s*([^;\r\n]+)/im)||[])[1]||'application/octet-stream'});
 }
 return found;
}
function bcAttachmentDownload(messageId,index){
 const m=bcInboxMessages.find(x=>String(x.id)===String(messageId));if(!m)return;
 const a=bcMimeAttachments(m)[index];if(!a)return;
 try{
  const bytes=Uint8Array.from(atob(a.content),c=>c.charCodeAt(0));
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
  const link=document.createElement('a');link.href=url;link.download=a.name.replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){alert('Could not decode attachment.')}
}
const bcAttachmentOldTimeline=bcMailUnifiedTimeline;
bcMailUnifiedTimeline=function(m){
 const timeline=bcAttachmentOldTimeline(m);
 for(const x of timeline){
  if(x.kind==='incoming'){const mail=bcInboxMessages.find(y=>String(y.id)===String(x.id));x.attachments=mail?bcMimeAttachments(mail):[]}
  else{const mail=bcSentMessages.find(y=>String(y.id)===String(x.id));x.attachments=(mail?.attachment_names||[]).map(name=>({name}))}
 }
 return timeline;
};

 if(!groups)return html;

<script>

 const latest=bcInboxMessages.filter(x=>bcMailThreadKey(x)===key).reduce((a,x)=>!a||new Date(x.received_at)>new Date(a)?x.received_at:a,null);
 const reopened=state.last_handled_at&&latest&&new Date(latest)>new Date(state.last_handled_at);
 return {key,status:reopened?'Open':(state.status||'Open'),assigned_to:state.assigned_to||'',reopened};

<script>

let bcNoticeBaseline=null,bcNoticePending=new Set(),bcNoticeLoading=false;
async function bcNoticeRefresh(){
 if(bcNoticeLoading||!bcSession?.access_token)return;
 bcNoticeLoading=true;
 try{
  const [baseline,mail,states]=await Promise.all([
   bcMailJobRequest('notificationBaseline'),
   bcMailJobRequest('list'),
   bcMailJobRequest('threadState')
  ]);
  bcNoticeBaseline=baseline.baseline_at;
  bcThreadStates=Object.fromEntries((states.states||[]).map(x=>[x.thread_key,x]));
  bcThreadStaff=states.staff||[];
  if(mail.messages)bcInboxMessages=mail.messages;
  const pending=new Set();
  for(const m of bcInboxMessages){
   const st=bcThreadCurrent(m);
   const handled=bcThreadStates[st.key]?.last_handled_at;
   if(st.status==='Open'&&new Date(m.received_at)>new Date(bcNoticeBaseline)&&(!handled||new Date(m.received_at)>new Date(handled)))pending.add(st.key);
  }
  bcNoticePending=pending;
  bcMailHasNew=pending.size>0;
  if(page==='email')render();
  else{
   const button=[...document.querySelectorAll('#nav button')].find(b=>b.textContent.includes('Email Inbox'));
   if(button){button.querySelector('.bc-new-mail-dot')?.remove();if(bcMailHasNew){const dot=document.createElement('span');dot.className='bc-new-mail-dot';dot.title='Email conversation needs attention';button.appendChild(dot)}}
  }
 }catch(e){console.warn('Email notification refresh unavailable',e)}

<script>
/* Conservative automatic association: existing explicit links win; never guess among multiple matches. */
let bcAutoAssocBusy=false,bcAutoAssocLastError='',bcAutoAssocInFlight=new Set();
function bcAutoAssocJobNumber(subject,jobs){
 const text=String(subject||'');
 const matches=jobs.filter(j=>{
  const n=String(j.job_number||'').trim();
  if(!n||n.length<4)return false;
  const escaped=n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(^|[^a-z0-9])'+escaped+'(?=$|[^a-z0-9])','i').test(text);
 });
 return matches.length===1?matches[0]:null;
}
async function bcAutoAssociateConversations(){
 if(bcAutoAssocBusy||!bcSession?.access_token||!bcInboxMessages.length)return;
 if(!bcLoaded)return;
 bcAutoAssocBusy=true;
 try{
  if(!bcJobsLoaded)await bcCoreLoadJobs();
  const byThread=new Map();
  for(const m of bcInboxMessages){const key=bcMailThreadKey(m);if(!byThread.has(key))byThread.set(key,[]);byThread.get(key).push(m)}
  for(const [key,items] of byThread){
   if(bcAutoAssocInFlight.has(key))continue;
   bcAutoAssocInFlight.add(key);
   try{
    const clientIds=[...new Set(items.map(m=>m.linked_client_external_id).filter(Boolean).map(String))];
    const sender=bcClientEmailAddress(items[0].sender);
    const matches=bcClients.filter(c=>sender&&bcClientEmailAddress(c.email)===sender);
    const client=clientIds.length===1?bcClients.find(c=>String(c.id)===clientIds[0]):clientIds.length===0&&matches.length===1?matches[0]:null;
    // Do not override a manually assigned client or resolve conflicting assignments automatically.
    if(client&&clientIds.length<=1){
     for(const m of items){
      if(m.linked_client_external_id!=null)continue;
      const result=await bcMailJobRequest('link',{messageId:String(m.id),clientId:String(client.id)});
      m.linked_client_external_id=result.message.linked_client_external_id;
     }
    }
    const existingIds=[...new Set(bcMailJobLinks.filter(l=>items.some(m=>String(m.id)===String(l.email_id))).map(l=>String(l.job_id)))];
    let job=null;
    if(existingIds.length===1)job=bcCoreJobs.find(j=>String(j.id)===existingIds[0]);
    else if(existingIds.length===0){
     const candidate=bcAutoAssocJobNumber(items[0].subject,bcCoreJobs);
     if(candidate&&client&&String(candidate.client_external_id)===String(client.id))job=candidate;
    }
    if(job&&existingIds.length<=1){
     for(const m of items){
      if(bcMailJobLinks.some(l=>String(l.email_id)===String(m.id)))continue;
      await bcMailJobRequest('linkJob',{emailId:String(m.id),jobId:String(job.id)});
      bcMailJobLinks.push({email_id:m.id,job_id:job.id});
     }
    }
   }catch(e){bcAutoAssocLastError=e.message||String(e);console.warn('Automatic correspondence association',e)}
   finally{bcAutoAssocInFlight.delete(key)}
  }
 }finally{bcAutoAssocBusy=false;if(page==='email')render()}
}
const bcAutoOldInboxDetail=bcInboxDetail;
bcInboxDetail=function(m){
 let html=bcAutoOldInboxDetail(m);
 if(!m)return html;
 const container=document.createElement('div');container.innerHTML=html;
 container.querySelectorAll('.bc-email-association-top').forEach(el=>el.remove());
 // Remove legacy manual client/job controls from message details, including hidden forms.
 container.querySelectorAll('#bcEmailClientSelect,#bcMailJobSelect').forEach(el=>{
  const form=el.closest('div[style*="border:1px solid"],div[style*="border: 1px solid"]');
  if(form)form.remove();else el.remove();
 });
 container.querySelectorAll('button').forEach(b=>{
  if(/^(Save Link|Unlink|Save Job Link|Link Conversation to (Client|Job))/i.test(b.textContent.trim()))b.remove();
 });
 const items=bcThreadIncoming(m);
 const clientIds=[...new Set(items.map(x=>x.linked_client_external_id).filter(Boolean).map(String))];
 const client=clientIds.length===1?bcClients.find(c=>String(c.id)===clientIds[0]):null;
 const links=bcMailJobLinks.filter(l=>items.some(x=>String(x.id)===String(l.email_id)));
 const jobIds=[...new Set(links.map(l=>String(l.job_id)))];
 const job=jobIds.length===1?bcCoreJobs.find(j=>String(j.id)===jobIds[0]):null;
 const summary=document.createElement('section');summary.style.cssText='border:1px solid #dce4ee;border-radius:9px;padding:12px 16px;margin:12px 0';
 summary.innerHTML='<strong>Automatic Client &amp; Job Matching</strong><p style="margin:8px 0 0">Client: <b>'+bcInboxEscape(client?.name||'Unmatched')+'</b> &nbsp;·&nbsp; Job: <b>'+bcInboxEscape(job?.job_number||job?.title||'Unmatched')+'</b></p>'+
 (job?'<button class="btn secondary" type="button" style="margin-top:9px" onclick="bcThreadOpenJob(\''+bcInboxEscape(job.id)+'\')">Open Linked Job</button>':'');
 const heading=[...container.querySelectorAll('strong')].find(el=>el.textContent.trim().toLowerCase()==='conversation assignment & status');
 if(heading?.parentElement)heading.parentElement.insertAdjacentElement('afterend',summary);
 else container.insertBefore(summary,container.firstChild);
 return container.innerHTML;
};

 const relevant=bcEmailFollowups.filter(t=>
  (bcTaskFilter==='All'||(bcTaskFilter==='Completed'?t.status==='Completed':bcTaskFilter==='To Do'?t.status==='To Do':false))&&
  (bcTaskAssignee==='all'||(bcTaskAssignee==='unassigned'?!t.assigned_user_id:String(t.assigned_user_id)===String(bcTaskAssignee))&&
  (!bcTaskQuery||[t.subject,t.sender,staffNames[t.assigned_user_id]].some(x=>String(x||'').toLowerCase().includes(bcTaskQuery.toLowerCase()))))
 );
 const rows=relevant.map(t=>{
  const pending=t.status!=='Completed';
  const threadArg=JSON.stringify(t.thread_key).replace(/"/g,'&quot;');
  return '<details class="bc-followup-item"><summary class="bc-followup-item-head">'+
   '<span class="bc-followup-item-main">'+(pending?'<span class="bc-new-mail-dot" title="Email follow-up needs attention" style="display:inline-block;position:static;vertical-align:middle;margin-right:8px"></span>':'')+
   '<strong>'+bcInboxEscape(t.subject||'(No subject)')+'</strong>'+
   '<small>'+bcInboxEscape(t.sender||'Unknown sender')+'</small></span>'+
   '<span class="bc-followup-item-status '+(pending?'bc-followup-pending':'bc-followup-complete')+'">'+bcInboxEscape(t.status)+'</span>'+
   '<span class="bc-followup-item-chevron" aria-hidden="true">⌄</span></summary>'+
   '<div class="bc-followup-item-body"><div class="bc-followup-fields">'+
   '<div><small>Assigned To</small><strong>'+bcInboxEscape(staffNames[t.assigned_user_id]||'Unassigned')+'</strong></div>'+
   '<div><small>Due Date</small><strong>Not set</strong></div>'+
   '<div><small>Priority</small><strong>Normal</strong></div>'+
   '<div><small>Status</small><strong>'+bcInboxEscape(t.status)+'</strong></div>'+
   '</div><button class="btn secondary" onclick="bcOpenFollowupConversation('+threadArg+')">Open Email</button></div></details>';
 }).join('');
 const outstanding=bcEmailFollowups.filter(t=>t.status!=='Completed').length;
 const panel='<details class="panel bc-task-panel bc-followup-collapsible" '+(outstanding?'open':'')+'>'+
 '<summary class="bc-followup-summary"><span class="bc-followup-title">Email Follow-Up Tasks</span>'+
 '<span class="bc-followup-count">'+outstanding+' outstanding · '+bcEmailFollowups.length+' total</span>'+
 '<span class="bc-followup-chevron" aria-hidden="true">⌄</span></summary>'+
 '<div class="bc-followup-content"><p class="notice">Email conversations assigned for follow-up. Open items remain visible until resolved.</p>'+
 (bcEmailFollowupError?'<p class="notice">'+bcInboxEscape(bcEmailFollowupError)+'</p>':'')+
 '<div class="bc-followup-items">'+
 (rows||'<p class="muted">No matching email follow-up tasks.</p>')+'</div></div></details>';
 return html.replace('<section class="panel bc-task-panel">',panel+'<section class="panel bc-task-panel">');
};
const bcFollowupOldThreadLoad=bcThreadLoad;
bcThreadLoad=async function(){await bcFollowupOldThreadLoad();if(page==='tasks')await bcLoadEmailFollowups()};
</script>

<script>
/* Follow-up dots stay until resolution, including after the tasks page is viewed. */
function bcEmailFollowupsPending(){return bcEmailFollowups.some(t=>t.status!=='Completed')}
const bcEmailDotOldRender=render;
render=function(){
 bcEmailDotOldRender();
 if(bcEmailFollowupsPending()||bcAllTasks.some(t=>t.status!=='Completed')){
  const nav=document.getElementById('nav');
  const button=nav&&[...nav.querySelectorAll('button')].find(b=>b.textContent.includes('Tasks & Activities'));
  if(button&&!button.querySelector('.bc-new-mail-dot')){
   const dot=document.createElement('span');
   dot.className='bc-new-mail-dot';
   dot.title='Email follow-up needs attention';
   dot.setAttribute('aria-label',dot.title);
   button.appendChild(dot);
  }
 }
};
</script>

<script>
/* Keep the Tasks navigation indicator tied to outstanding work, not page visits. */
function bcHasActionableTasks(){
 return (Array.isArray(bcAllTasks)&&bcAllTasks.some(t=>t.status!=='Completed'))||
        (Array.isArray(bcEmailFollowups)&&bcEmailFollowups.some(t=>t.status!=='Completed'));
}
const bcOriginalSidebarDot=bcSidebarDot;
bcSidebarDot=function(id,on){
 if(id==='tasks')on=bcHasActionableTasks();
 return bcOriginalSidebarDot(id,on);
};
const bcOriginalTasksMarkSeen=bcTasksMarkSeen;
bcTasksMarkSeen=function(){
 bcOriginalTasksMarkSeen();
 if(bcHasActionableTasks())bcSidebarDot('tasks',true);
};
/* Single source of truth: never retain the obsolete browser-local "new task" flag. */
const bcPersistentTaskRender=render;
render=function(){
 bcTasksHasNew=bcHasActionableTasks();
 bcPersistentTaskRender();
 bcOriginalSidebarDot('tasks',bcHasActionableTasks());
};
/* Existing local task snapshot polling must not revive a cleared notification. */
bcTasksPoll=function(){
 bcTasksHasNew=bcHasActionableTasks();
 bcOriginalSidebarDot('tasks',bcTasksHasNew);
};
</script>

<script>
/* Present existing project and production task rows as expandable records.
   Move live controls rather than cloning markup so handlers remain unchanged. */
function bcExpandTaskTables(){
 if(page!=='tasks')return;
 document.querySelectorAll('section.bc-task-panel').forEach(panel=>{
  const heading=panel.querySelector('.bc-task-toolbar h3');
  if(!heading||!['Project tasks','Production assignments'].includes(heading.textContent.trim()))return;
  const table=panel.querySelector('.bc-task-tablewrap table');
  if(!table)return;
  const rows=[...table.querySelectorAll('tbody tr')];
  const list=document.createElement('div');list.className='bc-task-expand-list';
  rows.forEach((tr,index)=>{
   const cells=[...tr.children];
   if(cells.length<5||tr.querySelector('.bc-task-empty')){
    const empty=document.createElement('p');empty.className='muted';empty.textContent=tr.textContent.trim();list.appendChild(empty);return;
   }
   const production=heading.textContent.trim()==='Production assignments';
   const item=document.createElement('details');item.className='bc-task-expand-item';
   const summary=document.createElement('summary');
   const title=document.createElement('span');title.className='bc-task-expand-heading';
   const originalTitle=cells[0].querySelector('strong');
   const originalSub=cells[0].querySelector('small');
   if(originalTitle)title.appendChild(originalTitle);
   if(originalSub)title.appendChild(originalSub);
   const state=document.createElement('span');state.className='bc-task-expand-status';
   const statusCell=cells[production?3:4];
   state.textContent=statusCell?.querySelector('select')?.value||statusCell?.textContent.trim()||'';
   const arrow=document.createElement('span');arrow.className='bc-task-expand-arrow';arrow.textContent='⌄';
   summary.append(title,state,arrow);item.appendChild(summary);
   const body=document.createElement('div');body.className='bc-task-expand-body';
   const fields=document.createElement('div');fields.className='bc-task-expand-fields';
   const entries=production?[['Assigned To',1],['Due Date',2],['Status',3]]:[['Assigned To',1],['Due Date',2],['Priority',3],['Status',4]];
   entries.forEach(([label,cellIndex])=>{
    const field=document.createElement('div');field.className='bc-task-expand-field';
    const cap=document.createElement('small');cap.textContent=label;
    const val=document.createElement('div');
    while(cells[cellIndex]?.firstChild)val.appendChild(cells[cellIndex].firstChild);
    field.append(cap,val);fields.appendChild(field);
   });
   body.appendChild(fields);
   const actions=document.createElement('div');actions.className='bc-task-expand-actions';
   const actionCell=cells[production?4:5];
   while(actionCell?.firstChild)actions.appendChild(actionCell.firstChild);
   body.appendChild(actions);item.appendChild(body);list.appendChild(item);
  });
  table.closest('.bc-task-tablewrap').replaceWith(list);
 });
}
const bcTaskDropdownRender=render;
render=function(){bcTaskDropdownRender();bcExpandTaskTables();};
</script>

<script>
/* Blueprint Collective core-job tasks (bc_jobs, not legacy sales_jobs). */
let bcCoreJobTasks=[],bcCoreTasksBusy=false,bcCoreTasksLoaded=false;
async function bcCoreTaskRefresh(){
 if(!bcSession?.access_token||bcCoreTasksBusy)return;
 bcCoreTasksBusy=true;
 try{const result=await bcJobsRequest({action:'taskList'});bcCoreJobTasks=result.tasks||[];bcCoreTasksLoaded=true;}
 catch(e){console.error('Core job task refresh failed',e);}
 finally{bcCoreTasksBusy=false;render();}
}
function bcCoreTaskStaffName(id){return bcStaff.find(x=>String(x.id)===String(id))?.display_name||'Unassigned'}
function bcCoreTaskRow(t){
 const pending=t.status!=='Completed',job=bcCoreJobs.find(j=>String(j.id)===String(t.job_id));
 return '<details class="bc-task-expand-item"><summary><span class="bc-task-expand-heading"><strong>'+
 (pending?'<span class="bc-new-mail-dot" style="display:inline-block;position:static;margin-right:8px"></span>':'')+
 esc(t.title)+'</strong><small>'+esc(job?.job_number||'Job')+' · '+esc(job?.title||'')+'</small></span>'+
 '<span class="bc-task-expand-status">'+esc(t.status)+'</span><span class="bc-task-expand-arrow">⌄</span></summary>'+
 '<div class="bc-task-expand-body"><div class="bc-task-expand-fields">'+
 '<div class="bc-task-expand-field"><small>Assigned To</small><strong>'+esc(bcCoreTaskStaffName(t.assigned_staff_id))+'</strong></div>'+
 '<div class="bc-task-expand-field"><small>Due Date</small><strong>'+esc(t.due_date||'Not set')+'</strong></div>'+
 '<div class="bc-task-expand-field"><small>Priority</small><strong>'+esc(t.priority)+'</strong></div>'+
 '<div class="bc-task-expand-field"><small>Status</small><select class="field" onchange="bcCoreTaskStatus('+JSON.stringify(t.id).replace(/"/g,'&quot;')+',this.value)">'+
 ['To Do','In Progress','Completed'].map(st=>'<option '+(t.status===st?'selected':'')+'>'+st+'</option>').join('')+'</select></div></div>'+
 (t.description?'<p>'+esc(t.description)+'</p>':'')+
 '<div class="bc-task-expand-actions"><button class="btn secondary" onclick="bcTaskNotesOpen('+JSON.stringify(t.id).replace(/"/g,'&quot;')+')">Task Notes</button> <button class="btn secondary" onclick="page=\'jobs\';bcDetailOpen('+JSON.stringify(t.job_id).replace(/"/g,'&quot;')+')">Open Job</button></div></div></details>';
}
async function bcCoreTaskStatus(id,status){
 try{await bcJobsRequest({action:'taskStatus',taskId:id,status});await bcCoreTaskRefresh();}
 catch(e){alert('Unable to update task: '+e.message);render();}
}
async function bcCoreTaskNew(jobId){
 try{const result=await bcCall("staff_list");bcStaff=result.items||[];}catch(e){alert("Unable to load employees: "+e.message);return;}
 const job=bcCoreJobs.find(j=>String(j.id)===String(jobId));if(!job)return alert('Job not found.');
 bcJobModal('<h3>Add Task</h3><p class="notice">'+esc(job.job_number)+' · '+esc(job.title)+'</p>'+
 '<form id="bcJobForm" class="bc-staff-form">'+
 '<label>Task Name<input name="title" required maxlength="200"></label>'+
 '<label class="bc-core-task-field">Description<textarea name="description" rows="3" maxlength="3000"></textarea></label>'+
 '<label>Assign Employee<select name="staffId"><option value="">Unassigned</option>'+
 bcStaff.filter(x=>x.active).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.display_name)+'</option>').join('')+'</select></label>'+
 '<label>Due Date<input name="dueDate" type="date"></label>'+
 '<label>Priority<select name="priority"><option>Normal</option><option>Low</option><option>High</option><option>Urgent</option></select></label>'+
 '<p id="bcJobMsg" class="notice"></p><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save Task</button></div></form>',async form=>{
 const fd=new FormData(form);
 await bcJobsRequest({action:'taskCreate',jobId,title:fd.get('title'),description:fd.get('description'),staffId:fd.get('staffId')||null,dueDate:fd.get('dueDate')||null,priority:fd.get('priority')});
 await bcCoreTaskRefresh();
 });
}
function bcCoreTaskEnhance(){
 if(page==='jobs'&&bcDetailJobId){
  const headings=[...document.querySelectorAll('#view h2')];
  const title=headings.find(h=>h.textContent.trim()==='Job Details');
  if(title){
   const bar=title.parentElement;
   if(bar&&!bar.querySelector('.bc-core-add-task')){
    const button=document.createElement('button');button.className='btn bc-core-add-task';button.textContent='+ Add Task';
    button.onclick=()=>bcCoreTaskNew(bcDetailJobId);
    bar.appendChild(button);
   }
   const section=title.closest('section.panel');
   if(section&&!section.querySelector('.bc-core-job-tasks')){
    const tasks=bcCoreJobTasks.filter(t=>String(t.job_id)===String(bcDetailJobId));
    const block=document.createElement('details');block.className='bc-core-job-tasks';block.open=tasks.some(t=>t.status!=='Completed');
    block.innerHTML='<summary><strong>Job Tasks</strong><span>'+tasks.length+' task(s)</span></summary><div class="bc-task-expand-list">'+
    (tasks.map(bcCoreTaskRow).join('')||'<p class="muted">No tasks added to this job yet.</p>')+'</div>';
    const notes=[...section.querySelectorAll('h3')].find(h=>h.textContent.trim()==='Job Notes');
    if(notes){const noteSection=notes.closest('section');if(noteSection)noteSection.after(block);else section.appendChild(block);}
    else section.appendChild(block);
   }
  }
 }
 if(page==='tasks'){
  const view=document.getElementById('view');
  if(view&&!view.querySelector('.bc-core-all-tasks')){
   const block=document.createElement('section');block.className='panel bc-core-all-tasks';
   const outstanding=bcCoreJobTasks.filter(t=>t.status!=='Completed').length;
   block.innerHTML='<div class="bc-task-toolbar"><div><h3>Job Tasks</h3><p class="notice">'+outstanding+' outstanding · '+bcCoreJobTasks.length+' total</p></div></div>'+
   '<div class="bc-task-expand-list">'+(bcCoreJobTasks.map(bcCoreTaskRow).join('')||'<p class="muted">No job tasks yet.</p>')+'</div>';
   const metric=view.querySelector('.bc-task-metrics');if(metric)metric.after(block);else view.prepend(block);
  }
 }
 const taskButton=document.querySelector('#nav button');
 // Preserve existing notification behavior while including new core-job tasks.
 const pending=bcCoreJobTasks.some(t=>t.status!=='Completed');
 if(pending&&page!=='tasks')bcOriginalSidebarDot('tasks',true);
}
const bcCoreTaskPriorRender=render;
render=function(){bcCoreTaskPriorRender();bcCoreTaskEnhance();};
const bcCoreTaskPriorNavigate=navigate;
navigate=function(p){bcCoreTaskPriorNavigate(p);if((p==='jobs'||p==='tasks')&&bcSession)bcCoreTaskRefresh();};
if(bcSession?.access_token)bcCoreTaskRefresh();
</script>

<script>
/* Job cards: direct access to full details and the job's linked tasks. */
async function bcOpenCoreJobDetails(id){
 await bcDetailOpen(id);
 const title=[...document.querySelectorAll('#view h2')].find(e=>e.textContent.trim()==='Job Details');
 if(title)title.scrollIntoView({behavior:'smooth',block:'start'});

function bcCoreJobInlineTasks(id){

 return '<details class="bc-job-inline-tasks"><summary><strong>Job Tasks</strong><span>'+outstanding+' outstanding · '+tasks.length+' total</span><span class="bc-job-inline-chevron">⌄</span></summary>'+
 '<div class="bc-task-expand-list">'+(tasks.map(bcCoreTaskRow).join('')||'<p class="muted">No tasks added to this job yet.</p>')+'</div></details>';

<style>
.bc-job-inline-tasks{margin-top:12px;border:1px solid #dbe3ed;border-radius:10px;background:#f9fbfe;overflow:hidden}
.bc-job-inline-tasks>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:12px}

<script>
/* Keep Job Tasks inside the full Job Details panel, with the other collapsible sections. */
function bcPlaceJobTasksInDetails(){
 if(page!=='jobs'||!bcDetailJobId)return;
 const heading=[...document.querySelectorAll('#view h2')].find(el=>el.textContent.trim()==='Job Details');
 const panel=heading?.closest('section.panel');
 if(!panel)return;
 const documents=[...panel.querySelectorAll('details.bc-collapse-section')].find(el=>el.querySelector('summary')?.textContent.includes('Job Documents'));
 const existing=document.querySelector('#view .bc-core-job-tasks');
 if(!documents)return;
 const tasks=bcCoreJobTasks.filter(t=>String(t.job_id)===String(bcDetailJobId));
 const outstanding=tasks.filter(t=>t.status!=='Completed').length;
 let block=existing;
 if(!block){
  block=document.createElement('details');
  block.className='bc-core-job-tasks bc-collapse-section';
 }
 block.classList.add('bc-collapse-section');
 block.classList.remove('panel');
 block.innerHTML='<summary><span>Job Tasks</span><span class="bc-collapse-meta">'+outstanding+' outstanding · '+tasks.length+' total</span></summary>'+
 '<div class="bc-collapse-content"><div class="bc-task-expand-list">'+
 (tasks.map(bcCoreTaskRow).join('')||'<p class="muted">No tasks added to this job yet.</p>')+
 '</div></div>';
 // Reuse the same panel and spacing as Job Documents, Approvals, and Correspondence.
 documents.before(block);
}
const bcJobTasksLayoutPreviousRender=render;
render=function(){
 bcJobTasksLayoutPreviousRender();
 bcPlaceJobTasksInDetails();
};
</script>
