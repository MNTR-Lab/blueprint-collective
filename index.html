 const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to save job');return j;
}
async function bcCoreLoadJobs(){bcJobsBusy=true;bcJobsError='';if(page==='jobs')render();try{const j=await bcJobsRequest({action:'list'});bcCoreJobs=j.jobs||[];bcJobsLoaded=true;}catch(e){bcJobsError=e.message||String(e)}finally{bcJobsBusy=false;if(page==='jobs')render()}}
function bcCoreOpenJobs(clientId){bcJobClientFilter=clientId?String(clientId):'';bcJobEditing='';bcJobFormOpen=!!clientId;navigate('jobs');bcCoreLoadJobs()}
function bcCoreJobEdit(id){bcJobEditing=id;bcJobFormOpen=true;render()}
function bcJobNew(){bcJobEditing='';bcJobFormOpen=true;render()}
function bcJobCancel(){bcJobEditing='';bcJobFormOpen=false;render()}
async function bcJobSubmit(e){
 e.preventDefault();const f=e.currentTarget;const submit=f.querySelector('[type=submit]');if(submit)submit.disabled=true;
 const editing=bcCoreJobs.find(x=>x.id===bcJobEditing);const client=bcClients.find(x=>String(x.id)===String(f.elements.clientId?.value||''));
 const payload={action:editing?'update':'create',title:f.elements.title.value.trim(),description:f.elements.description.value.trim(),dueDate:f.elements.dueDate.value||null};
 if(editing){payload.id=editing.id;payload.status=f.elements.status.value;payload.due_date=payload.dueDate;delete payload.dueDate;}
 else{if(!client){alert('Choose a client first.');if(submit)submit.disabled=false;return;}payload.clientId=String(client.id);payload.clientName=client.name;}
 try{await bcJobsRequest(payload);bcJobFormOpen=false;bcJobEditing='';await bcCoreLoadJobs();}catch(err){alert(err.message||'Unable to save job');if(submit)submit.disabled=false;}
}
function bcJobsPage(){
 const client=bcClients.find(c=>String(c.id)===bcJobClientFilter);
 const list=bcCoreJobs.filter(j=>!bcJobClientFilter||String(j.client_external_id)===bcJobClientFilter);
 const editing=bcCoreJobs.find(j=>j.id===bcJobEditing);
 const opt=bcClients.map(c=>'<option value="'+esc(c.id)+'" '+(String(c.id)===String(editing?.client_external_id||bcJobClientFilter)?'selected':'')+'>'+esc(c.name)+'</option>').join('');
 const statuses=bcCoreJobStatuses.map(st=>'<option value="'+esc(st)+'" '+(editing?.status===st?'selected':'')+'>'+esc(st)+'</option>').join('');
 const form=bcJobFormOpen?'<section class="panel" style="margin:14px 0"><h3>'+(editing?'Edit Job':'Create New Job')+'</h3><form onsubmit="bcJobSubmit(event)" style="display:grid;gap:12px;max-width:720px">'+
 '<label>Client<select name="clientId" required '+(editing?'disabled':'')+' style="width:100%;padding:10px"><option value="">Select a client</option>'+opt+'</select></label>'+
 '<label>Job Title<input name="title" required maxlength="200" style="width:100%;padding:10px" value="'+esc(editing?.title||'')+'"></label>'+
 '<label>Description<textarea name="description" rows="4" style="width:100%;padding:10px">'+esc(editing?.description||'')+'</textarea></label>'+
 '<label>Due Date<input name="dueDate" type="date" style="width:100%;padding:10px" value="'+esc(editing?.due_date||'')+'"></label>'+
 (editing?'<label>Status<select name="status" style="width:100%;padding:10px">'+statuses+'</select></label>':'<p class="muted">New jobs start with status: New</p>')+
 '<div><button class="btn" type="submit">'+(editing?'Save Job Changes':'Create Job')+'</button> <button class="btn secondary" type="button" onclick="bcJobCancel()">Cancel</button></div></form></section>':'';
 const rows=list.map(j=>'<tr><td><b>'+esc(j.job_number)+'</b></td><td>'+esc(j.title)+'</td><td>'+esc(j.client_name)+'</td><td>'+esc(j.status)+'</td><td>'+esc(j.due_date||'—')+'</td><td><span title="Blueprint Collective database synchronization status">'+(j.sync_status==='synced'?'Synced':'Awaiting Sync')+'</span></td><td><button class="btn secondary" onclick="bcCoreJobEdit(\''+esc(j.id)+'\')">Edit</button></td></tr>').join('');
 return '<div class="heading"><div><h2>Jobs & Projects</h2><p>Manage client work directly in Blueprint Collective.</p></div><div><button class="btn secondary" onclick="bcCoreLoadJobs()">Refresh</button> <button class="btn" onclick="bcJobNew()">+ New Job</button></div></div>'+
 '<section class="panel"><label>Filter by client <select style="padding:8px;margin-left:8px" onchange="bcJobClientFilter=this.value;bcJobFormOpen=false;render()"><option value="">All Clients</option>'+bcClients.map(c=>'<option value="'+esc(c.id)+'" '+(String(c.id)===bcJobClientFilter?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>'+
 '<p class="muted">'+list.length+' job(s)'+(client?' for '+esc(client.name):'')+' · Jobs are managed in Blueprint Collective.</p></section>'+
 (bcJobsError?'<div class="alert">'+esc(bcJobsError)+'</div>':'')+form+
 '<section class="panel"><div class="tablewrap"><table><thead><tr><th>Job #</th><th>Job</th><th>Client</th><th>Status</th><th>Due</th><th>Database Status</th><th></th></tr></thead><tbody>'+(bcJobsBusy?'<tr><td colspan="7">Loading jobs…</td></tr>':rows||'<tr><td colspan="7">No jobs yet. Select New Job to create the first one.</td></tr>')+'</tbody></table></div></section>';
}
const bcRenderBeforeJobs=render;
render=function(){bcRenderBeforeJobs();if(page==='jobs'){const view=document.getElementById('view');if(view)view.innerHTML=bcSession?bcJobsPage():'<section class="panel"><h2>Jobs & Projects</h2><p>Connecting to your selected Blueprint Collective workspace…</p></section>';}};
const bcNavigateBeforeJobs=navigate;
navigate=function(p){bcNavigateBeforeJobs(p);if(p==='jobs'&&!bcJobsLoaded&&!bcJobsBusy&&bcSession)bcCoreLoadJobs();};
const bcClientRowsBeforeJobs=bcClientRows;
bcClientRows=function(items){const html=bcClientRowsBeforeJobs(items);return html.replace(/(<button class="btn secondary" onclick="bcOpenClientHistory\('([^']+)'\)">History<\/button>)/g,(_,button,id)=>button+' <button class="btn secondary" onclick="bcCoreOpenJobs(\''+id+'\')">Jobs</button>');};

</script>

<script>
/* Blueprint Collective job detail workspace. All changes originate here. */
let bcDetailJobId='',bcDetailData=null,bcDetailBusy=false,bcDetailError='';
const bcJobPageBeforeDetails=bcJobsPage;
bcJobsPage=function(){
 const base=bcJobPageBeforeDetails();
 if(!bcDetailJobId)return base.replace('</tbody></table>', '</tbody></table>');
 const j=bcCoreJobs.find(x=>x.id===bcDetailJobId);
 if(!j)return base;
 const h=esc;
 const details=bcDetailBusy?'<p>Loading job details…</p>':bcDetailError?'<p class="notice">'+h(bcDetailError)+'</p>':!bcDetailData?'<p>Open the job to view its records.</p>':
 '<div style="display:grid;gap:16px">'+
 '<div><h3>Job Notes</h3><form onsubmit="bcDetailAddNote(event)"><textarea name="body" rows="3" maxlength="10000" required placeholder="Add an internal job note" style="width:100%;padding:10px"></textarea><button class="btn" type="submit">Save Note</button></form>'+
 (bcDetailData.notes.length?bcDetailData.notes.map(n=>'<div style="padding:12px;border-bottom:1px solid #ddd"><small>'+h(new Date(n.created_at).toLocaleString())+'</small><p style="white-space:pre-wrap">'+h(n.body)+'</p></div>').join(''):'<p class="muted">No notes yet.</p>')+'</div>'+
 '<div class="bc-documents"><div class="bc-doc-heading"><div><h3>Job Documents</h3><p class="muted">Keep quotes, proofs, invoices, and approvals organized with this job.</p></div><span class="bc-doc-count">'+bcDetailData.documents.length+' file(s)</span></div><form class="bc-upload-form" onsubmit="bcDetailUpload(event)"><div class="bc-upload-top"><label for="bcDocumentCategory">Document Type</label><select id="bcDocumentCategory" name="category"><option>Quote</option><option>Proof</option><option>Invoice</option><option>Approval</option><option>Other</option></select></div><div class="bc-upload-drop" id="bcUploadDrop" ondragover="bcDetailDragOver(event)" ondragleave="bcDetailDragLeave(event)" ondrop="bcDetailDrop(event)"><input type="file" name="file" id="bcUploadFile" required onchange="bcDetailFileChanged(this)"><label for="bcUploadFile" class="bc-upload-pick"><span class="bc-upload-icon">↑</span><strong>Choose a file or drag it here</strong><span>PDFs, images and other documents · Up to 15 MB</span><span class="bc-upload-browse">Browse files</span></label></div><div id="bcUploadSelected" class="bc-upload-selected" aria-live="polite">No file selected</div><div class="bc-upload-actions"><span id="bcUploadProgress" class="muted" role="status">Files are stored securely with this job.</span><button class="btn" type="submit">Upload Document</button></div></form>'+
 (bcDetailData.documents.length?'<div class="tablewrap"><table><thead><tr><th>Document</th><th>Category</th><th>Added</th><th></th></tr></thead><tbody>'+bcDetailData.documents.map(d=>'<tr><td>'+h(d.filename)+'</td><td>'+h(d.category)+'</td><td>'+h(new Date(d.created_at).toLocaleDateString())+'</td><td><button class="btn secondary" onclick="bcDetailDownload(\''+h(d.id)+'\')">Download</button> <button class="btn secondary" onclick="bcDetailView(\''+h(d.id)+'\')">View</button></td></tr>').join('')+'</tbody></table></div>':'<p class="muted">No documents yet.</p>')+'</div>'+
 '<p class="muted">Job correspondence and approval workflows will be connected in the next phase.</p></div>';
 return base+'<section class="panel" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>Job Details</h2><p>'+h(j.job_number)+' · '+h(j.title)+' · '+h(j.client_name)+'</p></div><button class="btn secondary" onclick="bcDetailClose()">Close Details</button></div>'+details+'</section>';
};
const bcJobsRenderBeforeDetails=render;
render=function(){
 bcJobsRenderBeforeDetails();
 if(page==='jobs'){
 const table=document.querySelector('#view table tbody');
 if(table){
 for(const row of table.rows){
  const edit=row.querySelector('button[onclick^="bcCoreJobEdit"]');
  if(!edit)continue;
  const id=edit.getAttribute('onclick').match(/'([^']+)'/)?.[1];
  if(!id||row.querySelector('.bc-detail-open'))continue;
  const button=document.createElement('button');
  button.type='button';button.className='btn secondary bc-detail-open';button.textContent='Details';
  button.onclick=()=>bcDetailOpen(id);
  edit.parentElement.insertBefore(button,edit);
 }
 }
 }
};
async function bcDetailOpen(id){
 bcDetailJobId=id;bcDetailBusy=true;bcDetailError='';bcDetailData=null;render();
 await bcDetailReload();
}
async function bcDetailReload(){
 try{const r=await bcJobsRequest({action:'details',id:bcDetailJobId});bcDetailData=r;bcDetailError='';}
 catch(e){bcDetailError=e.message||String(e);}
 finally{bcDetailBusy=false;render();}
}
function bcDetailClose(){bcDetailJobId='';bcDetailData=null;render()}
async function bcDetailAddNote(e){
 e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;
 try{await bcJobsRequest({action:'addNote',id:bcDetailJobId,body:f.elements.body.value});await bcDetailReload();}
 catch(err){alert('Unable to save note: '+err.message);b.disabled=false;}
}
function bcDetailFileChanged(input){
 const file=input.files&&input.files[0],label=document.getElementById('bcUploadSelected');
 if(!label)return;
 label.textContent=file?'Selected: '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB)':'No file selected';
 label.classList.toggle('has-file',!!file);
}
function bcDetailDragOver(event){event.preventDefault();event.dataTransfer.dropEffect='copy';document.getElementById('bcUploadDrop')?.classList.add('dragging')}
function bcDetailDragLeave(event){if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('dragging')}
function bcDetailDrop(event){
 event.preventDefault();event.currentTarget.classList.remove('dragging');
 const file=event.dataTransfer.files?.[0],input=document.getElementById('bcUploadFile');
 if(!file||!input)return;
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;bcDetailFileChanged(input);
}
async function bcDetailUpload(e){
 e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),file=f.elements.file.files[0];
 if(!file)return;if(file.size>15*1024*1024){alert('Maximum file size is 15 MB');return;}
 b.disabled=true;
 const progress=document.getElementById('bcUploadProgress');if(progress)progress.textContent='Preparing your file…';
 try{
 const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)});
 if(progress)progress.textContent='Uploading securely…';
 await bcJobsRequest({action:'uploadDocument',id:bcDetailJobId,filename:file.name,category:f.elements.category.value,contentType:file.type||'application/octet-stream',base64});
 await bcDetailReload();
 }catch(err){if(progress)progress.textContent='Upload unsuccessful. Please try again.';alert('Upload failed: '+err.message);b.disabled=false;}
}

async function bcDetailView(documentId){
 try{
  const doc=bcDetailData?.documents?.find(d=>d.id===documentId);
  if(!doc)throw Error('Document not found');
  const r=await bcJobsRequest({action:'downloadDocument',id:bcDetailJobId,documentId});
  const type=(doc.content_type||'').toLowerCase();
  const safeName=String(doc.filename||'Document').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isImage=type.startsWith('image/') && !type.includes('svg');
  const isPdf=type==='application/pdf'||doc.filename.toLowerCase().endsWith('.pdf');
  if(!isImage&&!isPdf){window.open(r.url,'_blank','noopener,noreferrer');return}
  let modal=document.getElementById('bcDocumentViewer');
  if(modal)modal.remove();
  modal=document.createElement('div');modal.id='bcDocumentViewer';modal.className='bc-doc-viewer';
  modal.innerHTML='<div class="bc-doc-viewer-panel" role="dialog" aria-modal="true" aria-label="Document preview"><div class="bc-doc-viewer-header"><strong>'+safeName+'</strong><div><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="'+r.url+'">Open in New Tab</a> <button class="btn secondary" type="button" onclick="bcDetailCloseView()">Close</button></div></div><div class="bc-doc-viewer-body"></div></div>';
  modal.addEventListener('click',e=>{if(e.target===modal)bcDetailCloseView()});
  const body=modal.querySelector('.bc-doc-viewer-body');
  const preview=document.createElement(isImage?'img':'iframe');
  preview.src=r.url;
  if(!isImage)preview.title='Document preview';
  body.appendChild(preview);document.body.appendChild(modal);
 }catch(err){alert('Unable to view document: '+err.message)}
}
function bcDetailCloseView(){document.getElementById('bcDocumentViewer')?.remove()}

async function bcDetailDownload(documentId){
 try{const r=await bcJobsRequest({action:'downloadDocument',id:bcDetailJobId,documentId});window.open(r.url,'_blank','noopener,noreferrer')}
 catch(err){alert('Download failed: '+err.message)}
}
</script>

.bc-doc-heading h3{margin:0 0 4px}.bc-doc-heading p{margin:0}.bc-doc-count{font-size:12px;font-weight:700;background:#eef3f9;color:#243e5a;border-radius:20px;padding:6px 12px;white-space:nowrap}

.bc-upload-selected{font-size:13px;color:#64748b;padding:12px 2px;overflow-wrap:anywhere}
