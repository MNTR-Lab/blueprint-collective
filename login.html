<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Blueprint Collective</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17283e;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}button,input{font:inherit}button{cursor:pointer}.wrap{width:100%;max-width:490px}.brand{text-align:center;margin-bottom:26px;color:#11253e;font-size:23px;font-weight:850;letter-spacing:-.6px}.brand small{display:block;font-size:11px;letter-spacing:2.4px;color:#73859a;margin-top:7px}.panel{background:#fff;border:1px solid #e1e8f1;box-shadow:0 14px 40px #19324d10;border-radius:17px;padding:30px}.title{font-size:24px;font-weight:800;margin:0 0 8px}.muted{color:#6b7c91;font-size:13px;line-height:1.6}.field{display:block;margin-top:18px;font-size:12px;color:#53657b;font-weight:700}.field input{display:block;width:100%;margin-top:8px;border:1px solid #d8e1ec;padding:13px;border-radius:9px;color:#18283e;background:#fff}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:#173d66;color:#fff;font-weight:750;margin-top:22px}.btn:disabled{opacity:.5}.alt{background:#eef3f8;color:#173d66;margin-top:10px}.error{color:#ad3c38;font-size:13px;margin-top:13px;min-height:16px}.hidden{display:none}.item{border:1px solid #dfe7f0;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.item strong{display:block;font-size:14px}.item small{color:#718399;font-size:12px}.open{width:auto;margin:0;padding:10px 15px}.pill{display:inline-block;background:#edf4fa;color:#365e83;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:750}.foot{text-align:center;color:#9aa6b6;font-size:11px;margin-top:20px}
</style></head><body><div class="wrap"><div class="brand">BLUEPRINT COLLECTIVE<small>YOUR WORKSPACE, ONE LOGIN</small></div><div class="panel"><div id="login"><h1 class="title">Welcome Back</h1><p class="muted">Sign in to open your organization's Blueprint Collective workspace.</p><label class="field">Email Address<input id="email" type="email" autocomplete="email" placeholder="you@company.com"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></label><button class="btn" id="signIn">Sign In</button><div class="error" id="loginError"></div></div><div id="loading" class="hidden"><h1 class="title">Finding your workspace</h1><p class="muted">Checking your organization and access level…</p></div><div id="chooser" class="hidden"><div class="pill">SIGNED IN</div><h1 class="title" style="margin-top:14px">Choose Your Workspace</h1><p class="muted" id="identity"></p><div id="workspaces"></div><button class="btn alt" id="signOut">Sign Out</button><div class="error" id="chooseError"></div></div></div><div class="foot">Blueprint Collective · Secure organization access</div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://lbheezjanvalalinqxcd.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiaGVlemphbnZhbGFsaW5xeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjIwNDcsImV4cCI6MjEwNzEzODA0N30.lDap2OWhFi3udJQorDmtEKF-WhOt62I8ZLbENQRqaoM',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const endpoint='https://lbheezjanvalalinqxcd.supabase.co/functions/v1/blueprint-access';
function view(id){for(const x of ['login','loading','chooser'])$(x).classList.toggle('hidden',x!==id)}
function item(title,subtitle,url){const div=document.createElement('div');div.className='item';const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('small');small.textContent=subtitle;info.append(strong,small);const b=document.createElement('button');b.className='btn open';b.textContent='Open';b.onclick=()=>{location.href=url};div.append(info,b);$('workspaces').append(div)}
async function route(){view('loading');try{const {data:{session}}=await supabase.auth.getSession();if(!session){view('login');return}const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiaGVlemphbnZhbGFsaW5xeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjIwNDcsImV4cCI6MjEwNzEzODA0N30.lDap2OWhFi3udJQorDmtEKF-WhOt62I8ZLbENQRqaoM',Authorization:'Bearer '+session.access_token},body:JSON.stringify({})});const data=await response.json();if(!response.ok)throw Error(data.error||'Access check failed');$('workspaces').replaceChildren();$('identity').textContent='Signed in as '+data.email;if(data.platform_super_admin)item('Platform Super Admin','Blueprint Collective platform settings','/super-admin.html');for(const o of data.organizations||[]){const url=o.role==='admin'?'/index.html':'/employee.html';item(o.name,o.role==='admin'?'Organization Administrator':'Employee Workspace',url+'?organization='+encodeURIComponent(o.id))}view('chooser');if(!data.platform_super_admin&&!(data.organizations||[]).length)$('chooseError').textContent='No organization is assigned to this account. Contact your administrator.';else $('chooseError').textContent='';if(!data.platform_super_admin&&(data.organizations||[]).length===1){const o=data.organizations[0];location.replace((o.role==='admin'?'/index.html':'/employee.html')+'?organization='+encodeURIComponent(o.id))}}catch(e){view('login');$('loginError').textContent=e.message}}
$('signIn').onclick=async()=>{$('loginError').textContent='';$('signIn').disabled=true;try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await route()}catch(e){view('login');$('loginError').textContent=e.message}finally{$('signIn').disabled=false}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});
$('signOut').onclick=async()=>{await supabase.auth.signOut();view('login')};
const {data:{session}}=await supabase.auth.getSession();if(session)await route();
</script></body></html>
